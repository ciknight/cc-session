<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>Claude Sessions 监控</title>
<script src="/static/marked.min.js"></script>
<script src="/static/purify.min.js"></script>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f6f6f4;--card2:#efefec;--mut:#777;--bd:#e2e2de;--acc:#2563eb;--accbg:#dbeafe;--keyboard-height:0px}
@media(prefers-color-scheme:dark){:root{--bg:#1b1b1a;--fg:#eee;--card:#262625;--card2:#2e2d2c;--mut:#999;--bd:#3a3a38;--acc:#60a5fa;--accbg:#1e3a5f}}
*{box-sizing:border-box}
html{height:100%;margin:0}
body{height:calc(100% - var(--keyboard-height,0px));margin:0;font:14px/1.55 system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--bd);flex:none}
h1{font-size:16px;margin:0}
.hdr-label-short,.hdr-break{display:none}
.ctl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
select{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:2px 6px}
/* 开关 */
.sw{position:relative;display:inline-block;width:36px;height:20px}
.sw input{display:none}
.sw i{position:absolute;inset:0;background:var(--bd);border-radius:20px;transition:.2s;cursor:pointer}
.sw i:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i:before{transform:translateX(16px)}
/* 布局 */
#app{flex:1;display:grid;grid-template-columns:280px 1fr;min-height:0}
aside{border-right:1px solid var(--bd);overflow-y:auto;padding:8px}
main{overflow-y:auto;padding:12px 18px;min-width:0}
/* 项目列表 */
.pitem{padding:8px 10px;border-radius:8px;cursor:pointer;margin:2px 0;border:1px solid transparent;position:relative}
.pitem:hover{background:var(--card)}
.pitem.active{background:var(--card);border-color:var(--bd)}
.newbtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;
        border:1px solid var(--bd);border-radius:6px;color:var(--mut);cursor:pointer;
        font-size:13px;line-height:1;padding:4px 8px}
.newbtn:hover{border-color:var(--acc);color:var(--fg)}
.pname{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{font-size:12px;color:var(--mut)}
/* 会话卡片与稳定的项目内工具栏 */
.list-toolbar{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:12px 0}
.list-toolbar label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.list-search{flex:1 1 220px;min-width:0}
.list-toolbar input{width:100%;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:4px 8px;font:inherit}
.list-toolbar select{font:inherit;padding:4px 6px}
.list-toolbar input:focus-visible,.list-toolbar select:focus-visible,.list-toolbar button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.scard{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin:8px 0;cursor:pointer}
.scard:hover{border-color:var(--acc)}
.stitle{font-weight:600;margin:2px 0}
.b{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:#fff;white-space:nowrap}
.working{background:#d97706}.idle{background:#16a34a}.stale{background:#888}
.chip{display:inline-block;padding:0 7px;border:1px solid var(--bd);border-radius:10px;font-size:12px;color:var(--mut);margin:1px 2px;background:var(--card)}
.chip.warn{color:#b45309;border-color:rgba(217,119,6,.4);background:rgba(217,119,6,.10)}
.mut{color:var(--mut);font-size:12px}
.grid{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0;font-size:12px;color:var(--mut)}
.grid b{color:var(--fg);font-weight:600}
ul{margin:6px 0;padding-left:18px}
.completed{text-decoration:line-through;color:var(--mut)}
.in_progress{font-weight:600}
h4,h5{margin:10px 0 2px;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.fold{margin:8px 0 2px}
.fold>summary{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;list-style:none;user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary:before{content:"▸ "}
.fold[open]>summary:before{content:"▾ "}
.fold ul{max-height:300px;overflow-y:auto}
.empty{color:var(--mut);padding:40px;text-align:center}
#err{color:#dc2626;font-size:12px}
.back{background:none;border:1px solid var(--bd);border-radius:6px;color:var(--fg);padding:3px 12px;cursor:pointer;font-size:13px}
.back:hover{border-color:var(--acc)}
/* 对话 */
.msg{margin:10px 0}
.mhead{font-size:11px;color:var(--mut);margin-bottom:2px}
.ubody{background:var(--accbg);border-radius:10px;padding:8px 12px;white-space:pre-wrap;word-break:break-word;max-width:85%}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .mhead{text-align:right}
.msg.user.pending{opacity:.55}
.msg.user.pending.failed{opacity:1}
.msg.user.pending.failed .mhead{color:#ef4444}
.abody{max-width:100%;word-break:break-word}
.abody pre{background:var(--card2);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;overflow-x:auto;font-size:12.5px}
.abody code{font-family:ui-monospace,monospace;font-size:12.5px;background:var(--card2);padding:0 3px;border-radius:4px}
.abody pre code{background:none;padding:0}
.abody p{margin:4px 0}
.abody h1,.abody h2,.abody h3{font-size:15px;margin:8px 0 4px}
.abody table{border-collapse:collapse}.abody td,.abody th{border:1px solid var(--bd);padding:2px 8px;font-size:13px}
.tool{font:12px ui-monospace,monospace;color:var(--mut);background:var(--card2);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;margin:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.terror{font-size:12px;color:#dc2626;background:rgba(220,38,38,.08);border-radius:6px;padding:2px 8px;margin:3px 0}
.apierr{font-size:12px;color:#b45309;background:rgba(217,119,6,.10);border:1px solid rgba(217,119,6,.4);
  border-radius:6px;padding:6px 10px;margin:8px 0;white-space:pre-wrap}
.tool-details{margin:3px 0;font-size:12px}
.tool-details>summary{cursor:pointer;color:var(--mut);font-family:ui-monospace,monospace;
  background:var(--card2);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-out{margin:4px 0;max-height:320px;overflow:auto;background:var(--card2);
  border:1px solid var(--bd);border-radius:6px;padding:6px 8px;white-space:pre-wrap;
  font:12px ui-monospace,monospace}
.diff-add{color:#16a34a}.diff-del{color:#dc2626}.diff-hunk{color:var(--acc)}
.cmd{background:var(--card2);border:1px solid var(--bd);border-radius:6px;padding:4px 10px;font-size:12.5px;display:inline-block;margin:2px 0}
/* 工具卡：按工具类型给出颜色、状态与摘要 */
.tool-details>summary{display:flex;align-items:center;gap:6px}
.tool-kind{flex:none;font-weight:600;color:var(--fg)}
.tool-value{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
.tool-stats{flex:none;font-size:11px;color:#16a34a}
.tool-stats .del{color:#dc2626}
.tool-status{flex:none;font-size:10px;border-radius:4px;padding:0 5px;border:1px solid var(--bd);color:var(--mut)}
.tool-status.running{color:#2563eb;border-color:rgba(37,99,235,.4);background:rgba(37,99,235,.08)}
.tool-status.done{color:#16a34a;border-color:rgba(22,163,74,.35);background:rgba(22,163,74,.08)}
.tool-status.error{color:#dc2626;border-color:rgba(220,38,38,.4);background:rgba(220,38,38,.08)}
.tool-status.stale{color:var(--mut);border-style:dashed}
.tool-cat-bash>summary{border-left:3px solid #16a34a}
.tool-cat-edit>summary{border-left:3px solid #d97706}
.tool-cat-search>summary{border-left:3px solid #64748b}
.tool-cat-agent>summary{border-left:3px solid #a855f7}
.tool-cat-task>summary{border-left:3px solid #8b5cf6}
.tool-cat-web>summary{border-left:3px solid #0ea5e9}
.tool-group{margin:4px 0}
.tool-group>summary{cursor:pointer;font:12px ui-monospace,monospace;color:var(--mut);
  background:var(--card2);border:1px solid var(--bd);border-radius:6px;padding:3px 8px;
  display:flex;align-items:center;gap:6px;overflow:hidden}
.tool-group>summary .tool-count{flex:none;border:1px solid var(--bd);border-radius:8px;padding:0 5px;font-size:10px}
.tool-group-body{padding-left:10px;border-left:1px dashed var(--bd);margin:2px 0 4px 4px}
/* 子代理卡片 */
.agent-card{margin:5px 0;border:1px solid var(--bd);border-left:3px solid #a855f7;border-radius:8px;background:var(--card);padding:6px 9px}
.agent-card>summary{cursor:pointer;display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--mut);font-size:12px}
.agent-name{font-weight:600;color:var(--fg)}
.agent-desc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-badge{flex:none;font-size:10px;border:1px solid var(--bd);border-radius:8px;padding:0 5px}
.agent-body{margin-top:5px;font-size:12px}
.agent-prompt{white-space:pre-wrap;max-height:160px;overflow:auto;background:var(--card2);border-radius:6px;padding:5px 7px;margin:4px 0}
.agent-actions{display:flex;gap:8px;margin-top:4px}
.agent-actions .back{font-size:11px;padding:1px 8px}
/* 后台任务条 */
#bgstrip{flex:none;margin:0 18px;padding:4px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--bd)}
#bgstrip[hidden]{display:none}
.bgchip{font:inherit;font-size:11px;border:1px solid rgba(168,85,247,.35);background:rgba(168,85,247,.08);
  border-radius:10px;padding:1px 7px;color:var(--mut);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bgchip b{color:var(--fg);font-weight:600}
/* 压缩 / 思考 */
.compact-card{margin:6px 0;border:1px solid var(--bd);border-left:3px solid #64748b;border-radius:6px;
  background:var(--card2);padding:3px 8px;font:12px ui-monospace,monospace;color:var(--mut)}
.compact-card b{color:var(--fg)}
.compact-summary{margin:2px 0 6px}
.thinking{margin:3px 0;font-size:12px}
.thinking>summary{cursor:pointer;color:var(--mut)}
.think-body{white-space:pre-wrap;border-left:2px solid var(--bd);padding:3px 8px;margin:3px 0;color:var(--mut);max-height:240px;overflow:auto}
/* 消息复制 / 图片灯箱 / 连接状态 / token chip */
.mhead{display:flex;align-items:center;gap:8px}
.msg.user .mhead{justify-content:flex-end}
.copybtn{background:none;border:none;color:var(--mut);cursor:pointer;font:inherit;padding:0 3px;opacity:.55}
.copybtn:hover{opacity:1;color:var(--acc)}
.msg.user .mhead .copybtn{order:-1}
#lightbox{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center}
#lightbox[hidden]{display:none}
#lightbox img{max-width:92vw;max-height:90vh;object-fit:contain;border-radius:6px}
#lightbox button{position:absolute;right:18px;top:14px;background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:50%;width:34px;height:34px;font-size:20px;cursor:pointer}
img.msg-image{cursor:zoom-in}
#connbadge{display:none}
.tok-chip{flex:none;border:1px solid var(--bd);border-radius:10px;padding:0 7px;font-size:12px;color:var(--mut);cursor:pointer;background:var(--card)}
.tok-chip:hover{border-color:var(--acc)}
.tok-chip[hidden]{display:none}
/* 待审批卡片：权限 / 计划 / 问答共用 */
.inter-card{background:var(--card);border:1px solid var(--bd);border-left:3px solid #d97706;
  border-radius:8px;padding:10px 14px;margin:10px 0}
.inter-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.inter-kind{font-size:11px;font-weight:600;letter-spacing:.04em;color:#b45309;
  background:rgba(217,119,6,.12);border-radius:4px;padding:1px 7px}
.inter-tool{font:12px ui-monospace,monospace;color:var(--mut)}
.inter-reason{font-size:12.5px;color:var(--mut);white-space:pre-wrap;margin-bottom:6px}
.inter-card pre,.inter-preview{margin:4px 0;max-height:240px;overflow:auto;background:var(--card2);
  border:1px solid var(--bd);border-radius:6px;padding:6px 8px;white-space:pre-wrap;
  font:12px ui-monospace,monospace}
.inter-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:10px}
.ibtn{font:inherit;font-size:13px;padding:4px 14px;border-radius:6px;cursor:pointer;
  border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.ibtn:hover{border-color:var(--acc)}
.ibtn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.ibtn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.ibtn.primary:hover{filter:brightness(1.08)}
.ibtn.secondary{background:none;border-color:var(--acc);color:var(--acc)}
.ibtn.danger{background:none;border-color:#dc2626;color:#dc2626}
.ibtn.danger:hover{background:rgba(220,38,38,.08)}
/* 问答：选项整行可选，选中高亮 */
.choice-q+.choice-q{margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
.choice-head{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.choice-text{margin-bottom:6px}
.choice-opt{position:relative;display:flex;flex-direction:column;gap:2px;width:100%;
  margin:4px 0;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;
  background:var(--bg);cursor:pointer}
.choice-opt:hover{border-color:var(--acc)}
.choice-opt:has(input:checked){border-color:var(--acc);background:var(--accbg)}
.choice-opt:focus-within{outline:2px solid var(--acc);outline-offset:1px}
.choice-opt input{position:absolute;opacity:0;pointer-events:none}
.opt-desc{font-size:12px;color:var(--mut)}
.opt-preview{display:block;margin-top:2px;white-space:pre-wrap;overflow:auto;max-height:180px;
  font:11px ui-monospace,monospace;color:var(--mut);background:var(--card2);
  border:1px solid var(--bd);border-radius:4px;padding:4px 6px}
.choice-free{width:100%;margin-top:6px;background:var(--bg);color:var(--fg);
  border:1px solid var(--bd);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px}
.choice-free:focus{outline:none;border-color:var(--acc)}
#pendingbadge,.chip.pending{border-color:rgba(217,119,6,.5);background:rgba(217,119,6,.10);
  color:#b45309;font-weight:600}
#hostedbadge{border-color:rgba(22,163,74,.45);background:rgba(22,163,74,.10);
  color:#15803d;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.run{background:#f59e0b;animation:dotpulse 1.2s ease-in-out infinite}
.dot.done{background:#9ca3af}
.dot.stale{background:transparent;border:2px solid #9ca3af;width:6px;height:6px}
.dot.err{background:#ef4444}
@keyframes dotpulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(prefers-color-scheme:dark){
  .inter-card{border-left-color:#f59e0b}
  .inter-kind{color:#fbbf24;background:rgba(217,119,6,.18)}
  #pendingbadge,.chip.pending{color:#fbbf24}
  #hostedbadge{color:#86efac}
}
.sysbody{font-size:12.5px;color:var(--mut);white-space:pre-wrap;word-break:break-word;
         border:1px dashed var(--bd);border-radius:6px;padding:4px 8px;max-width:100%}
.msg.tool,.msg.system{display:flex;flex-direction:column;align-items:flex-start}
.info-panel{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;margin:10px 0}
.model-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.model-controls input{min-width:180px;max-width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:3px 8px;font:inherit;font-size:12px}
.model-controls input[hidden]{display:none}
.composer{position:relative}
.composer textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;resize:vertical;font:inherit;max-height:40vh;overflow-y:auto}
.msg-image{display:block;max-width:min(420px,100%);max-height:420px;object-fit:contain;
  border:1px solid var(--bd);border-radius:8px;margin:6px 0;background:var(--card2)}
#imageinput{display:none}
#imagedrafts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.image-draft{position:relative;width:72px;height:72px}
.image-draft .msg-image{width:72px;height:72px;margin:0;object-fit:cover}
.image-draft button{position:absolute;right:-5px;top:-5px;width:20px;height:20px;padding:0;
  border:1px solid var(--bd);border-radius:50%;background:var(--bg);color:var(--fg);cursor:pointer}
/* 次要控件：桌面原样展开；窄屏藏进 ⚙ 浮层（DOM 不动、事件不重挂） */
.composer-extra{display:contents}
.composer-cog{display:none}
#cmdhints{margin-top:4px;max-height:180px;overflow:auto;border:1px solid var(--bd);
  border-radius:6px;background:var(--bg);display:flex;flex-direction:column}
#cmdhints[hidden]{display:none}
.cmd-hint{text-align:left;background:none;border:none;color:var(--fg);padding:6px 10px;
  font:inherit;font-size:13px;cursor:pointer}
.cmd-hint.selected{background:var(--accbg)}
.composer-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
/* 发送状态：输入区上方的浮动胶囊，不占布局高度（旧版在输入框下方占一行，
   文案一出现就把发送区顶高，压缩对话区） */
.composer-status{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);
  width:max-content;max-width:min(90%,560px);margin:0;padding:3px 12px;z-index:5;
  background:var(--card);border:1px solid var(--bd);border-radius:999px;
  box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:12px;line-height:1.5;color:var(--mut);
  white-space:pre-wrap;overflow-wrap:anywhere;text-align:center;pointer-events:none}
.composer-status:empty{display:none}
.config-path{overflow-wrap:anywhere;font-family:ui-monospace,monospace;font-size:12px;margin:3px 0}
button:disabled,select:disabled{opacity:.5;cursor:not-allowed}
.metadata-actions{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:8px}
.queue-job{padding:8px 0;border-top:1px solid var(--bd)}
.queue-text{white-space:pre-wrap;overflow-wrap:anywhere;max-height:8em;overflow:auto}
#queuepop h5{margin:8px 0 0;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
/* 会话视图：聊天窗口布局——头部固定、消息区滚动、发送区沉底。
   convview 由 renderMain 在进入/离开会话视图时显式切换，不依赖 :has()（旧引擎也能布局） */
main.convview{display:flex;flex-direction:column;overflow:hidden;padding:0}
/* 顶部区（标题/概览/待审批）整体限高滚动：main 是 overflow:hidden，
   待审批卡片很高时若让 conv-top 无限增高，卡片底部按钮会被裁掉 */
.conv-top{flex:0 1 auto;min-height:0;padding:10px 18px 4px;border-bottom:1px solid var(--bd);
  max-height:60vh;overflow-y:auto;overscroll-behavior:contain}
.conv-head{display:flex;align-items:center;gap:8px}
.conv-head h2{font-size:16px;margin:8px 0 4px;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#conv{flex:1;min-height:0;overflow-y:auto;padding:6px 18px}
main.convview .composer{flex:none;margin:10px 18px 12px}
.load-earlier{display:block;width:fit-content;max-width:100%;margin:0 auto 10px;padding:4px 18px;
  border:1px dashed var(--bd);border-radius:999px;background:var(--card);color:var(--mut);
  font:inherit;font-size:13px;cursor:pointer}
.load-earlier:hover{color:var(--fg);border-color:var(--acc)}
.conv-overview>summary{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:none}
/* 队列摘要内联在模型选择行右侧：只有 chip 文字可点击（不做悬停预览）；
   详情浮层挂在 body 顶层、固定定位随 chip 计算，不随 main 的 overflow 裁剪，
   也不被侧栏/抽屉遮挡 */
.queue-chip{display:inline-block;position:relative;font-size:12px;color:var(--mut);
  cursor:pointer;padding:2px 0}
#queuepop{position:fixed;z-index:200;width:min(80vw,480px);max-height:45vh;overflow-y:auto;
  background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;
  box-shadow:0 8px 24px rgba(0,0,0,.16);text-align:left}
#queuepop[hidden]{display:none}
/* 系统面板浮层：同 #queuepop 挂 body 顶层固定定位，锚定 header 的系统按钮 */
#syspop{position:fixed;z-index:200;width:min(90vw,340px);background:var(--bg);border:1px solid var(--bd);
  border-radius:8px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.16);text-align:left}
#syspop[hidden]{display:none}
/* 提示词模板浮层：同 #queuepop/#syspop 挂 body 顶层，锚定发送框的「模板」按钮 */
#tplpop{position:fixed;z-index:200;width:min(92vw,460px);max-height:min(70vh,520px);
  overflow-y:auto;background:var(--bg);border:1px solid var(--bd);border-radius:8px;
  padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.16);text-align:left}
#tplpop[hidden]{display:none}
.tplhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.tplsearch{width:100%;box-sizing:border-box;font:inherit;font-size:13px;padding:5px 8px;
  background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;margin:4px 0 8px}
.tplitem{padding:8px 0;border-top:1px solid var(--bd)}
.tpltitle{font-weight:600;font-size:13px;cursor:pointer;overflow-wrap:anywhere}
.tpltext{font-size:12px;color:var(--mut);white-space:pre-wrap;overflow-wrap:anywhere;
  max-height:3.6em;overflow:hidden;margin:2px 0 4px;cursor:pointer}
.tplacts{display:flex;gap:6px}
.tplacts .back{font-size:12px;padding:2px 8px}
.tplform label{display:block;font-size:12px;color:var(--mut);margin:6px 0 3px}
.tplform input,.tplform textarea{width:100%;box-sizing:border-box;font:inherit;font-size:13px;
  padding:5px 8px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px}
.tplform textarea{min-height:110px;resize:vertical}
.tplfoot{margin-top:8px;padding-top:8px;border-top:1px solid var(--bd);display:flex;gap:8px;flex-wrap:wrap}
.sysrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--mut);margin-top:8px}
.sysbar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:3px}
.sysbar>i{display:block;height:100%;background:var(--acc)}
.sysbar.warn>i{background:#d97706}
.sysbar.hot>i{background:#dc2626}
.syscores{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:4px 10px;margin-top:6px}
.core{font-size:10px;color:var(--mut)}
.core .sysbar{height:4px;margin-top:2px}
.sysacts{display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--bd)}
.systimer{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--mut)}
.systimer select{font:inherit;font-size:12px;padding:2px 4px;background:var(--bg);color:var(--fg);
  border:1px solid var(--bd);border-radius:6px}
/* 沉浸模式：仅移动端会话视图生效（body.zen 由 applyZen 按视图同步），按钮也只在窄屏显示 */
#zenbtn{display:none}
#zenbtn.on{border-color:var(--acc);color:var(--acc)}
/* 移动端：抽屉式侧栏 */
#menu{display:none}
#mask{display:none}
@media(max-width:768px){
  #zenbtn{display:inline-block}
  /* 会话视图里全局徽章与低频控件（通知/系统）让位（列表页均可达），顶栏回到一行；
     沉浸时整个 header 与概览折叠行隐藏，消息区最大化 */
  body.insession #pendingbadge,body.insession #hostedbadge,
  body.insession #notifybtn,body.insession #sysbtn{display:none!important}
  body.zen header{display:none}
  body.zen .conv-overview{display:none}
  #app{grid-template-columns:1fr}
  #menu{display:inline-block}
  /* 顶部栏压成两行：标题行只留开关/间隔/系统图标，徽章与通知落到第二行；
     隐藏“自动刷新/间隔/系统”文字和更新时间，保留 aria-label/title */
  header{padding:6px 8px;gap:6px;row-gap:6px}
  header h1{font-size:15px;white-space:nowrap;min-width:0;flex:1 1 auto;
    overflow:hidden;text-overflow:ellipsis}
  header .hdr-label,#updated{display:none}
  header .hdr-label-short{display:inline}
  header .hdr-break{display:block;flex-basis:100%;height:0;margin:0}
  header .back{padding:2px 8px;font-size:12px}
  header .ctl{font-size:12px;gap:4px}
  #sysbtn{padding:2px 7px}
  main{padding:8px 10px}
  .conv-top{padding:4px 10px 2px}
  .conv-overview{margin:3px 0 1px}
  .conv-cwd{display:none}
  .conv-head{gap:6px}
  .conv-head .back-label,.conv-head .chip-label{display:none}
  .conv-head h2{font-size:14px;margin:2px 0}
  /* 概览摘要只保留对话数、子代理与任务；模型/分支/token 进展开面板看 */
  .conv-overview>summary .ov-model,.conv-overview>summary .ov-branch,
  .conv-overview>summary .ov-output,.conv-overview>summary .ov-ctx{display:none}
  #conv{padding:4px 10px 12px}
  main.convview .composer{margin:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
  .composer.info-panel{padding:8px 10px}
  #bgstrip{margin:0 10px}
  .composer textarea{resize:none}
  .composer-cog{display:inline-block}
  .composer-extra{display:none}
  .composer.open .composer-extra{display:flex;position:absolute;right:0;bottom:calc(100% + 6px);
    z-index:30;flex-direction:column;align-items:flex-start;gap:8px;background:var(--bg);
    border:1px solid var(--bd);border-radius:8px;padding:10px 12px;
    box-shadow:0 8px 24px rgba(0,0,0,.16);max-height:60vh;overflow-y:auto}
  /* 模型选择行保持单行：隐藏“模型选择”文字、控件可收缩、队列摘要靠右 */
  .composer .model-controls{flex-wrap:nowrap;gap:6px;margin:2px 0;min-width:0}
  .composer .model-controls>label.ctl{gap:4px;flex:0 1 auto;min-width:0}
  .composer .ctl-label{display:none}
  #modelsel{min-width:0;max-width:46vw;flex:0 1 auto;font-size:12px}
  #modelcustom{min-width:0;max-width:38vw;flex:1 1 70px}
  #modelst{flex:0 1 auto;min-width:0;max-width:30vw;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:11px}
  .tok-chip{flex:0 1 auto;max-width:24vw;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:11px}
  .queue-chip{flex:none;margin-left:auto;max-width:36vw;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;font-size:11px}
  /* 按钮行：收紧内边距与间距，发送/图片/中断/⚙ 始终同一行 */
  .composer-actions{flex-wrap:nowrap;gap:6px;margin-top:4px}
  .composer-actions>.back{flex:none;padding:5px 9px;min-height:32px;font-size:12px;white-space:nowrap}
  .composer textarea{height:4.1em}
  .ubody{max-width:92%}
  aside{position:fixed;top:0;bottom:0;left:0;width:min(75vw,300px);z-index:20;background:var(--bg);
        transform:translateX(-100%);transition:transform .2s ease}
  aside.open{transform:none}
  #mask{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15;
        opacity:0;pointer-events:none;transition:opacity .2s}
  #mask.show{opacity:1;pointer-events:auto}
}
</style>

<body>
<header>
  <button id="menu" class="back" aria-label="项目列表">☰</button>
  <h1>Claude Sessions <span class="mut" id="total"></span></h1>
  <label class="ctl" title="自动刷新">
    <span class="sw"><input type="checkbox" id="auto" checked aria-label="自动刷新"><i></i></span>
    <span class="hdr-label">自动刷新</span><span class="hdr-label-short">自动</span>
  </label>
  <label class="ctl" title="刷新间隔"><span class="hdr-label">间隔</span>
    <select id="ival" aria-label="刷新间隔">
      <option value="2000">2s</option>
      <option value="3000">3s</option>
      <option value="5000">5s</option>
      <option value="10000">10s</option>
    </select>
  </label>
  <span class="ctl" id="updated"></span>
  <span class="hdr-break" aria-hidden="true"></span>
  <button id="hostedbadge" class="back" style="display:none"
          title="当前托管（常驻进程）的会话数，点击查看列表">托管 0</button>
  <button id="pendingbadge" class="back"
          title="有权限请求等待审批，点击跳转">待审批 0</button>
  <span id="connbadge" class="chip pending" role="status" aria-live="polite" hidden>连接断开，重连中…</span>
  <span id="err"></span>
  <button id="notifybtn" class="back" title="开启浏览器通知">🔕</button>
  <button id="sysbtn" class="back" style="margin-left:auto" aria-label="系统状态与电源操作"
          title="系统状态与电源操作">🖥<span class="hdr-label"> 系统</span></button>
</header>
<div id="app">
  <aside id="projs"></aside>
  <main id="main"></main>
</div>
<div id="mask"></div>
<div id="queuepop" hidden></div>
<div id="syspop" hidden></div>
<div id="tplpop" hidden role="dialog" aria-label="提示词模板"></div>
<div id="lightbox" hidden role="dialog" aria-modal="true" aria-label="图片预览">
  <button type="button" id="lightboxclose" aria-label="关闭图片预览">×</button>
  <img alt="">
</div>

<script>
const DEFAULT_IVAL = {{ refresh_interval | round(3) }} * 1000;
const SEND_POLL_TIMEOUT_MS = 30 * 60 * 1000;   // 发送后跟踪 /jobs 的最长时间
const SEND_DONE_HIDE_MS = 4000;                // “已完成/已取消”浮动提示的保留时长
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// 内容派生的稳定 key：思考/压缩卡跨刷新保留展开状态
function hashText(s){
  let h = 5381;
  for(let i = 0; i < String(s || "").length; i++) h = ((h << 5) + h + String(s).charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}
const STATE_ZH = {working: "工作中", idle: "空闲", stale: "无活动"};
// <details> 的展开状态跨 innerHTML 重建保留；key 必须由内容派生且稳定
const detailsOpen = (() => {
  const state = Object.create(null);
  if(typeof sessionStorage === "undefined") return state;
  try{ return Object.assign(state, JSON.parse(sessionStorage.getItem("detailsOpen") || "{}")); }
  catch{ return state; }
})();
function saveDetailsOpen(){
  if(typeof sessionStorage === "undefined") return;
  try{ sessionStorage.setItem("detailsOpen", JSON.stringify(detailsOpen)); }catch{ /* 超限或隐私模式 */ }
}
function detailsAttrs(key, defaultOpen = false){
  const open = key in detailsOpen ? detailsOpen[key] : defaultOpen;
  return ` data-dkey="${esc(key)}"` + (open ? " open" : "");
}
const TASK_ZH = {pending: "待办", in_progress: "进行中", completed: "已完成", deleted: "已删除"};

let sessions = [];                 // 最新概览数据
let view = {project: null, session: null};   // 当前视图
let sessionCommands = [];   // 当前会话的指令目录（仅托管进程活着时有内容）
let curPanel = null;               // main 里已渲染的面板 {type:"list"|"conv"|"new", key}，
                                   // 自动刷新只更新数据区域、不重建输入区，避免失焦/丢草稿
let convCache = {id: null, size: -1};        // 对话缓存标记，避免重复渲染
let convState = {id: null, msgs: [], total: 0, cursor: 0, start: 0, size: -1,
                 hasMore: false, loadingEarlier: false, detail: null};
let lastSidebarSig = "", lastListSig = "";
let esGlobal = null, esSession = null, globalSeq = 0, sessionSeq = 0;
let listTimer = null, convTimer = null;
let lastListLoad = 0;              // 上次 /sessions 请求开始的毫秒时间戳
let liveText = "", liveRaf = null;
let timer = null;
let sendJobs = {};                 // key -> {jobId, status, result, error} 发送任务状态，跨刷新保留；
                                   // key 为会话 id 或 "new:<cwd>"，多个会话可各有一个进行中任务
let pendingSessionSwitch = null;   // /clear 后等待新会话出现在列表再自动切换
let pendingEcho = {};              // sid -> {text, failed} 发送后未落盘的本地回显
const turnEndHighWater = new Map(), displayedTurnEnd = new Map(), unreadSessions = new Set();
let sessionsVersion = 0, displayedSession = null;
function viewingSession(id){
  return !document.hidden && !view.new && view.session === id && displayedSession === id
    && curPanel?.type === "conv" && curPanel.key === id && convState.id === id;
}
function markDisplayedRead(){
  const id = view.session;
  if(viewingSession(id) && (displayedTurnEnd.get(id) || 0) >= (turnEndHighWater.get(id) || 0)
     && unreadSessions.delete(id)){
    updateDocTitle();
    renderSidebar(groupByProject());
  }
}
function confirmDisplayedMessages(id, requestEnd){
  displayedSession = id;
  const caughtUp = convState.cursor >= convState.total;
  // 消息响应最多确认请求开始时已观察到的完成；旧响应不能消费请求期间的新回合。
  if(caughtUp) displayedTurnEnd.set(id, Math.max(displayedTurnEnd.get(id) || 0, requestEnd));
  markDisplayedRead();
  if(!caughtUp || requestEnd < (turnEndHighWater.get(id) || 0)) scheduleConvRefresh(id);
}
function applySessions(next){
  if(!Array.isArray(next)) throw Error("会话列表响应无效");
  next = next.map(mergeMetadata);
  for(const s of next){
    const end = typeof s.last_turn_end_at === "number" && Number.isFinite(s.last_turn_end_at)
      && s.last_turn_end_at > 0 ? s.last_turn_end_at : 0;
    if(!turnEndHighWater.has(s.id)){ turnEndHighWater.set(s.id, end); continue; }
    if(end > turnEndHighWater.get(s.id)){
      turnEndHighWater.set(s.id, end);
      unreadSessions.add(s.id);
    }
  }
  sessions = next;
  sessionsVersion++;
  updateDocTitle();
  markDisplayedRead();
  renderMain();
  if(pendingSessionSwitch && view.session === pendingSessionSwitch.from){
    const target = next.find(s => s.id === pendingSessionSwitch.to);
    if(target){
      const sw = pendingSessionSwitch;
      pendingSessionSwitch = null;
      navigate({project: target.project, session: target.id, new: false});
    }
  }
}
const messageDrafts = new Map();   // 独立于模型草稿；只在当前页面内存保存
function saveMessageDraft(key, text, input = false){
  const draft = messageDrafts.get(key) || {text: "", version: 0};
  if(input || draft.text !== text) draft.version++;
  draft.text = text;
  messageDrafts.set(key, draft);
  return draft;
}
function saveComposerDraft(){
  const box = document.getElementById("msgbox"), key = box?.dataset.draftKey;
  // 导航加载期间旧 DOM 可能仍在，但提交已消费其版本，不能再把旧文本写回。
  if(key && Number(box.dataset.draftVersion) === messageDrafts.get(key)?.version){
    box.dataset.draftVersion = String(saveMessageDraft(key, box.value).version);
  }
}
function bindMessageDraft(key){
  const box = document.getElementById("msgbox");
  if(!box) return;
  const draft = saveMessageDraft(key, messageDrafts.get(key)?.text || "");
  box.dataset.draftKey = key;
  box.dataset.draftVersion = String(draft.version);
  box.value = draft.text;
  autosizeComposer(box);
  box.oninput = () => {
    box.dataset.draftVersion = String(saveMessageDraft(key, box.value, true).version);
  };
}
function captureMessageDraft(key){
  saveComposerDraft();
  const draft = messageDrafts.get(key) || saveMessageDraft(key, "");
  return {key, rawText: draft.text, version: draft.version};
}
function composerRouteMatch(key){
  return key.startsWith("new:") ? !!view.new && "new:" + view.project === key
    : !view.new && view.session === key;
}
function clearSubmittedDraft(submitted){
  const draft = messageDrafts.get(submitted.key);
  if(!draft || draft.version !== submitted.version || draft.text !== submitted.rawText) return;
  const cleared = saveMessageDraft(submitted.key, "");
  const box = document.getElementById("msgbox");
  if(composerRouteMatch(submitted.key) && panelMatch(submitted.key)
     && box?.dataset.draftKey === submitted.key && box.value === submitted.rawText){
    box.value = "";
    box.dataset.draftVersion = String(cleared.version);
  }
}

/* 图片附件与文字草稿一样按会话隔离，仅保存在页面内存中。 */
const IMAGE_MAX_BYTES = 5 * 1024 * 1024 * 3 / 4, IMAGE_MAX_COUNT = 8;
const IMAGE_TOTAL_BYTES = 20 * 1024 * 1024;
const IMAGE_TYPES = new Set(["image/png", "image/jpeg", "image/gif", "image/webp"]);
const imageDrafts = new Map();
function imageDraft(key){
  if(!imageDrafts.has(key)) imageDrafts.set(key, {
    items: [], version: 0, pending: 0, queue: Promise.resolve(), error: ""});
  return imageDrafts.get(key);
}
function imageUrl(image){ return `data:${image.media_type};base64,${image.data}`; }
function imageHtml(image, alt = "图片"){
  if(!image || !IMAGE_TYPES.has(image.media_type) || typeof image.data !== "string") return "";
  return `<img class="msg-image" loading="lazy" data-lightbox="1" alt="${esc(alt)}" src="${esc(imageUrl(image))}">`;
}
function renderImageDraft(key){
  const box = document.getElementById("msgbox"), root = document.getElementById("imagedrafts");
  if(!root || box?.dataset.draftKey !== key) return;
  const items = imageDraft(key).items;
  root.innerHTML = items.map((image, i) => `<div class="image-draft">${imageHtml(image, image.name || "待发送图片")}` +
    `<button type="button" data-image-index="${i}" aria-label="移除图片" title="移除图片">×</button></div>`).join("");
  root.querySelectorAll("[data-image-index]").forEach(btn => { btn.onclick = () => {
    const draft = imageDraft(key);
    draft.items.splice(Number(btn.dataset.imageIndex), 1);
    draft.version++;
    renderImageDraft(key);
  }; });
}
function captureImageDraft(key){
  const draft = imageDraft(key);
  return {key, version: draft.version, items: draft.items.slice(),
    images: draft.items.map(({media_type, data}) => ({media_type, data}))};
}
function clearSubmittedImages(submitted){
  if(!submitted.items.length) return;
  const draft = imageDraft(submitted.key), sent = new Set(submitted.items);
  const remaining = draft.items.filter(item => !sent.has(item));
  if(remaining.length === draft.items.length) return;
  // 按附件对象身份消费本次提交；后续新增、删除和重排都属于下一版草稿。
  draft.items = remaining;
  draft.version++;
  renderImageDraft(submitted.key);
}
function readImageFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",", 2)[1] || "");
    reader.onerror = () => reject(Error("读取失败"));
    reader.onabort = () => reject(Error("读取已取消"));
    reader.readAsDataURL(file);
  });
}
async function addImageFilesNow(key, files){
  const draft = imageDraft(key);
  let error = "";
  for(const file of files){
    if(!IMAGE_TYPES.has(file.type)){ error = "仅支持 PNG / JPEG / GIF / WebP 图片"; continue; }
    if(file.size <= 0 || file.size > IMAGE_MAX_BYTES){ error = "单张图片不能为空且不能超过 3.75 MiB"; continue; }
    if(draft.items.length >= IMAGE_MAX_COUNT){ error = `一次最多发送 ${IMAGE_MAX_COUNT} 张图片`; break; }
    if(draft.items.reduce((n, x) => n + x.size, 0) + file.size > IMAGE_TOTAL_BYTES){
      error = "一次发送的图片总大小不能超过 20 MiB"; break;
    }
    try{
      const data = await readImageFile(file);
      draft.items.push({media_type: file.type, data, name: file.name || "粘贴的图片", size: file.size});
      draft.version++;
    }catch(e){ error = `${file.name || "图片"}读取失败`; }
  }
  renderImageDraft(key);
  return error;
}
function addImageFiles(key, files){
  const draft = imageDraft(key), selected = Array.from(files || []);
  draft.pending++;
  draft.error = "";
  // 同一草稿串行读取，数量/总量检查与前一批完成后的状态保持一致。
  const run = async () => { draft.error = await addImageFilesNow(key, selected); };
  draft.queue = draft.queue.then(run, run).finally(() => {
    draft.pending--;
    updateSendSt(key);
  });
  updateSendSt(key);
  return draft.queue;
}
function wireImageComposer(key){
  bindMessageDraft(key);
  renderImageDraft(key);
  const picker = document.getElementById("imageinput"), button = document.getElementById("imagebtn");
  if(button && picker){
    button.onclick = () => picker.click();
    picker.onchange = () => { const files = Array.from(picker.files || []); picker.value = ""; addImageFiles(key, files); };
  }
  const box = document.getElementById("msgbox");
  box?.addEventListener("paste", event => {

function relTime(ts){

  const d = Date.now()/1000 - ts;
  if(d < 60) return Math.floor(d) + " 秒前";
  if(d < 3600) return Math.floor(d/60) + " 分钟前";
  if(d < 86400) return Math.floor(d/3600) + " 小时前";
  return Math.floor(d/86400) + " 天前";
}
function dur(a, b){
  if(!a || !b || b <= a) return "";
  const d = b - a;
  if(d < 3600) return Math.floor(d/60) + "m";
  if(d < 86400) return (d/3600).toFixed(1) + "h";
  return (d/86400).toFixed(1) + "d";
}
function fmtTok(n){

/* ---------- URL 路由 ---------- */
// 路径按目录层级展开，保留几乎可读的字符；只转义空格、#、? 等会破坏 URL 的字符
function encSeg(s){ return encodeURIComponent(String(s)).replace(/%3A/gi, ":"); }
function decSeg(s){
  try{ return decodeURIComponent(s); }catch{ return null; }
}
function normPath(p){
  return String(p == null ? "" : p).replace(/\\/g, "/").replace(/^\/+|\/+$/g, "");
}

/* ---------- 本地文件链接 → /view 预览 ---------- */
// 词法归一本地路径：反斜杠→/，折叠 ./ ../ 与重复斜杠（保留 UNC 前导 //），去尾斜杠；
// 盘符是 Windows 路径的根，.. 不能越过它
function normLocalPath(p){
  p = String(p).replace(/\\/g, "/");
  const unc = p.slice(0, 2) === "//";
  const out = [];
  for(const seg of p.split("/")){
    if(!seg || seg === ".") continue;
    if(seg === ".."){
      const top = out[out.length - 1];
      if(out.length && top !== ".." && !/^[A-Za-z]:$/.test(top)) out.pop();
      continue;
    }
    out.push(seg);
  }
  return (unc ? "//" : "") + out.join("/");
}
function decodeMaybe(s){
  try{ return decodeURIComponent(s); }catch(e){ return s; }
}
// 把消息里的 <a href> 解析成本地绝对路径；非本地路径（http/锚点/协议相对）返回 null。
// md 链接里的 %20 等百分号转义还原成真实文件名
function localPathFromHref(href, cwd){
  if(!href || href.charAt(0) === "#") return null;
  if(/^[a-z]:([\\/]|$)/i.test(href))   // 盘符路径要先于 scheme 判定（F: 会被当成单字母协议）
    return normLocalPath(href);
  const m = /^([a-z][a-z0-9+.-]*):/i.exec(href);
  if(m){
    if(m[1].toLowerCase() !== "file") return null;
    return normLocalPath(decodeMaybe(href.replace(/^file:\/{2,3}/i, "")));
  }
  if(href.slice(0, 2) === "//") return null;
  return normLocalPath(cwd + "/" + decodeMaybe(href));
}
function viewFileUrl(p){ return "/view?path=" + encodeURIComponent(p); }
// 遗留错误 URL 兜底：<已知项目>/s/<相对文件路径> 形态 → /view 预览链接
function routeFileUrl(projects, full){
  if(!full) return null;
  const f = normPath(full);
  for(const p of projects || []){
    const base = normPath(p.cwd);
    if(!base || f === base) continue;
    if(f.startsWith(base + "/")){
      const rest = f.slice(base.length + 1);
      if(rest.startsWith("s/") && rest.length > 2)
        return viewFileUrl(normLocalPath(base + "/" + rest.slice(2)));
    }
  }
  return null;
}
// 会话 ID（UUID / parent::agent-hash）永不带点号；结尾带扩展名的路由段按文件处理
function looksLikeFileName(s){
  return /\.[A-Za-z0-9]{1,10}$/.test(String(s || ""));
}
// /s/README.md 这类单段文件 URL（根目录文件链接被浏览器解析而成）→ 预览链接；
// 已加载会话列表里的 id 绝不劫持——自定义点号 session id（--session-id）也在保护之列
function sessionFileRedirectUrl(sid){
  if(!view || !view.project || !looksLikeFileName(sid)) return null;
  if(sessions.some(s => s && s.id === sid)) return null;
  return viewFileUrl(normLocalPath(view.project + "/" + sid));
}
// 消息组节点内的本地文件链接重写为 /view 预览、新标签打开；
// 用 getAttribute 取原始 href（浏览器属性会解析成绝对 URL），无 DOM 原语的环境静默跳过
function rewriteConvLinks(node, cwd){
  if(!node || !cwd || !node.querySelectorAll) return;
  for(const a of node.querySelectorAll("a[href]")){
    const p = localPathFromHref(a.getAttribute("href"), cwd);
    if(p){
      a.setAttribute("href", viewFileUrl(p));
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    }
  }
}
function sameProject(a, b){ return !!a && !!b && normPath(a) === normPath(b); }
function projectUrlPath(cwd){
  return normPath(cwd).split("/").filter(Boolean).map(encSeg).join("/");
}
function routePath(v){
  if(v?.pending) return "/pending";
  if(v?.hosted) return "/hosted";
  if(!v || !v.project) return "/";
  const base = "/p/" + projectUrlPath(v.project);
  if(v.session) return base + "/s/" + encSeg(v.session);
  if(v.new) return base + "/new";
  return base;
}
function parseRoute(pathname){
  if(pathname === "/pending") return {pending: true, project: null, session: null, new: false};
  if(pathname === "/hosted") return {hosted: true, project: null, session: null, new: false};
  if(!pathname) return null;
  const parts = pathname.split("/").filter(Boolean);
  if(parts.length < 2 || parts[0] !== "p") return null;
  const all = parts.slice(1).map(decSeg);
  if(all.some(x => x === null)) return null;
  let rest = parts.slice(1), session = null, isNew = false;
  // 从右端识别 /s/<会话ID> 与 /new；项目路径本身可能包含斜杠
  if(rest.length >= 3 && rest[rest.length - 2] === "s"){
    session = decSeg(rest[rest.length - 1]);
    if(session === null) return null;
    rest = rest.slice(0, -2);
  } else if(rest.length >= 2 && rest[rest.length - 1] === "new"){
    isNew = true;
    rest = rest.slice(0, -1);
  }
  if(!rest.length) return null;
  const project = rest.map(decSeg).join("/");
  // fullProject 用于消歧：目录本身就叫 new 或形如 .../s/xxx 时优先按项目列表解析
  return {project, session, new: isNew, fullProject: all.join("/")};
}
// 把 URL 中的可读路径映射回系统原生 cwd；同时处理 "项目目录名恰好是 new" 的歧义
function resolveViewProject(projects){
  if(!view) return;
  if(!projects.length) return;   // 数据未到（刚启动的空快照）：保留 URL 里的项目信息等下一轮
  if(view.fullProject){
    const exact = projects.find(p => sameProject(p.cwd, view.fullProject));
    if(exact){
      view = {project: exact.cwd, session: null, new: false};
      return;
    }
    delete view.fullProject;
  }
  if(!view.project) return;
  const match = projects.find(p => sameProject(p.cwd, view.project));
  if(match) view.project = match.cwd;
}

function md(text){
  if(window.marked){
    const html = marked.parse(text);
    return window.DOMPurify ? DOMPurify.sanitize(html) : html;
  }
  return `<pre>${esc(text)}</pre>`;
}

// 会话页和新建会话页共用同一个输入对话框，避免两套 textarea/按钮/键盘行为
function commandToken(value){

function filterCommands(commands, token){
  if(token == null) return [];

}

function wireCommandHints(box, getCommands){
  if(!box) return;
  const panel = document.getElementById("cmdhints");
  if(!panel) return;
  let selected = 0;
  const close = () => { panel.hidden = true; panel.replaceChildren(); selected = 0; };
  const render = () => {
    const token = commandToken(box.value);
    const found = filterCommands(getCommands(), token);
    if(token == null || !found.length){ close(); return; }
    if(selected >= found.length) selected = found.length - 1;
    panel.replaceChildren(...found.map((name, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cmd-hint" + (i === selected ? " selected" : "");
      btn.textContent = "/" + name;
      btn.onclick = () => { box.value = "/" + name + " "; close(); box.focus(); };
      return btn;
    }));
    panel.hidden = false;
  };
  box.addEventListener("input", () => { selected = 0; render(); });
  box.addEventListener("keydown", event => {
    if(panel.hidden) return;
    const found = filterCommands(getCommands(), commandToken(box.value));
    if(!found.length) return;
    if(event.key === "ArrowDown"){
      event.preventDefault(); selected = Math.min(selected + 1, found.length - 1); render();
    }else if(event.key === "ArrowUp"){
      event.preventDefault(); selected = Math.max(selected - 1, 0); render();
    }else if(event.key === "Tab"){
      event.preventDefault(); box.value = "/" + found[selected] + " "; close();
    }else if(event.key === "Enter"){
      // 面板展开时 Enter 只补全选中项到输入框，不触发发送；再次 Enter 才发送
      event.preventDefault(); box.value = "/" + found[selected] + " "; close();
    }else if(event.key === "Escape"){
      close();
    }
  });
  box.addEventListener("blur", () => setTimeout(close, 150));
}

function autosizeComposer(box){

    const innerHeight = Number(window.innerHeight) || 0;
    let keyboard = 0;
    if(scale === 1 && viewportHeight > 0 && innerHeight > 0){
      const diff = innerHeight - viewportHeight;
      // 键盘通常远高于地址栏/工具栏的差值；低于阈值一律视为 0，
      // 并限制不超过可视高度的 60%，避免异常高度把 body 压扁。
      if(diff >= 100) keyboard = Math.min(diff, Math.round(innerHeight * 0.6));
    }
    root.style.setProperty("--keyboard-height", Math.round(keyboard) + "px");
  };
  vv.addEventListener("resize", update);
  if(window.addEventListener) window.addEventListener("resize", update);
  update();
}

function updateModelOptions(key, options){
  const sel = document.getElementById("modelsel"), input = document.getElementById("modelcustom");
  if(!sel || !input || !panelMatch(key)) return;
  const state = modelDraft(key);
  const selectedOption = Array.from(sel.options).find(option => option.value === sel.value);
  const selectedKind = selectedOption?.dataset?.kind;
  const customValue = input.value;
  const unique = [], seen = new Set();
  for(const item of Array.isArray(options) ? options : []){
    if(!item || typeof item.name !== "string" || typeof item.model !== "string" || !item.model) continue;
    const identity = JSON.stringify([item.name, item.model]);
    if(seen.has(identity)) continue;
    seen.add(identity); unique.push({name: item.name, model: item.model});
  }
  modelProfileOptions[key] = unique;
  const savedProfileChoice = state.value !== null && unique.some(item => item.model === state.value)
    ? modelChoiceFor(key, state.value) : null;
  let selected = selectedKind === "custom"
    ? (!state.touched && savedProfileChoice ? savedProfileChoice : customModelChoice)
    : selectedKind === "profile" || state.value !== null
      ? (savedProfileChoice || customModelChoice) : defaultModelChoice;
  const add = (label, value, kind, model = "") => {
    const option = document.createElement("option");
    option.textContent = label; option.value = value; option.dataset.kind = kind;
    if(model) option.dataset.model = model;
    sel.appendChild(option);
  };
  sel.replaceChildren();
  add("默认（清除 Web 覆盖）", defaultModelChoice, "default");
  for(let i = 0; i < unique.length; i++){
    const item = unique[i]; add(item.name, profileModelChoice(i), "profile", item.model);
  }
  add("自定义 ID", customModelChoice, "custom");
  if(selected.startsWith("profile:") && !Array.from(sel.options).some(option => option.value === selected)) selected = customModelChoice;
  sel.value = selected;
  input.value = customValue;
  input.hidden = selected !== customModelChoice;
}

function bindModel(key, selected){

    if(!panelMatch(key)) return;

    const kind = option?.dataset?.kind;
    input.hidden = kind !== "custom";
    s.custom = input.value;
    s.value = kind === "custom" ? input.value : kind === "profile" ? option.dataset.model : null;
    if(kind === "custom" && !input.value){

  };
  sel.onchange = () => { s.touched = true; edit(true); };
  input.oninput = () => { s.touched = true; edit(false); }; // 异步选项加载不覆盖尚未失焦的自定义编辑
  input.onchange = () => { s.touched = true; edit(true); };
  updateModelSt(key);
}

/* ---------- SSE 实时更新 ---------- */
const SSE_TYPES = ["snapshot", "session_discovered", "user_message", "assistant_message",
  "tool_use", "tool_error", "turn_finished", "subagent_start", "subagent_done",
  "task_created",
  "task_updated", "context_compacted", "api_error", "hosted_turn_done",
  "hosted_api_retry", "hosted_rate_limit", "hosted_conversation_reset",
  "hosted_session_switched", "hosted_foreign_turn", "interaction_pending",
  "interaction_resolved", "turn_interrupted", "turn_delta", "remote_message_sent",
  "remote_message_done", "hosted_exited", "session_metadata_changed", "queue_changed"];
const raf = window.requestAnimationFrame || (fn => setTimeout(fn, 16));

function listGap(){ return +ival.value || DEFAULT_IVAL; }
function scheduleListRefresh(){
  // SSE 事件驱动的刷新也受用户设置的间隔约束，否则活跃会话会把 5s 设置变成每 800ms 一次
  clearTimeout(listTimer);
  const wait = Math.max(0, listGap() - (Date.now() - lastListLoad));
  listTimer = setTimeout(() => {
    listTimer = null;
    if(!document.hidden) load();
  }, wait);
}
function scheduleConvRefresh(sid){
  if(view.session !== sid) return;
  clearTimeout(convTimer);
  convTimer = setTimeout(() => {
    if(!document.hidden) renderConversation(sid, false);
  }, 500);
}
function onGlobalSse(event){
  lastGlobalSseActivity = Date.now();
  let msg;
  try{ msg = JSON.parse(event.data); }catch{ return; }
  if(msg.seq && msg.seq <= globalSeq) return;
  if(msg.seq) globalSeq = msg.seq;
  handleSseMessage(msg);
}
function onSessionSse(event){
  lastSessionSseActivity = Date.now();
  let msg;
  try{ msg = JSON.parse(event.data); }catch{ return; }
  if(msg.seq && msg.seq <= sessionSeq) return;
  if(msg.seq) sessionSeq = msg.seq;
  handleSseMessage(msg);
}
function handleSseMessage(msg){
  if(msg.type === "snapshot"){
    if(msg.data.sessions){
      applySessions(msg.data.sessions);
    }
    if(msg.data.session && view.session === msg.session){
      const detailChanged = applySessionDetail(msg.data.session);
      if(detailChanged && convState.id === msg.session && (convState.msgs || []).length)
        renderConvList();
      if(msg.data.live && msg.data.live.text) updateLiveBubble(msg.data.live.text);
      scheduleConvRefresh(msg.session);
    }
    return;
  }
  if(msg.type === "turn_delta"){
    if(view.session === msg.session) updateLiveBubble(msg.data.text || "");
    return;
  }
  if(msg.type === "hosted_session_switched" && msg.data
     && msg.data.from && msg.data.to && view.session === msg.data.from){
    // /clear 后 CLI 会换 session id；新会话被扫描进列表后自动切过去
    pendingSessionSwitch = {from: msg.data.from, to: msg.data.to};
    flashSendSt(msg.data.from, "会话已被 /clear 重置，正在切换…");
    load();
  }
  if(["turn_finished", "hosted_turn_done", "interaction_pending",
      "turn_interrupted"].includes(msg.type) && view.session === msg.session){
    clearLiveBubble();
  }
  scheduleListRefresh();
  if(msg.session) scheduleConvRefresh(msg.session);
  maybeNotify(msg);
}
let sseDown = {global: false, session: false};
function updateConnBadge(){
  const badge = document.getElementById("connbadge");
  if(!badge) return;
  const down = sseDown.global || (view.session && sseDown.session);
  badge.hidden = !down;
  badge.style.display = down ? "inline-block" : "none";
}
function connectGlobalSse(){
  if(!window.EventSource) return;
  if(esGlobal) esGlobal.close();
  lastGlobalSseActivity = Date.now();
  esGlobal = new EventSource("/events");
  for(const type of SSE_TYPES) esGlobal.addEventListener(type, onGlobalSse);
  esGlobal.addEventListener("keepalive", () => { lastGlobalSseActivity = Date.now(); });
  let opened = false;
  esGlobal.onopen = () => {
    lastGlobalSseActivity = Date.now();
    sseDown.global = false; updateConnBadge();
    if(opened){
      globalSeq = 0;
      load();
      if(view.session) renderConversation(view.session, true);
    }
    opened = true;
  };
  esGlobal.onerror = () => { sseDown.global = true; updateConnBadge(); };
}
function connectSessionSse(id){
  if(!window.EventSource) return;
  disconnectSessionSse();
  lastSessionSseActivity = Date.now();
  esSession = new EventSource("/events?session=" + encodeURIComponent(id));
  for(const type of SSE_TYPES) esSession.addEventListener(type, onSessionSse);
  esSession.addEventListener("keepalive", () => { lastSessionSseActivity = Date.now(); });
  let opened = false;
  esSession.onopen = () => {
    lastSessionSseActivity = Date.now();
    sseDown.session = false; updateConnBadge();
    sessionSeq = 0;
    if(opened && view.session === id) renderConversation(id, true);
    opened = true;
  };
  esSession.onerror = () => { sseDown.session = true; updateConnBadge(); };
}
function disconnectSessionSse(){
  if(esSession){ esSession.close(); esSession = null; }
  sseDown.session = false;
  updateConnBadge();
}

/* ---------- 浏览器通知 / 标题待办 / SSE 看门狗 ---------- */
// 通知只由实时 SSE 事件驱动：页面隐藏时才发，正看着不打扰；
// 重连对账（snapshot/轮询）不补发，系统睡眠期间错过的事件醒来后只更新看板与标题。
// 无 Service Worker / 推送，不持有任何唤醒锁，系统睡眠行为不受影响。
const notifyCooldown = new Map();   // 去重键 -> 上次通知毫秒（全局+单会话两路 SSE 会重复投递）
function notifyOn(){
  return localStorage.getItem("notify") === "1" && window.Notification
    && Notification.permission === "granted";
}
function sessionDisplayName(sid){
  const s = sessions.find(x => x.id === sid);
  return (s && (s.alias || s.title)) || (s && s.cwd) || sid || "会话";
}
function maybeNotify(msg){
  if(!msg || !msg.type || !document.hidden || !notifyOn()) return;
  let kind = null;
  if(msg.type === "turn_finished") kind = "reply";
  else if(msg.type === "interaction_pending") kind = "approval";
  else if(msg.type === "hosted_turn_done" && (msg.data.is_error || msg.data.status === "failed")) kind = "failed";
  else if(msg.type === "remote_message_done" && msg.data.status === "failed") kind = "failed";
  if(!kind) return;
  // 短回合过滤（Belay 式）：仅新回复类；待审批与任务失败始终提醒
  const minDur = Number(localStorage.getItem("notify_min_duration") || 30);
  if(kind === "reply" && minDur > 0 && typeof msg.data.duration === "number"
     && msg.data.duration < minDur) return;
  const sid = msg.session || msg.data.session_id || "";
  const key = kind + ":" + sid + ":" + (msg.data.id || msg.data.job || "");
  const now = Date.now();
  if(now - (notifyCooldown.get(key) || 0) < 5000) return;   // 两路重复/连发冷却
  notifyCooldown.set(key, now);
  if(notifyCooldown.size > 200) notifyCooldown.clear();     // 长期运行的有界保护
  const name = sessionDisplayName(sid);
  let title, body;
  if(kind === "reply"){ title = "新回复 · " + name; body = msg.data.last || ""; }
  else if(kind === "approval"){ title = "待审批 · " + (msg.data.tool_name || "权限请求"); body = name; }
  else { title = "任务失败 · " + name; body = msg.data.error || msg.data.result || ""; }
  try{
    const n = new Notification(title, {body: String(body).slice(0, 140), tag: key});
    n.onclick = () => {
      window.focus();
      const s = sessions.find(x => x.id === sid);
      navigate({project: s ? s.project : null, session: sid || null, new: false});
      n.close();
    };
  }catch(e){ /* 某些平台页面级 Notification 构造可能失败，忽略不影响看板 */ }
}
function updateNotifyBtn(){
  const btn = document.getElementById("notifybtn");
  if(!btn) return;
  const on = notifyOn();
  btn.textContent = on ? "🔔" : "🔕";
  btn.title = on ? "浏览器通知已开启（页面隐藏时提醒新回复/待审批/失败），点击关闭"
                 : "开启浏览器通知（页面隐藏时提醒新回复/待审批/失败）";
}
function updateDocTitle(){

  const total = unreadSessions.size + pending;

// 看门狗：keepalive 事件 15s 一次；90s 无任何帧说明连接假死（系统睡眠/网络切换
// 常无错误事件），重建连接。回前台超过 45s 立即检查，后台不做定时重连。
let lastGlobalSseActivity = 0, lastSessionSseActivity = 0;
function reconnectStaleSse(threshold){
  if(!window.EventSource) return;
  const now = Date.now();
  if(esGlobal && now - lastGlobalSseActivity > threshold){
    sseDown.global = true; updateConnBadge(); connectGlobalSse();
  }
  if(esSession && view.session && now - lastSessionSseActivity > threshold){
    sseDown.session = true; updateConnBadge(); connectSessionSse(view.session);
  }
}
setInterval(() => { if(!document.hidden) reconnectStaleSse(90000); }, 30000);

function detailRenderKey(d){

  const overview = document.getElementById("overviewwrap");

  const tok = document.getElementById("tokchip");

    tok.hidden = !ctx;
    if(ctx){
      tok.textContent = "上下文 " + fmtTok(ctx);
      tok.title = `上下文 ${fmtTok(ctx)} · 输入 ${fmtTok(tokens.input)} · 输出 ${fmtTok(tokens.output)} · 缓存读 ${fmtTok(tokens.cache_read)}`;
    }
  }
  renderApiError(d.last_api_error);
  renderBgStrip();
  updateModelSt(d.id || convState.id || "");
  return detailChanged;
}
function renderApiError(err){
  // 上游 503/限流时 CLI 只写 system/api_error，转录里没有助手内容；
  // 这里把服务端记录的重试状态显示出来，避免看起来像卡死
  const el = document.getElementById("apierr");
  if(!el) return;
  if(!err || !err.text){
    el.textContent = "";
    el.style.display = "none";
    return;
  }
  let tail = "";
  // 只有最近发生的错误才算“正在重试”；重启服务回放旧转录时不显示过期的重试状态
  const fresh = err.ts && Date.now() / 1000 - err.ts < 180;
  if(err.retry_attempt && fresh){
    tail = `，正在第 ${err.retry_attempt}${err.max_retries ? "/" + err.max_retries : ""} 次重试`;
    if(err.retry_in_ms) tail += `，约 ${Math.max(1, Math.round(err.retry_in_ms / 1000))} 秒后继续`;
  }
  el.textContent = "⚠ 模型服务暂不可用：" + err.text + tail;
  el.style.display = "";
}
function updateLiveBubble(text){
  liveText = text || "";
  if(liveRaf) return;
  liveRaf = raf(() => { liveRaf = null; renderLiveBubble(); });

function renderLiveBubble(){
  const conv = document.getElementById("conv");

  let el = document.getElementById("livebubble");

    el.className = "msg assistant";
    el.innerHTML = '<div class="mhead">助手 · 正在输入…</div><div class="abody"></div>';
    conv.appendChild(el);
  }
  const body = el.querySelector ? el.querySelector(".abody") : null;
  if(body) body.textContent = liveText;
}
function clearLiveBubble(){

/* ---------- 分组 ---------- */
function groupByProject(){
  const groups = new Map();
  for(const s of sessions){
    const k = s.project || s.cwd || "?";
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(s);
  }
  return [...groups.entries()]
    .map(([cwd, ss]) => ({
      cwd, sessions: ss,
      working: ss.filter(s => s.state === "working").length,
      unread: ss.filter(s => unreadSessions.has(s.id)).length,
      wt: ss.filter(s => s.cwd && s.cwd !== s.project).length,
      out: ss.reduce((a, s) => a + ((s.tokens || {}).output || 0), 0),
      last: Math.max(...ss.map(s => s.last_event_at || 0)),
    }))
    // 侧栏顺序固定按项目名排列（不随活跃时间跳动），同名时按完整路径区分
    .sort((a, b) =>
      projName(a.cwd).localeCompare(projName(b.cwd), "zh", {numeric: true})
      || a.cwd.localeCompare(b.cwd, "zh", {numeric: true}));
}

/* ---------- 渲染：会话列表 ---------- */
const projectConditions = new Map();
function listConditions(cwd){
  if(!projectConditions.has(cwd)) projectConditions.set(cwd, {query: "", filter: "all", scope: "active"});
  return projectConditions.get(cwd);
}
function filterProjectSessions(items, conditions){
  const query = (conditions.query || "").trim().toLowerCase();
  return items.filter(s => {
    const scope = conditions.scope || "active";
    if(scope === "active" && s.archived || scope === "archived" && !s.archived) return false;
    const filter = conditions.filter;
    if(filter === "working" && s.state !== "working"
       || filter === "hosted" && !s.hosted
       || filter === "pending" && !(s.pending_interactions > 0)
       || filter === "unread" && !unreadSessions.has(s.id)) return false;
    return !query || [sessTitle(s), s.title, s.project, s.cwd, s.git_branch, s.model,
      s.first_user_message, s.last_user_message].some(value => String(value ?? "").toLowerCase().includes(query));
  }).sort((a, b) => Number(!!b.pinned) - Number(!!a.pinned));
}

        ${unreadSessions.has(s.id) ? '<span class="chip" title="本页面观察到主回合结束；不代表任务成功或后台子代理全部结束">新回复</span>' : ""}
        <span class="stitle">${esc(sessTitle(s))}</span>
        ${metadataActionsHtml(s)}
        <div class="mut">${[
          s.cwd !== s.project ? "⎇ " + projName(s.cwd) : null,

          s.tasks_total && `任务 ${s.tasks_completed}/${s.tasks_total}`,

function diffHtml(text){

              : line.startsWith("@@") ? "diff-hunk" : "";
    return `<span class="${cls}">${esc(line)}</span>`;
  }).join("\n");
}
function clipText(value, limit){

// 工具展示注册表：新增工具只需加一条，不在渲染函数里堆 if/else

const TOOL_NO_GROUP = new Set(["Agent", "Task", "AskUserQuestion", "ExitPlanMode"]);
const TOOL_STATUS_ZH = {running: "运行中", done: "完成", error: "失败", stale: "未完成", pending: "待结果"};

function toolInputData(p){
  if(p && p.input_data && typeof p.input_data === "object") return p.input_data;
  if(p && typeof p.input === "string"){
    try{
      const parsed = JSON.parse(p.input);
      return parsed && typeof parsed === "object" ? parsed : {};
    }catch(e){ return {}; }
  }
  return p && p.input && typeof p.input === "object" ? p.input : {};
}
function toolView(p){
  const config = TOOL_VIEW[p.name] || {};
  const input = toolInputData(p);
  let value = "";
  try{ value = config.value ? String(config.value(input) || "") : ""; }catch(e){ value = ""; }
  if(!value) value = p.summary || (typeof p.input === "string" ? p.input : "");
  return {label: config.label || p.name || "工具", value,
          cat: config.cat || "default", hideSuccess: !!config.hideSuccess};
}
function toolStatus(p){
  if(p.result && (p.result.is_error || p.result.kind === "error")) return "error";
  if(p.result) return "done";
  const detail = convState.detail;
  if(detail && detail.state === "working") return "running";
  if(detail && detail.state === "stale") return "stale";
  return "pending";
}
function toolStatusHtml(p){
  const status = toolStatus(p);
  return `<span class="tool-status ${status}">${TOOL_STATUS_ZH[status] || status}</span>`;
}
function diffStatsHtml(stats){
  if(!stats) return "";
  const added = Number(stats.added) || 0, removed = Number(stats.removed) || 0;
  if(!added && !removed) return "";
  return `<span class="tool-stats">${added ? "+" + added : ""}` +
    `${added && removed ? " " : ""}${removed ? '<span class="del">-' + removed + "</span>" : ""}</span>`;
}
function toolResultHtml(p){
  // 已合并到工具卡时结果在 p.result；缓存从中间开始时可能是独立的 tool_result part
  const r = p.result || (p.type === "tool_result" ? p : null);
  if(!r) return "";
  if(r.kind === "diff") return `<pre class="tool-out">${diffHtml(r.text)}</pre>`;
  if(r.kind === "image"){
    const images = (r.images || []).map(image => imageHtml(image)).join("");
    const caption = r.text && r.text !== "图片" ? `<div class="mut">${esc(r.text)}</div>` : "";
    return images + caption || '<div class="mut">[图片]</div>';
  }
  if(r.is_error || r.kind === "error") return `<div class="terror">✗ ${esc(r.text || "")}</div>`;
  return `<pre class="tool-out">${esc(r.text || "")}</pre>`;
}
function agentCardHtml(p){
  const input = toolInputData(p);
  const detail = convState.detail || {};
  const sub = (detail.subagents || []).find(x => x && x.tid && x.tid === p.tool_use_id) || {};
  const state = sub.state || (p.result ? (p.result.is_error ? "error" : "done") : "running");
  const label = sub.type || input.subagent_type || "Agent";
  const description = sub.description || input.description || "";
  const prompt = sub.prompt || input.prompt || "";
  const model = sub.model || input.model || "";
  const async = !!(sub.async || (p.result && p.result.agent_id));
  const agentId = sub.agent_id || (p.result && p.result.agent_id) || "";
  const launchAck = /Async agent launched/i.test(String(p.result && p.result.text || ""));
  const resultText = p.result && p.result.text && p.result.text !== "图片" && !launchAck
    ? `<div class="agent-body">${esc(clipText(p.result.text, 2000))}</div>` : "";
  const link = agentId && convState.id

    `</summary><div class="agent-body">` +

function toolPartHtml(p){
  if(p.type === "tool_result")

  return `<details class="tool-details${category}"${key ? detailsAttrs(key) : ""}>` +

    (notes ? `<div class="mut">${esc(notes)}</div>` : "") +
    (hidden
      ? `<details class="fold tool-result-fold"${detailsAttrs("toolresult:" + (p.tool_use_id || hashText(p.result.text || "")))}>` +
        `<summary>结果</summary>${toolResultHtml(p)}</details>`
      : toolResultHtml(p)) + `</details>`;
}
function toolGroupHtml(run){
  const view = toolView(run[0]);
  const previews = run.slice(0, 2).map(p => toolView(p).value).filter(Boolean);
  const extra = run.length - previews.length;
  const stats = {added: 0, removed: 0};
  for(const p of run){

  const running = run.filter(p => toolStatus(p) === "running").length;
  const errors = run.filter(p => toolStatus(p) === "error").length;
  const key = "toolgroup:" + (run[0].tool_use_id || hashText(view.label + "|" + previews.join("|")));
  return `<details class="tool-group"${detailsAttrs(key)}>` +
    `<summary><span class="tool-kind">${esc(view.label)}</span>` +
    `<span class="tool-count">×${run.length}</span>` +

    (running ? `<span class="tool-status running">${running} 运行中</span>` : "") +
    (errors ? `<span class="tool-status error">${errors} 失败</span>` : "") +

function mergeEarlierMessages(older, newer){
  const tools = new Map();
  for(const m of older){
    for(const p of (m.parts || []))
      if(p.type === "tool" && p.tool_use_id) tools.set(p.tool_use_id, p);
  }
  let absorbed = false;
  if(tools.size) for(const m of newer){
    const keep = [];
    for(const p of (m.parts || [])){
      const t = tools.get(p.tool_use_id);
      if(p.type === "tool_result" && t){
        if(!t.result) t.result = p;
        absorbed = true;
      } else if(p.type === "tool_note" && t){
        t.notes = t.notes || [];
        if(!t.notes.includes(p.text)) t.notes.push(p.text);
        absorbed = true;
      } else keep.push(p);
    }
    m.parts = keep;
  }
  // 只有吸收发生时才丢弃被清空的消息；未涉及合并的消息原样保留
  if(!absorbed) return older.concat(newer);
  return older.concat(newer.filter(m => (m.parts || []).length));
}

    const last = groups[groups.length - 1];
    if(last && last.role === m.role) last.parts.push(...m.parts);
    else groups.push({role: m.role, ts: m.ts, parts: [...m.parts]});
  }
  return groups;
}

function renderGroupParts(parts, role){
  let out = "";

    const part = parts[i];

    if(part.type === "tool" && !TOOL_NO_GROUP.has(part.name)){
      let end = i + 1;
      while(end < parts.length && parts[end].type === "tool" && parts[end].name === part.name) end++;
      const run = parts.slice(i, end);

function collectChoiceAnswers(card){

  for(const q of card.querySelectorAll(".choice-q")){

function refreshChoiceSubmit(card){

  if(!btn) return;
  const answered = [...card.querySelectorAll(".choice-q")].every(q => {
    const free = q.querySelector(".choice-free");

  });

function wireChoiceCard(card){
  if(!card || !card.dataset.choice) return;
  card.querySelectorAll(".choice-q").forEach(q => {
    const free = q.querySelector(".choice-free");
    q.querySelectorAll("input[type=checkbox],input[type=radio]").forEach(inp => {
      inp.addEventListener("change", () => {
        if(inp.checked && free) free.value = "";
        refreshChoiceSubmit(card);
      });
    });
    if(free) free.addEventListener("input", () => {
      if(free.value.trim())
        q.querySelectorAll("input:checked").forEach(x => x.checked = false);
      refreshChoiceSubmit(card);
    });
  });
  refreshChoiceSubmit(card);
}

    const total = card.querySelectorAll ? card.querySelectorAll(".choice-q").length : 0;

          '<div class="terror">请回答所有问题或点击跳过</div>');

    body = {behavior: "deny"};
    if(reason) body.reason = reason;
  } else {
    body = {behavior: act, scope: scope || "once"};
  }
  const buttons = card.querySelectorAll ? card.querySelectorAll("button") : [];
  buttons.forEach(b => b.disabled = true);
  try{
    const r = await fetchT("/interactions/" + encodeURIComponent(iid) + "/respond", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),

    if(card.insertAdjacentHTML)
      card.insertAdjacentHTML("beforeend", `<div class="terror">${esc(e.message)}</div>`);

}

function renderConvDom(el, groups, echoStr){
  if(convDom.id !== convState.id){
    // 切换会话：旧节点全部作废，清空容器重新开始
    convDom = {id: convState.id, nodes: new Map(), echo: null};

    btn.remove();
    btn = null;

  // 旧回显节点整体重建（内容小、无 markdown）
  if(convDom.echo && convDom.echo.remove){ convDom.echo.remove(); }
  convDom.echo = null;

  for(const g of groups){
    const sig = convGroupSig(g);

async function loadEarlier(){
  if(!convState.id || !convState.hasMore || convState.loadingEarlier) return;
  const generation = ++convRequestGeneration;
  convLoading = null;   // 分页与增量共享索引，取代尚未提交的旧刷新。
  convState.loadingEarlier = generation;
  const state = convState, id = state.id, route = routeGeneration;
  const convEl = document.getElementById("conv");
  const oldHeight = convEl?.scrollHeight || 0, oldScroll = convEl?.scrollTop || 0;
  try{
    const r = await fetch(`/sessions/${encodeURIComponent(convState.id)}/messages` +
      `?before=${convState.start}&limit=100`);
    const page = await r.json();
    if(!r.ok || page.error || view.session !== id || convState !== state
       || route !== routeGeneration || generation !== convRequestGeneration) return;
    convState.msgs = mergeEarlierMessages(page.messages || [], convState.msgs);
    convState.start = page.start;
    convState.hasMore = !!page.has_more;
    convState.total = page.total;
    convState.size = page.size;
    for(let echo = pendingEcho[convState.id]; echo; echo = echo.previous)
      if(echo.after != null) echo.after += page.shift || 0;
    convState.cursor += page.shift || 0;   // 服务端前插了新块，末尾索引整体后移
    renderConvList();
    // 前插加载的旧块在上方展开，补偿高度差保持当前视野
    if(convEl) convEl.scrollTop = oldScroll + (convEl.scrollHeight - oldHeight);
  }catch(e){ /* 下次点击重试 */ }
  finally{ if(state.loadingEarlier === generation) state.loadingEarlier = false; }
}
