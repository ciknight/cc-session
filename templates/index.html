<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Sessions 监控</title>
<script src="/static/marked.min.js"></script>
<script src="/static/purify.min.js"></script>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f6f6f4;--card2:#efefec;--mut:#777;--bd:#e2e2de;--acc:#2563eb;--accbg:#dbeafe}
@media(prefers-color-scheme:dark){:root{--bg:#1b1b1a;--fg:#eee;--card:#262625;--card2:#2e2d2c;--mut:#999;--bd:#3a3a38;--acc:#60a5fa;--accbg:#1e3a5f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.55 system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--bd);flex:none}
h1{font-size:16px;margin:0}
.ctl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
select{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:2px 6px}
/* 开关 */
.sw{position:relative;display:inline-block;width:36px;height:20px}
.sw input{display:none}
.sw i{position:absolute;inset:0;background:var(--bd);border-radius:20px;transition:.2s;cursor:pointer}
.sw i:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i:before{transform:translateX(16px)}
/* 布局 */
#app{flex:1;display:grid;grid-template-columns:280px 1fr;min-height:0}
aside{border-right:1px solid var(--bd);overflow-y:auto;padding:8px}
main{overflow-y:auto;padding:12px 18px;min-width:0}
/* 项目列表 */
.pitem{padding:8px 10px;border-radius:8px;cursor:pointer;margin:2px 0;border:1px solid transparent;position:relative}
.pitem:hover{background:var(--card)}
.pitem.active{background:var(--card);border-color:var(--bd)}
.newbtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;
        border:1px solid var(--bd);border-radius:6px;color:var(--mut);cursor:pointer;
        font-size:13px;line-height:1;padding:4px 8px}
.newbtn:hover{border-color:var(--acc);color:var(--fg)}
.pname{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{font-size:12px;color:var(--mut)}
/* 会话卡片 */
.scard{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin:8px 0;cursor:pointer}
.scard:hover{border-color:var(--acc)}
.stitle{font-weight:600;margin:2px 0}
.b{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:#fff;white-space:nowrap}
.working{background:#d97706}.idle{background:#16a34a}.stale{background:#888}
.chip{display:inline-block;padding:0 7px;border:1px solid var(--bd);border-radius:10px;font-size:12px;color:var(--mut);margin:1px 2px;background:var(--card)}
.mut{color:var(--mut);font-size:12px}
.grid{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0;font-size:12px;color:var(--mut)}
.grid b{color:var(--fg);font-weight:600}
ul{margin:6px 0;padding-left:18px}
.completed{text-decoration:line-through;color:var(--mut)}
.in_progress{font-weight:600}
h4{margin:10px 0 2px;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.fold{margin:8px 0 2px}
.fold>summary{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;list-style:none;user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary:before{content:"▸ "}
.fold[open]>summary:before{content:"▾ "}
.fold ul{max-height:300px;overflow-y:auto}
.empty{color:var(--mut);padding:40px;text-align:center}
#err{color:#dc2626;font-size:12px}
.back{background:none;border:1px solid var(--bd);border-radius:6px;color:var(--fg);padding:3px 12px;cursor:pointer;font-size:13px}
.back:hover{border-color:var(--acc)}
/* 对话 */
.msg{margin:10px 0}
.mhead{font-size:11px;color:var(--mut);margin-bottom:2px}
.ubody{background:var(--accbg);border-radius:10px;padding:8px 12px;white-space:pre-wrap;word-break:break-word;max-width:85%}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .mhead{text-align:right}
.abody{max-width:100%;word-break:break-word}
.abody pre{background:var(--card2);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;overflow-x:auto;font-size:12.5px}
.abody code{font-family:ui-monospace,monospace;font-size:12.5px;background:var(--card2);padding:0 3px;border-radius:4px}
.abody pre code{background:none;padding:0}
.abody p{margin:4px 0}
.abody h1,.abody h2,.abody h3{font-size:15px;margin:8px 0 4px}
.abody table{border-collapse:collapse}.abody td,.abody th{border:1px solid var(--bd);padding:2px 8px;font-size:13px}
.tool{font:12px ui-monospace,monospace;color:var(--mut);background:var(--card2);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;margin:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.terror{font-size:12px;color:#dc2626;background:rgba(220,38,38,.08);border-radius:6px;padding:2px 8px;margin:3px 0}
.apierr{font-size:12px;color:#b45309;background:rgba(217,119,6,.10);border:1px solid rgba(217,119,6,.4);
  border-radius:6px;padding:6px 10px;margin:8px 0;white-space:pre-wrap}
.tool-details{margin:3px 0;font-size:12px}
.tool-details>summary{cursor:pointer;color:var(--mut);font-family:ui-monospace,monospace;
  background:var(--card2);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-out{margin:4px 0;max-height:320px;overflow:auto;background:var(--card2);
  border:1px solid var(--bd);border-radius:6px;padding:6px 8px;white-space:pre-wrap;
  font:12px ui-monospace,monospace}
.diff-add{color:#16a34a}.diff-del{color:#dc2626}.diff-hunk{color:var(--acc)}
/* 待审批卡片：权限 / 计划 / 问答共用 */
.inter-card{background:var(--card);border:1px solid var(--bd);border-left:3px solid #d97706;
  border-radius:8px;padding:10px 14px;margin:10px 0}
.inter-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.inter-kind{font-size:11px;font-weight:600;letter-spacing:.04em;color:#b45309;
  background:rgba(217,119,6,.12);border-radius:4px;padding:1px 7px}
.inter-tool{font:12px ui-monospace,monospace;color:var(--mut)}
.inter-reason{font-size:12.5px;color:var(--mut);white-space:pre-wrap;margin-bottom:6px}
.inter-card pre,.inter-preview{margin:4px 0;max-height:240px;overflow:auto;background:var(--card2);
  border:1px solid var(--bd);border-radius:6px;padding:6px 8px;white-space:pre-wrap;
  font:12px ui-monospace,monospace}
.inter-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:10px}
.ibtn{font:inherit;font-size:13px;padding:4px 14px;border-radius:6px;cursor:pointer;
  border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.ibtn:hover{border-color:var(--acc)}
.ibtn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.ibtn.primary:hover{filter:brightness(1.08)}
.ibtn.secondary{background:none;border-color:var(--acc);color:var(--acc)}
.ibtn.danger{background:none;border-color:#dc2626;color:#dc2626}
.ibtn.danger:hover{background:rgba(220,38,38,.08)}
/* 问答：选项整行可选，选中高亮 */
.choice-q+.choice-q{margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
.choice-head{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.choice-text{margin-bottom:6px}
.choice-opt{position:relative;display:flex;flex-direction:column;gap:2px;width:100%;
  margin:4px 0;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;
  background:var(--bg);cursor:pointer}
.choice-opt:hover{border-color:var(--acc)}
.choice-opt:has(input:checked){border-color:var(--acc);background:var(--accbg)}
.choice-opt:focus-within{outline:2px solid var(--acc);outline-offset:1px}
.choice-opt input{position:absolute;opacity:0;pointer-events:none}
.opt-desc{font-size:12px;color:var(--mut)}
.choice-free{width:100%;margin-top:6px;background:var(--bg);color:var(--fg);
  border:1px solid var(--bd);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px}
.choice-free:focus{outline:none;border-color:var(--acc)}
#pendingbadge,.chip.pending{border-color:rgba(217,119,6,.5);background:rgba(217,119,6,.10);
  color:#b45309;font-weight:600}
@media(prefers-color-scheme:dark){
  .inter-card{border-left-color:#f59e0b}
  .inter-kind{color:#fbbf24;background:rgba(217,119,6,.18)}
  #pendingbadge,.chip.pending{color:#fbbf24}
}
.sysbody{font-size:12.5px;color:var(--mut);white-space:pre-wrap;word-break:break-word;
         border:1px dashed var(--bd);border-radius:6px;padding:4px 8px;max-width:100%}
.msg.tool,.msg.system{display:flex;flex-direction:column;align-items:flex-start}
.info-panel{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;margin:10px 0}
.model-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.model-controls input{min-width:180px;max-width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:3px 8px;font:inherit;font-size:12px}
.model-controls input[hidden]{display:none}
.composer textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;resize:vertical;font:inherit}
.composer-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.composer-status{white-space:pre-wrap;margin-top:4px}
.config-path{overflow-wrap:anywhere;font-family:ui-monospace,monospace;font-size:12px;margin:3px 0}
button:disabled,select:disabled{opacity:.5;cursor:not-allowed}
/* 移动端：抽屉式侧栏 */
#menu{display:none}
#mask{display:none}
@media(max-width:768px){
  #app{grid-template-columns:1fr}
  #menu{display:inline-block}
  header{padding:8px 10px;gap:10px}
  main{padding:8px 10px}
  .ubody{max-width:92%}
  aside{position:fixed;top:0;bottom:0;left:0;width:min(75vw,300px);z-index:20;background:var(--bg);
        transform:translateX(-100%);transition:transform .2s ease}
  aside.open{transform:none}
  #mask{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15;
        opacity:0;pointer-events:none;transition:opacity .2s}
  #mask.show{opacity:1;pointer-events:auto}
}
</style>
</head>
<body>
<header>
  <button id="menu" class="back" aria-label="项目列表">☰</button>
  <h1>Claude Sessions <span class="mut" id="total"></span></h1>
  <label class="ctl">
    <span class="sw"><input type="checkbox" id="auto" checked><i></i></span> 自动刷新
  </label>
  <label class="ctl">间隔
    <select id="ival">
      <option value="2000">2s</option>
      <option value="3000">3s</option>
      <option value="5000">5s</option>
      <option value="10000">10s</option>
    </select>
  </label>
  <span class="ctl" id="updated"></span>
  <button id="pendingbadge" class="back" style="display:none"
          title="有权限请求等待审批，点击跳转">待审批 0</button>
  <span id="err"></span>
</header>
<div id="app">
  <aside id="projs"></aside>
  <main id="main"></main>
</div>
<div id="mask"></div>

<script>
const DEFAULT_IVAL = {{ refresh_interval | round(3) }} * 1000;
const SEND_POLL_TIMEOUT_MS = 30 * 60 * 1000;   // 发送后跟踪 /jobs 的最长时间
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATE_ZH = {working: "工作中", idle: "空闲", stale: "无活动"};
// <details> 的展开状态跨 innerHTML 重建保留；key 必须由内容派生且稳定
const detailsOpen = (() => {
  const state = Object.create(null);
  if(typeof sessionStorage === "undefined") return state;
  try{ return Object.assign(state, JSON.parse(sessionStorage.getItem("detailsOpen") || "{}")); }
  catch{ return state; }
})();
function saveDetailsOpen(){
  if(typeof sessionStorage === "undefined") return;
  try{ sessionStorage.setItem("detailsOpen", JSON.stringify(detailsOpen)); }catch{ /* 超限或隐私模式 */ }
}
function detailsAttrs(key, defaultOpen = false){
  const open = key in detailsOpen ? detailsOpen[key] : defaultOpen;
  return ` data-dkey="${esc(key)}"` + (open ? " open" : "");
}
const TASK_ZH = {pending: "待办", in_progress: "进行中", completed: "已完成", deleted: "已删除"};

let sessions = [];                 // 最新概览数据
let view = {project: null, session: null};   // 当前视图
let curPanel = null;               // main 里已渲染的面板 {type:"list"|"conv"|"new", key}，
                                   // 自动刷新只更新数据区域、不重建输入区，避免失焦/丢草稿
let convCache = {id: null, size: -1};        // 对话缓存标记，避免重复渲染
let convState = {id: null, msgs: [], total: 0, cursor: 0, start: 0, size: -1,
                 hasMore: false, loadingEarlier: false};
let lastSidebarSig = "", lastListSig = "";
let esGlobal = null, esSession = null, globalSeq = 0, sessionSeq = 0;
let listTimer = null, convTimer = null;
let lastListLoad = 0;              // 上次 /sessions 请求开始的毫秒时间戳
let liveText = "", liveRaf = null;
let timer = null;
let sendJobs = {};                 // key -> {jobId, status, result, error} 发送任务状态，跨刷新保留；
                                   // key 为会话 id 或 "new:<cwd>"，多个会话可各有一个进行中任务

/* ---------- 工具 ---------- */
function relTime(ts){
  if(!ts) return "";
  const d = Date.now()/1000 - ts;
  if(d < 60) return Math.floor(d) + " 秒前";
  if(d < 3600) return Math.floor(d/60) + " 分钟前";
  if(d < 86400) return Math.floor(d/3600) + " 小时前";
  return Math.floor(d/86400) + " 天前";
}
function dur(a, b){
  if(!a || !b || b <= a) return "";
  const d = b - a;
  if(d < 3600) return Math.floor(d/60) + "m";
  if(d < 86400) return (d/3600).toFixed(1) + "h";
  return (d/86400).toFixed(1) + "d";
}
function fmtTok(n){
  if(!n) return "0";
  if(n >= 1e6) return (n/1e6).toFixed(1) + "M";
  if(n >= 1e3) return (n/1e3).toFixed(1) + "k";
  return String(n);
}
const projName = cwd => (cwd || "?").replace(/[\\/]+$/, "").split(/[\\/]/).pop() || cwd;
const sessTitle = s => (!s.title || s.title.includes("�")) ? (s.first_user_message || s.id.slice(0, 8)) : s.title;

/* ---------- URL 路由 ---------- */
// 路径按目录层级展开，保留几乎可读的字符；只转义空格、#、? 等会破坏 URL 的字符
function encSeg(s){ return encodeURIComponent(String(s)).replace(/%3A/gi, ":"); }
function decSeg(s){
  try{ return decodeURIComponent(s); }catch{ return null; }
}
function normPath(p){
  return String(p == null ? "" : p).replace(/\\/g, "/").replace(/^\/+|\/+$/g, "");
}
function sameProject(a, b){ return !!a && !!b && normPath(a) === normPath(b); }
function projectUrlPath(cwd){
  return normPath(cwd).split("/").filter(Boolean).map(encSeg).join("/");
}
function routePath(v){
  if(!v || !v.project) return "/";
  const base = "/p/" + projectUrlPath(v.project);
  if(v.session) return base + "/s/" + encSeg(v.session);
  if(v.new) return base + "/new";
  return base;
}
function parseRoute(pathname){
  if(!pathname) return null;
  const parts = pathname.split("/").filter(Boolean);
  if(parts.length < 2 || parts[0] !== "p") return null;
  const all = parts.slice(1).map(decSeg);
  if(all.some(x => x === null)) return null;
  let rest = parts.slice(1), session = null, isNew = false;
  // 从右端识别 /s/<会话ID> 与 /new；项目路径本身可能包含斜杠
  if(rest.length >= 3 && rest[rest.length - 2] === "s"){
    session = decSeg(rest[rest.length - 1]);
    if(session === null) return null;
    rest = rest.slice(0, -2);
  } else if(rest.length >= 2 && rest[rest.length - 1] === "new"){
    isNew = true;
    rest = rest.slice(0, -1);
  }
  if(!rest.length) return null;
  const project = rest.map(decSeg).join("/");
  // fullProject 用于消歧：目录本身就叫 new 或形如 .../s/xxx 时优先按项目列表解析
  return {project, session, new: isNew, fullProject: all.join("/")};
}
// 把 URL 中的可读路径映射回系统原生 cwd；同时处理 "项目目录名恰好是 new" 的歧义
function resolveViewProject(projects){
  if(!view) return;
  if(view.fullProject){
    const exact = projects.find(p => sameProject(p.cwd, view.fullProject));
    if(exact){
      view = {project: exact.cwd, session: null, new: false};
      return;
    }
    delete view.fullProject;
  }
  if(!view.project) return;
  const match = projects.find(p => sameProject(p.cwd, view.project));
  if(match) view.project = match.cwd;
}

function md(text){
  if(window.marked){
    const html = marked.parse(text);
    return window.DOMPurify ? DOMPurify.sanitize(html) : html;
  }
  return `<pre>${esc(text)}</pre>`;
}

/* ---------- 模型选择 / 项目 local 配置（不展示配置正文） ---------- */
const modelDrafts = Object.create(null), modelProfileOptions = Object.create(null), modelOptionRequests = Object.create(null), ccStates = Object.create(null);
function modelDraft(key, selected = null){
  return modelDrafts[key] ||= {value: selected, custom: selected || "", status: "", version: 0};
}
const defaultModelChoice = "default", customModelChoice = "custom";
function profileModelChoice(index){ return "profile:" + index; }
function modelChoiceFor(key, model){
  const index = (modelProfileOptions[key] || []).findIndex(item => item.model === model);
  return index < 0 ? customModelChoice : profileModelChoice(index);
}
function modelControlsHtml(){
  return `<div class="model-controls"><label class="ctl">模型选择
    <select id="modelsel" aria-label="模型选择"><option value="default" data-kind="default">默认（清除 Web 覆盖）</option>
      <option value="custom" data-kind="custom">自定义 ID</option></select></label>
    <input id="modelcustom" aria-label="自定义模型 ID" placeholder="完整或自定义模型 ID" maxlength="256" hidden>
    <span class="mut" id="modelst" role="status"></span></div>`;
}
// 会话页和新建会话页共用同一个输入对话框，避免两套 textarea/按钮/键盘行为
function composerHtml(mode, d){
  const isNew = mode === "new";
  d = d || {};
  return `<div class="info-panel composer">
    ${isNew ? '<div class="mut" style="margin-bottom:6px">将在此目录启动一个全新会话（不依赖已有会话历史），首轮跑完自动进入对话视图。</div>' : ""}
    ${modelControlsHtml()}
    <textarea id="msgbox" rows="3" placeholder="${isNew ? "输入首条消息…" : "给该会话发消息…"}"></textarea>
    <div class="composer-actions">
      <button class="back" id="sendbtn">${isNew ? "创建并发送" : "发送"}</button>
      ${isNew ? "" : `<button class="back" id="intbtn" disabled>中断</button>`}
      <label class="ctl" id="approvalwrap">审批
        <select id="approvalsel" aria-label="托管审批模式">
          <option value="auto">自动</option>
          <option value="ask">询问</option>
          <option value="full">全部允许</option>
        </select></label>
      ${isNew ? "" : `<label class="ctl" title="会话显示 working 时也允许发送；非托管会话可能与终端进程并发写入">
        <input type="checkbox" id="forcecb" checked> 工作状态下也发送</label>`}
      <label class="ctl" title="勾选后本次发送会启动一个常驻 claude 进程接管该会话，之后的消息直接写进它的 stdin，不再每次重启">
        <input type="checkbox" id="hostcb" ${!isNew && d.hosted ? "checked disabled" : ""}> 托管（常驻进程，后续消息不再重启）</label>
      ${!isNew && d.hosted ? `<span class="chip">⚙ 已托管，消息直接写入常驻进程</span>
        <button class="back" id="unhostbtn" title="让常驻进程做完当前一轮后正常退出">退出托管</button>` : ""}
    </div>
    <div class="mut composer-status" id="sendst"></div>
  </div>`;
}
function bindComposerKeys(){
  const btn = document.getElementById("sendbtn"), box = document.getElementById("msgbox");
  if(!btn || !box) return;
  box.addEventListener("keydown", event => {
    if(event.key === "Enter" && !event.shiftKey && !event.isComposing && event.keyCode !== 229){
      event.preventDefault();
      btn.click();
    }
  });
}
function updateModelOptions(key, options){
  const sel = document.getElementById("modelsel"), input = document.getElementById("modelcustom");
  if(!sel || !input || !panelMatch(key)) return;
  const state = modelDraft(key);
  const selectedOption = Array.from(sel.options).find(option => option.value === sel.value);
  const selectedKind = selectedOption?.dataset?.kind;
  const customValue = input.value;
  const unique = [], seen = new Set();
  for(const item of Array.isArray(options) ? options : []){
    if(!item || typeof item.name !== "string" || typeof item.model !== "string" || !item.model) continue;
    const identity = JSON.stringify([item.name, item.model]);
    if(seen.has(identity)) continue;
    seen.add(identity); unique.push({name: item.name, model: item.model});
  }
  modelProfileOptions[key] = unique;
  const savedProfileChoice = state.value !== null && unique.some(item => item.model === state.value)
    ? modelChoiceFor(key, state.value) : null;
  let selected = selectedKind === "custom"
    ? (!state.touched && savedProfileChoice ? savedProfileChoice : customModelChoice)
    : selectedKind === "profile" || state.value !== null
      ? (savedProfileChoice || customModelChoice) : defaultModelChoice;
  const add = (label, value, kind, model = "") => {
    const option = document.createElement("option");
    option.textContent = label; option.value = value; option.dataset.kind = kind;
    if(model) option.dataset.model = model;
    sel.appendChild(option);
  };
  sel.replaceChildren();
  add("默认（清除 Web 覆盖）", defaultModelChoice, "default");
  for(let i = 0; i < unique.length; i++){
    const item = unique[i]; add(item.name, profileModelChoice(i), "profile", item.model);
  }
  add("自定义 ID", customModelChoice, "custom");
  if(selected.startsWith("profile:") && !Array.from(sel.options).some(option => option.value === selected)) selected = customModelChoice;
  sel.value = selected;
  input.value = customValue;
  input.hidden = selected !== customModelChoice;
}
async function loadModelOptions(key, cwd){
  const generation = modelOptionRequests[key] = (modelOptionRequests[key] || 0) + 1;
  const isCurrent = () => modelOptionRequests[key] === generation && panelMatch(key);
  try{
    const r = await fetchT("/cc-switch?cwd=" + encodeURIComponent(cwd || ""));
    if(!r.ok) throw Error("HTTP " + r.status);
    const data = await r.json();
    if(!Array.isArray(data.model_options)) throw Error("响应缺少模型选项");
    if(isCurrent()) updateModelOptions(key, data.model_options);
  }catch(e){
    if(!isCurrent()) return;
    modelDraft(key).status = "local 配置模型选项未加载，可使用默认或自定义模型 ID";
    updateModelSt(key);
  }
}
function updateModelSt(key){
  if(!panelMatch(key)) return;
  const el = document.getElementById("modelst");
  if(el) el.textContent = modelDraft(key).status;
}
async function saveModel(key){
  const s = modelDraft(key);
  s.version++;
  if(s.saving) return;
  s.saving = true;
  try{
    for(;;){
      const version = s.version, model = s.value;
      s.status = "保存中…"; updateModelSt(key);
      try{
        const r = await fetchT("/sessions/" + encodeURIComponent(key) + "/model", {
          method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({model}),
        });
        const j = await r.json();
        if(!r.ok || j.error) throw Error(j.error || "HTTP " + r.status);
        s.status = "已保存，下次发送生效";
      }catch(e){ s.status = "保存失败：" + e.message + "（可重选后重试）"; }
      if(version === s.version) break; // 串行合并编辑，较早请求不能盖过最后的选择
    }
  }finally{ s.saving = false; updateModelSt(key); }
}
function bindModel(key, selected){
  const s = modelDraft(key, selected), sel = document.getElementById("modelsel"), input = document.getElementById("modelcustom");
  sel.value = s.value === null ? defaultModelChoice : modelChoiceFor(key, s.value);
  input.hidden = sel.value !== customModelChoice; input.value = s.custom;
  const edit = save => {
    if(!panelMatch(key)) return;
    const option = Array.from(sel.options).find(item => item.value === sel.value);
    const kind = option?.dataset?.kind;
    input.hidden = kind !== "custom";
    s.custom = input.value;
    s.value = kind === "custom" ? input.value : kind === "profile" ? option.dataset.model : null;
    if(kind === "custom" && !input.value){
      s.status = "请输入自定义模型 ID"; updateModelSt(key); return;
    }
    if(save && !key.startsWith("new:")) saveModel(key);
    else if(key.startsWith("new:")){ s.status = "随首次发送提交"; updateModelSt(key); }
  };
  sel.onchange = () => { s.touched = true; edit(true); };
  input.oninput = () => { s.touched = true; edit(false); }; // 异步选项加载不覆盖尚未失焦的自定义编辑
  input.onchange = () => { s.touched = true; edit(true); };
  updateModelSt(key);
}
function modelSnapshot(key){
  const value = modelDraft(key).value;
  if(value !== null && (!value || value.length > 256 || value.trim() !== value || /[\x00-\x1f\x7f]/.test(value))){
    modelDraft(key).status = "请输入有效模型 ID（最多 256 字符，无首尾空白或控制字符）";
    updateModelSt(key); return undefined;
  }
  return value;
}
function ccHtml(){

    <div class="mut" id="ccbody" aria-live="polite"></div></details>`;
}
function ccMatch(cwd){
  const el = document.getElementById("ccpanel");

  return el.ccPanel === curPanel.type + ":" + curPanel.key;
}
function bindCc(cwd){
  const el = document.getElementById("ccpanel");
  el.ccCwd = cwd; el.ccPanel = curPanel.type + ":" + curPanel.key;
  const s = ccStates[cwd] ||= {};

function renderCc(cwd){

  const body = document.getElementById("ccbody");
  body.innerHTML = `<div class="config-path">目录：${esc(d?.target_cwd || cwd)}</div>` +
    (d ? `<div class="config-path">目标文件：${esc(d.target_path || "未提供")}</div>
      <div>当前 profile：${esc(d.current_profile || "未设置")}</div>
      <div class="model-controls"><select id="ccprofile" aria-label="local profile"></select>
        <button class="back" id="ccapply">应用 local</button><button class="back" id="ccrefresh">刷新</button></div>
      <div>${esc(!d.installed ? d.reason || "未安装 cc-switch，无法切换" : !d.available ? d.reason || "当前目录不可用" : "仅写入该目录 local；同目录会话共享。")}</div>` :
      `<button class="back" id="ccrefresh">加载配置状态</button>`) +
    `<div role="status" style="white-space:pre-wrap">${esc(s.pending ? "操作中…" : s.message || "")}</div>`;
  const refresh = document.getElementById("ccrefresh");
  refresh.disabled = !!s.pending; refresh.onclick = () => loadCc(cwd);
  if(!d) return;
  const sel = document.getElementById("ccprofile");
  // 用 textContent / value 填入名称，不把外部名称拼进 HTML 属性
  for(const name of d.profiles || []){
    const option = document.createElement("option"); option.value = name; option.textContent = name; sel.appendChild(option);
  }
  s.profile = (d.profiles || []).includes(s.profile) ? s.profile : (d.profiles || []).includes(d.current_profile) ? d.current_profile : d.profiles?.[0] || "";
  sel.value = s.profile;
  sel.disabled = !!s.pending || !d.installed || !d.available;
  sel.onchange = () => { if(ccMatch(cwd)) s.profile = sel.value; };
  const apply = document.getElementById("ccapply");
  apply.disabled = !!s.pending || !d.installed || !d.available || !s.profile || !d.revision || !d.target_path;
  apply.onclick = () => applyCc(cwd);
}
async function loadCc(cwd){
  const s = ccStates[cwd] ||= {};
  if(s.pending) return;
  s.pending = true; s.message = ""; renderCc(cwd);
  try{
    const r = await fetchT("/cc-switch?cwd=" + encodeURIComponent(cwd));
    const d = await r.json();
    if(!r.ok || d.error) throw Error(d.error || "HTTP " + r.status);
    s.data = d;
  }catch(e){ s.data = null; s.message = "加载失败：" + e.message; }
  finally{ s.pending = false; renderCc(cwd); }
}
async function applyCc(cwd){
  const s = ccStates[cwd], d = s?.data;
  if(!d?.installed || !d.available || s.pending || !(d.profiles || []).includes(s.profile) || !d.target_path || !d.revision) return;
  const profile = s.profile, revision = d.revision;
  if(!window.confirm(`应用 profile：${profile}\n目标目录：${d.target_cwd}\n目标文件：${d.target_path}\n\n将整文件覆盖 local 配置；原文件存在时先自动备份。\n同目录的其他会话共享此配置。\n已有 Hosted 托管进程不会重启，也不会热切换；请退出后重新托管以加载。\n\n确定应用？`)) return;
  s.pending = true; s.message = ""; renderCc(cwd);
  try{
    const r = await fetchT("/cc-switch/local", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({cwd, profile, confirm: true, revision})}, 60000);
    const j = await r.json();
    if(!r.ok || j.error) throw Error((j.error || "HTTP " + r.status) + (r.status === 409 ? "；请刷新状态后重新确认" : ""));
    s.data = j;
    s.message = "local 已写入，已有托管进程未重启，请退出后重新托管。" +
      (j.backed_up ? "\n已备份原文件" + (j.backup_path ? "：" + j.backup_path : "") : "\n原文件不存在，无需备份。");
  }catch(e){
    s.message = "应用失败：" + e.message + "\n磁盘配置可能已改变，请刷新核实后再操作。";
    s.data = null; // 不允许用旧 revision 再次确认
  }finally{ s.pending = false; renderCc(cwd); }
}

/* ---------- SSE 实时更新 ---------- */
const SSE_TYPES = ["snapshot", "session_discovered", "user_message", "assistant_message",
  "tool_use", "tool_error", "turn_finished", "subagent_start", "task_created",
  "task_updated", "context_compacted", "api_error", "hosted_turn_done",
  "hosted_api_retry", "hosted_foreign_turn", "interaction_pending",
  "interaction_resolved", "turn_interrupted", "turn_delta", "remote_message_sent",
  "remote_message_done", "hosted_exited"];
const raf = window.requestAnimationFrame || (fn => setTimeout(fn, 16));

function listGap(){ return +ival.value || DEFAULT_IVAL; }
function scheduleListRefresh(){
  // SSE 事件驱动的刷新也受用户设置的间隔约束，否则活跃会话会把 5s 设置变成每 800ms 一次
  clearTimeout(listTimer);
  const wait = Math.max(0, listGap() - (Date.now() - lastListLoad));
  listTimer = setTimeout(() => {
    listTimer = null;
    if(!document.hidden) load();
  }, wait);
}
function scheduleConvRefresh(sid){
  if(view.session !== sid) return;
  clearTimeout(convTimer);
  convTimer = setTimeout(() => {
    if(!document.hidden) renderConversation(sid, false);
  }, 500);
}
function onGlobalSse(event){
  let msg;
  try{ msg = JSON.parse(event.data); }catch{ return; }
  if(msg.seq && msg.seq <= globalSeq) return;
  if(msg.seq) globalSeq = msg.seq;
  handleSseMessage(msg);
}
function onSessionSse(event){
  let msg;
  try{ msg = JSON.parse(event.data); }catch{ return; }
  if(msg.seq && msg.seq <= sessionSeq) return;
  if(msg.seq) sessionSeq = msg.seq;
  handleSseMessage(msg);
}
function handleSseMessage(msg){
  if(msg.type === "snapshot"){
    if(msg.data.sessions){
      sessions = msg.data.sessions;
      renderMain();
    }
    if(msg.data.session && view.session === msg.session){
      applySessionDetail(msg.data.session);
      if(msg.data.live && msg.data.live.text) updateLiveBubble(msg.data.live.text);
      scheduleConvRefresh(msg.session);
    }
    return;
  }
  if(msg.type === "turn_delta"){
    if(view.session === msg.session) updateLiveBubble(msg.data.text || "");
    return;
  }
  if(["turn_finished", "hosted_turn_done", "interaction_pending",
      "turn_interrupted"].includes(msg.type) && view.session === msg.session){
    clearLiveBubble();
  }
  scheduleListRefresh();
  if(msg.session) scheduleConvRefresh(msg.session);
}
function connectGlobalSse(){
  if(!window.EventSource) return;
  if(esGlobal) esGlobal.close();
  esGlobal = new EventSource("/events");
  for(const type of SSE_TYPES) esGlobal.addEventListener(type, onGlobalSse);
  let opened = false;
  esGlobal.onopen = () => {
    if(opened){
      globalSeq = 0;
      load();
      if(view.session) renderConversation(view.session, true);
    }
    opened = true;
  };
}
function connectSessionSse(id){
  if(!window.EventSource) return;
  disconnectSessionSse();
  esSession = new EventSource("/events?session=" + encodeURIComponent(id));
  for(const type of SSE_TYPES) esSession.addEventListener(type, onSessionSse);
  let opened = false;
  esSession.onopen = () => {
    sessionSeq = 0;
    if(opened && view.session === id) renderConversation(id, true);
    opened = true;
  };
}
function disconnectSessionSse(){
  if(esSession){ esSession.close(); esSession = null; }
}
function applySessionDetail(d){
  if(!d) return;
  const badge = document.getElementById("statebadge");
  if(badge){ badge.className = "b " + d.state; badge.textContent = STATE_ZH[d.state] || d.state; }
  const panel = document.getElementById("infopanel");
  if(panel) panel.innerHTML = infoHtml(d);
  renderApiError(d.last_api_error);
  updateModelSt(d.id || convState.id || "");
}
function renderApiError(err){
  // 上游 503/限流时 CLI 只写 system/api_error，转录里没有助手内容；
  // 这里把服务端记录的重试状态显示出来，避免看起来像卡死
  const el = document.getElementById("apierr");
  if(!el) return;
  if(!err || !err.text){
    el.textContent = "";
    el.style.display = "none";
    return;
  }
  let tail = "";
  // 只有最近发生的错误才算“正在重试”；重启服务回放旧转录时不显示过期的重试状态
  const fresh = err.ts && Date.now() / 1000 - err.ts < 180;
  if(err.retry_attempt && fresh){
    tail = `，正在第 ${err.retry_attempt}${err.max_retries ? "/" + err.max_retries : ""} 次重试`;
    if(err.retry_in_ms) tail += `，约 ${Math.max(1, Math.round(err.retry_in_ms / 1000))} 秒后继续`;
  }
  el.textContent = "⚠ 模型服务暂不可用：" + err.text + tail;
  el.style.display = "";
}
function updateLiveBubble(text){
  liveText = text || "";
  if(liveRaf) return;
  liveRaf = raf(() => { liveRaf = null; renderLiveBubble(); });
}
function renderLiveBubble(){
  const conv = document.getElementById("conv");
  if(!conv || !conv.insertBefore) return;
  let el = document.getElementById("livebubble");
  if(!liveText){
    if(el && el.remove) el.remove();
    return;
  }
  if(!el){
    el = document.createElement("div");
    el.id = "livebubble";
    el.className = "msg assistant";
    el.innerHTML = '<div class="mhead">助手 · 正在输入…</div><div class="abody"></div>';
    conv.insertBefore(el, conv.firstChild);
  }
  const body = el.querySelector ? el.querySelector(".abody") : null;
  if(body) body.textContent = liveText;
}
function clearLiveBubble(){
  liveText = "";
  renderLiveBubble();
}

/* ---------- 分组 ---------- */
function groupByProject(){
  const groups = new Map();
  for(const s of sessions){
    const k = s.project || s.cwd || "?";
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(s);
  }
  return [...groups.entries()]
    .map(([cwd, ss]) => ({
      cwd, sessions: ss,
      working: ss.filter(s => s.state === "working").length,
      wt: ss.filter(s => s.cwd && s.cwd !== s.project).length,
      out: ss.reduce((a, s) => a + ((s.tokens || {}).output || 0), 0),
      last: Math.max(...ss.map(s => s.last_event_at || 0)),
    }))
    // 侧栏顺序固定按项目名排列（不随活跃时间跳动），同名时按完整路径区分
    .sort((a, b) =>
      projName(a.cwd).localeCompare(projName(b.cwd), "zh", {numeric: true})
      || a.cwd.localeCompare(b.cwd, "zh", {numeric: true}));
}

function diffHtml(text){
  return String(text || "").split("\n").map(line => {
    const cls = line.startsWith("+") ? "diff-add" : line.startsWith("-") ? "diff-del"
              : line.startsWith("@@") ? "diff-hunk" : "";
    return `<span class="${cls}">${esc(line)}</span>`;
  }).join("\n");
}
function toolResultHtml(p){
  // 已合并到工具卡时结果在 p.result；缓存从中间开始时可能是独立的 tool_result part
  const r = p.result || (p.type === "tool_result" ? p : null);
  if(!r) return "";
  if(r.kind === "diff") return `<pre class="tool-out">${diffHtml(r.text)}</pre>`;
  if(r.kind === "image") return `<div class="mut">[图片] ${esc(r.text || "")}</div>`;
  if(r.is_error || r.kind === "error") return `<div class="terror">✗ ${esc(r.text || "")}</div>`;
  return `<pre class="tool-out">${esc(r.text || "")}</pre>`;
}
function toolPartHtml(p){
  if(p.type === "tool_result")
    return `<div class="tool">🔧 工具结果${p.is_error ? " (错误)" : ""}</div>` + toolResultHtml(p);
  if(p.type === "tool_note") return `<div class="sysbody">${esc(p.text)}</div>`;
  if(p.type === "error") return `<div class="terror">✗ ${esc(p.text)}</div>`;
  const notes = (p.notes || []).map(esc).join("\n");
  const key = p.tool_use_id ? "tool:" + p.tool_use_id : "";
  return `<details class="tool-details"${key ? detailsAttrs(key) : ""}><summary>🔧 ${esc(p.name)}: ${esc(p.input)}</summary>` +
    (notes ? `<div class="mut">${esc(notes)}</div>` : "") + toolResultHtml(p) + `</details>`;
}
function convHtml(messages){
  // 连续同角色合并为一组渲染
  const groups = [];
  for(const m of messages){
    const last = groups[groups.length - 1];
    if(last && last.role === m.role) last.parts.push(...m.parts);
    else groups.push({role: m.role, ts: m.ts, parts: [...m.parts]});
  }
  return groups.map(g => {
    const body = g.parts.map(p => {
      if(p.type === "text")
        return g.role === "user" ? `<div class="ubody">${esc(p.text)}</div>`
             : g.role === "assistant" ? `<div class="abody">${md(p.text)}</div>`
             : `<div class="sysbody">${esc(p.text)}</div>`;
      if(["tool", "tool_result", "tool_note", "error"].includes(p.type)) return toolPartHtml(p);
      return "";
    }).join("");
    const who = {user: "用户", assistant: "助手", tool: "工具", system: "系统"}[g.role] || g.role;
    const when = g.ts ? new Date(g.ts*1000).toLocaleString() : "";
    return `<div class="msg ${g.role}"><div class="mhead">${who} · ${when}</div>${body}</div>`;
  }).join("");
}

let interCache = {id: null, sig: ""};
function interactionsHtml(items){
  if(!items || !items.length) return "";
  return items.map(it => {
    const preview = it.preview || {};
    const iid = esc(it.id);
    if(it.kind === "plan"){
      return `<div class="inter-card" data-iid="${iid}">
        <div class="inter-head"><span class="inter-kind">计划待确认</span>
          <code class="inter-tool">ExitPlanMode</code></div>
        <pre class="inter-preview">${esc(preview.text || "")}</pre>
        <div class="inter-actions">
          <button class="ibtn primary" data-act="allow" data-scope="once">批准计划</button>
          <button class="back" data-act="deny"
            data-reason="The user wants to keep planning.">继续规划</button>
        </div></div>`;
    }
    if(it.kind === "choice"){
      const questions = (it.questions || []).map((q, qi) => {
        const name = iid + "-q" + qi;
        const options = (q.options || []).map(o => {
          const type = q.multiSelect ? "checkbox" : "radio";
          return `<label class="choice-opt"><input type="${type}" name="${esc(name)}" ` +
            `data-label="${esc(o.label)}"><span>${esc(o.label)}</span>` +
            (o.description ? `<span class="opt-desc">${esc(o.description)}</span>` : "") +
            `</label>`;
        }).join("");
        return `<div class="choice-q" data-q="${esc(q.question)}">
          ${q.header ? `<div class="choice-head">${esc(q.header)}</div>` : ""}
          <div class="choice-text"><b>${esc(q.question)}</b>${
            q.multiSelect ? ' <span class="mut">（可多选）</span>' : ""}</div>
          ${options}
          <input class="choice-free" placeholder="其他答案（可选）" maxlength="2000">
        </div>`;
      }).join("");
      return `<div class="inter-card" data-iid="${iid}" data-choice="1">
        <div class="inter-head"><span class="inter-kind">需要你的选择</span>
          <code class="inter-tool">AskUserQuestion</code></div>${questions}
        <div class="inter-actions">
          <button class="ibtn primary" data-act="choice-submit">提交</button>
          <button class="back" data-act="deny">跳过</button>
        </div></div>`;
    }
    const body = preview.kind === "diff"
      ? `<pre class="inter-preview">${diffHtml(preview.text)}</pre>`
      : `<pre class="inter-preview">${esc(preview.text || "")}</pre>`;
    return `<div class="inter-card" data-iid="${iid}">
      <div class="inter-head"><span class="inter-kind">需要审批</span>
        <code class="inter-tool">${esc(it.tool_name)}</code></div>
      ${it.reason ? `<div class="inter-reason">${esc(it.reason)}</div>` : ""}
      ${body}
      <div class="inter-actions">
        <button class="ibtn primary" data-act="allow" data-scope="once">允许一次</button>
        ${it.allow_always ? '<button class="ibtn secondary" data-act="allow" data-scope="always">始终允许</button>' : ""}
        <button class="ibtn danger" data-act="deny">拒绝</button>
      </div></div>`;
  }).join("");
}
function collectChoiceAnswers(card){
  const answers = {};
  if(!card || !card.querySelectorAll) return answers;
  for(const q of card.querySelectorAll(".choice-q")){
    const text = q.dataset.q;
    const freeEl = q.querySelector(".choice-free");
    const free = freeEl ? freeEl.value.trim() : "";
    const picked = [...q.querySelectorAll("input:checked")].map(x => x.dataset.label);
    if(free) answers[text] = free;
    else if(picked.length) answers[text] = picked.join(", ");
  }
  return answers;
}
function renderInteractions(items){
  const el = document.getElementById("interactions");
  if(!el) return;
  const sig = JSON.stringify((items || []).map(it => [it.id, it.state]));
  if(interCache.sig === sig) return;
  interCache.sig = sig;
  el.innerHTML = interactionsHtml(items);
}
async function respondInteraction(card, act, scope, reason){
  if(!card) return;
  const iid = card.dataset.iid;
  let body;
  if(act === "choice-submit"){
    const answers = collectChoiceAnswers(card);
    const total = card.querySelectorAll ? card.querySelectorAll(".choice-q").length : 0;
    if(Object.keys(answers).length !== total){
      if(card.insertAdjacentHTML)
        card.insertAdjacentHTML("beforeend",
          '<div class="terror">请回答所有问题或点击跳过</div>');
      return;
    }
    body = {behavior: "allow", answers};
  } else if(act === "deny"){
    body = {behavior: "deny"};
    if(reason) body.reason = reason;
  } else {
    body = {behavior: act, scope: scope || "once"};
  }
  const buttons = card.querySelectorAll ? card.querySelectorAll("button") : [];
  buttons.forEach(b => b.disabled = true);
  try{
    const r = await fetchT("/interactions/" + encodeURIComponent(iid) + "/respond", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if(!r.ok) throw Error(j.error || ("HTTP " + r.status));
    interCache.sig = "";
    load();
  }catch(e){
    if(card.insertAdjacentHTML)
      card.insertAdjacentHTML("beforeend", `<div class="terror">${esc(e.message)}</div>`);
    buttons.forEach(b => b.disabled = false);
  }
}
function updateHostedControls(d){
  const sel = document.getElementById("approvalsel");
  if(sel && d && d.approval) sel.value = d.approval;
  const intBtn = document.getElementById("intbtn");
  if(intBtn && d){
    intBtn.disabled = !(d.hosted && d.hosted_busy);
    intBtn.title = d.hosted_queued ? ("队列 " + d.hosted_queued) : "";
  }
}

let convLoading = null;     // 正在拉取对话的会话 id，防止同一会话的请求叠加
function renderConvList(){
  const el = document.getElementById("conv");
  if(!el) return;
  el.innerHTML = convHtml(convState.msgs.slice().reverse()) +
    (convState.hasMore
      ? '<div style="text-align:center;margin:10px 0">' +
        '<button class="back" id="loadearlier">加载更早</button></div>'
      : "");
  const btn = document.getElementById("loadearlier");
  if(btn) btn.onclick = loadEarlier;
  const count = document.getElementById("convcount");
  if(count) count.textContent = `对话 (${convState.msgs.length}/${convState.total})`;
  if(!liveText){
    const live = document.getElementById("livebubble");
    if(live && live.remove) live.remove();
  }
}
async function loadEarlier(){
  if(!convState.id || !convState.hasMore || convState.loadingEarlier) return;
  convState.loadingEarlier = true;
  const main = document.getElementById("main");
  const oldHeight = main.scrollHeight, oldScroll = main.scrollTop;
  try{
    const r = await fetch(`/sessions/${encodeURIComponent(convState.id)}/messages` +
      `?before=${convState.start}&limit=100`);
    const page = await r.json();
    if(view.session !== convState.id) return;
    convState.msgs = (page.messages || []).concat(convState.msgs);
    convState.start = page.start;
    convState.hasMore = !!page.has_more;
    convState.total = page.total;
    convState.size = page.size;
    convState.cursor += page.shift || 0;   // 服务端前插了新块，末尾索引整体后移
    renderConvList();
    main.scrollTop = oldScroll + (main.scrollHeight - oldHeight);
  }catch(e){ /* 下次点击重试 */ }
  finally{ convState.loadingEarlier = false; }
}
async function renderConversation(id, force){
  if(!force && convLoading === id) return;
  convLoading = id;
  const main = document.getElementById("main");
  const draft = document.getElementById("msgbox")?.value || "";   // 整体重建面板时保留草稿
  try{
    const isNew = !(curPanel && curPanel.type === "conv" && curPanel.key === id
                    && document.getElementById("conv"));
    if(isNew || force || convState.id !== id){
      const [dRes, mRes] = await Promise.all([
        fetch("/sessions/" + encodeURIComponent(id)),
        fetch(`/sessions/${encodeURIComponent(id)}/messages?limit=100`),
      ]);
      const d = await dRes.json(), m = await mRes.json();
      if(view.session !== id) return;   // 已切换走
      if(d.error){   // 转录尚未被轮询发现（常见于刚创建的会话）
        if(isNew) main.innerHTML = '<div class="empty">会话转录尚未就绪，稍候自动刷新…</div>';
        return;
      }
      convState = {id, msgs: (m.messages || []).slice(),
                   total: m.total || 0, cursor: m.end || 0,
                   start: m.start || 0, size: m.size || 0,
                   hasMore: !!m.has_more, loadingEarlier: false};
      if(isNew){
        main.innerHTML = `
          <button class="back" id="back">← 返回列表</button>
          <h2 style="font-size:16px;margin:8px 0">
            <span class="b ${d.state}" id="statebadge">${STATE_ZH[d.state] || d.state}</span>
            ${d.hosted ? '<span class="chip">⚙ 托管中</span>' : ""}
            ${esc(sessTitle(d))}
            <span class="mut">${esc(d.cwd || "")}</span></h2>
          <div class="info-panel" id="infopanel">${infoHtml(d)}</div>
          <div id="interactions"></div>
          <div id="apierr" class="apierr" style="display:none"></div>
          ${composerHtml("conv", d)}
          <h4 id="convcount">对话</h4>
          <div id="conv"></div>`;
        document.getElementById("back").onclick = () => {
          navigate({project: view.project, session: null, new: false});
        };
        document.getElementById("msgbox").value = draft;
        bindSendBox(id, d);
        curPanel = {type: "conv", key: id};
        bindModel(id, d.selected_model);
        loadModelOptions(id, d.cwd);
        interCache = {id, sig: ""};
        connectSessionSse(id);
      }
      applySessionDetail(d);
      renderInteractions(d.interactions || []);
      updateHostedControls(d);
      if(isNew){
        updateSendSt(id);   // 恢复进行中任务的状态显示（需先设 curPanel，面板守卫才放行）
        main.scrollTop = 0;
      }
      clearLiveBubble();
      renderConvList();
      return;
    }

    // 同面板刷新：只更新数据区域，不重建输入区
    const dRes = await fetch("/sessions/" + encodeURIComponent(id));
    const d = await dRes.json();
    if(view.session !== id) return;
    if(d.error) return;
    applySessionDetail(d);
    renderInteractions(d.interactions || []);
    updateHostedControls(d);
    updateSendSt(id);
    const mRes = await fetch(`/sessions/${encodeURIComponent(id)}/messages` +
      `?from=${convState.cursor}&limit=500`);
    const m = await mRes.json();
    if(view.session !== id) return;
    if(convState.id !== id || m.size < convState.size || m.total < convState.total){
      // 文件被截断/替换：重新取最近一页
      const freshRes = await fetch(`/sessions/${encodeURIComponent(id)}/messages?limit=100`);
      const fresh = await freshRes.json();
      if(view.session !== id) return;
      convState = {id, msgs: (fresh.messages || []).slice(),
                   total: fresh.total || 0, cursor: fresh.end || 0,
                   start: fresh.start || 0, size: fresh.size || 0,
                   hasMore: !!fresh.has_more, loadingEarlier: false};
      renderConvList();
      main.scrollTop = 0;
    } else if(m.messages && m.messages.length){
      const oldHeight = main.scrollHeight, oldScroll = main.scrollTop;
      const nearTop = oldScroll < 80;
      convState.msgs.push(...m.messages);
      convState.total = m.total;
      convState.cursor = m.end;
      convState.size = m.size;
      clearLiveBubble();
      renderConvList();
      if(nearTop) main.scrollTop = 0;
      else main.scrollTop = oldScroll + (main.scrollHeight - oldHeight);
      if(m.end < m.total) scheduleConvRefresh(id);
    } else {
      convState.total = m.total;
      convState.cursor = m.end != null ? m.end : convState.cursor;
      convState.size = m.size;
    }
  }catch(e){ /* 下次刷新重试 */ }
  finally{ if(convLoading === id) convLoading = null; }
}

/* ---------- 远程发消息 / 托管 ---------- */
function fetchT(url, opts = {}, ms = 30000){
  // 带超时的 fetch：请求排不上队或连接被占满时直接报"超时"，而不是永远挂在"发送中…"
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, {...opts, signal: c.signal}).finally(() => clearTimeout(t));
}

function sendJobText(id){
  // 状态从模块级 sendJobs 读取，而不是闭包里的 DOM 引用——
  // 自动刷新会整体重渲染对话视图，旧引用会指向已替换的节点导致界面停在"发送中…"
  const j = sendJobs[id];
  if(!j) return "";
  if(j.status === "sending") return "发送中…";
  if(j.status === "queued") return "排队中…";
  if(j.status === "running") return "Claude 正在处理…";
  if(j.status === "done") return "已完成，回复见下方对话";
  if(j.status === "cancelled") return "已中断";
  if(j.status === "failed") return "失败: " + (j.error || "未知错误");
  return "";
}
function panelMatch(id){
  // 当前显示的面板是否属于该任务 key：后台轮询循环在用户切走后仍会存活，
  // 不检查就会把 A 会话的状态写进 B 会话/新建会话的输入区、禁用它们的按钮
  if(!curPanel) return false;
  if(curPanel.type === "conv") return curPanel.key === id;
  if(curPanel.type === "new") return id === "new:" + curPanel.key;
  return false;
}
function updateSendSt(id){
  if(!panelMatch(id)) return;
  const st = document.getElementById("sendst");
  if(st) st.textContent = sendJobText(id);
  const btn = document.getElementById("sendbtn");
  const j = sendJobs[id];
  // 对话视图里 running/queued 仍可继续发送：托管会话会排队；新建会话必须先拿到 sid，
  // 否则连点会创建多个新会话，所以新建面板继续锁住。
  const newPanel = curPanel && curPanel.type === "new";
  if(btn) btn.disabled = !!j && (j.status === "sending"
    || (newPanel && ["queued", "running"].includes(j.status)));
}

/* ---------- 新建会话（不依赖已有历史；可选托管常驻进程或每次独立运行） ---------- */
function renderNewSession(p){
  const main = document.getElementById("main");
  if(curPanel && curPanel.type === "new" && curPanel.key === p.cwd && document.getElementById("msgbox")){
    updateSendSt("new:" + p.cwd);   // 面板已在页面上：只更新状态行，不动输入框
    return;
  }
  const draft = document.getElementById("msgbox")?.value || "";   // 整体重建面板时保留草稿
  main.innerHTML = `
    <button class="back" id="back">← 返回列表</button>
    <h2 style="font-size:16px;margin:8px 0">新建会话 <span class="mut">${esc(p.cwd)}</span></h2>
    ${composerHtml("new", {})}`;
  document.getElementById("back").onclick = () => {
    navigate({project: view.project, session: null, new: false});
  };
  document.getElementById("msgbox").value = draft;
  bindNewBox(p);
  curPanel = {type: "new", key: p.cwd};
  bindModel("new:" + p.cwd, null);
  loadModelOptions("new:" + p.cwd, p.cwd);
  updateSendSt("new:" + p.cwd);   // 恢复进行中任务的状态显示（需先设 curPanel，面板守卫才放行）
}

function bindNewBox(p){
  const btn = document.getElementById("sendbtn");
  if(!btn) return;
  bindComposerKeys();
  btn.onclick = async () => {
    const text = document.getElementById("msgbox").value.trim();
    if(!text) return;
    const useHost = document.getElementById("hostcb").checked;
    const approval = document.getElementById("approvalsel")?.value || "auto";
    const key = "new:" + p.cwd;
    const selectedModel = modelSnapshot(key);
    if(selectedModel === undefined) return;
    sendJobs[key] = {status: "sending", requested_model: selectedModel};
    updateSendSt(key);
    let sid = null;
    const enterSession = () => {   // 拿到新 session id 后切换到对话视图
      modelDrafts[sid] = {...modelDraft(key), value: selectedModel};
      modelProfileOptions[sid] = modelProfileOptions[key] || [];
      sendJobs[sid] = sendJobs[key] || sendJobs[sid];   // 任务状态改挂到新会话 id 名下
      delete sendJobs[key];
      if(view.new && view.project === p.cwd){
        // 新建页是一次性入口，用 replace 换成会话地址，返回时直接回到项目列表
        navigate({project: p.cwd, session: sid, new: false}, {replace: true});
      }
    };
    try{
      const r = await fetchT(useHost ? "/hosted" : "/new", {
        method: "POST", headers: {"Content-Type": "application/json"},
        // 非托管 /new 不接受 approval；托管时把对话框里的选择带给首轮进程
        body: JSON.stringify(useHost
          ? {cwd: p.cwd, text, model: selectedModel, approval}
          : {cwd: p.cwd, text, model: selectedModel}),
      }, 30000);
      const j = await r.json();
      if(r.status !== 202){
        sendJobs[key] = {status: "failed", error: j.error || ("HTTP " + r.status)};
        updateSendSt(key); return;
      }
      document.getElementById("msgbox").value = "";
      const deadline = Date.now() + SEND_POLL_TIMEOUT_MS;
      for(;;){
        if(Date.now() >= deadline){
          sendJobs[sid || key] = {status: "failed", error: "等待任务状态超时，任务可能仍在执行"};
          updateSendSt(sid || key);
          break;
        }
        await new Promise(f => setTimeout(f, 1500));
        // 并行跟踪：任务状态 + 托管进程的 init 事件（后者几秒内就带上新 session id，不用等首轮跑完）
        const [jrRes, hsRes] = await Promise.all([
          fetchT("/jobs/" + encodeURIComponent(j.job_id), {}, 15000),
          useHost && !sid ? fetchT("/hosted", {}, 15000) : Promise.resolve(null),
        ]);
        const jr = await jrRes.json();
        if(!sid){
          if(useHost){
            const h = (await hsRes.json()).find(x => x.hosted_id === j.hosted_id);
            if(h && h.session_id){
              sid = h.session_id;
              enterSession();
            }else if(h && h.status === "exited"){
              sendJobs[key] = {jobId: j.job_id, status: "failed",
                               error: "claude 进程已退出: " + (h.stderr_tail || []).slice(-3).join(" | ")};
              updateSendSt(key);
              break;
            }
          }else if(jr.result_session_id){
            // 非托管模式下新会话 id 只在首轮跑完的结果里才有
            sid = jr.result_session_id;
            enterSession();
          }
        }
        sendJobs[sid || key] = {jobId: j.job_id, status: jr.status, result: jr.result, error: jr.error};
        updateSendSt(sid || key);
        if(jr.status === "running" || jr.status === "queued") continue;
        break;
      }
    }catch(e){
      sendJobs[sid || key] = {status: "failed", error: String(e)};
      updateSendSt(sid || key);
    }
  };
}

function bindSendBox(id, d){
  const btn = document.getElementById("sendbtn");
  if(!btn) return;
  bindComposerKeys();
  const un = document.getElementById("unhostbtn");
  if(un) un.onclick = async () => {
    if(!d.hosted_id) return;
    un.disabled = true;
    try{
      const r = await fetchT("/hosted/" + encodeURIComponent(d.hosted_id), {method: "DELETE"}, 20000);
      if(!r.ok){
        const j = await r.json().catch(() => ({}));
        document.getElementById("sendst").textContent = "退出托管失败: " + (j.error || r.status);
      }
      curPanel = null;   // 强制整体重渲染，更新托管标识
      load();   // 状态变为未托管
    }catch(e){
      document.getElementById("sendst").textContent = "退出托管错误: " + e;
      un.disabled = false;
    }
  };
  const intBtn = document.getElementById("intbtn");
  if(intBtn) intBtn.onclick = async () => {
    intBtn.disabled = true;
    try{
      const r = await fetchT("/sessions/" + encodeURIComponent(id) + "/interrupt",
        {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"});
      const j = await r.json();
      if(!r.ok) document.getElementById("sendst").textContent = "中断失败: " + (j.error || r.status);
    }catch(e){
      document.getElementById("sendst").textContent = "中断错误: " + e;
    }finally{
      intBtn.disabled = false;
      load();
    }
  };
  const approvalSel = document.getElementById("approvalsel");
  if(approvalSel) approvalSel.onchange = async () => {
    try{
      const r = await fetchT("/sessions/" + encodeURIComponent(id) + "/approval", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({approval: approvalSel.value}),
      });
      const j = await r.json();
      document.getElementById("sendst").textContent =
        r.ok ? "审批模式已更新" : ("失败: " + (j.error || r.status));
    }catch(e){
      document.getElementById("sendst").textContent = "审批模式保存失败: " + e;
    }
  };
  btn.onclick = async () => {
    const text = document.getElementById("msgbox").value.trim();
    if(!text) return;
    const force = document.getElementById("forcecb").checked;
    const selectedModel = modelSnapshot(id);
    if(selectedModel === undefined) return;
    // 已托管的会话 /sessions/<id>/message 会自动路由到常驻进程，无需再 POST /hosted
    const useHost = document.getElementById("hostcb").checked
      && !(d.hosted || sessions.find(s => s.id === id)?.hosted);
    sendJobs[id] = {status: "sending", requested_model: selectedModel};
    updateSendSt(id);
    try{
      const r = await fetchT(useHost ? "/hosted" : "/sessions/" + encodeURIComponent(id) + "/message", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(useHost ? {resume_id: id, text, force, model: selectedModel} : {text, force, model: selectedModel}),
      }, 30000);
      const j = await r.json();
      if(r.status !== 202){
        sendJobs[id] = {status: "failed", error: j.error || ("HTTP " + r.status)};
        updateSendSt(id); return;
      }
      const box = document.getElementById("msgbox");
      if(box) box.value = "";
      // 202 后立刻解除“发送中”锁定：托管会话可以继续排队，不必等整轮结束。
      sendJobs[id] = {jobId: j.job_id, status: j.status || "queued"};
      updateSendSt(id);
      // 本次刚启动托管时重建一次面板，让“托管中/退出托管”控件立即出现；
      // 已有托管或一次性消息只做软刷新，避免打断正在输入的下一条消息。
      if(useHost) curPanel = null;
      load();
      const deadline = Date.now() + SEND_POLL_TIMEOUT_MS;
      for(;;){
        if(Date.now() >= deadline){
          sendJobs[id] = {status: "failed", error: "等待任务状态超时，任务可能仍在执行"};
          updateSendSt(id);
          break;
        }
        await new Promise(f => setTimeout(f, 1500));
        const jr = await (await fetchT("/jobs/" + encodeURIComponent(j.job_id), {}, 15000)).json();
        // 多个消息排队时只更新自己的状态，避免旧任务的轮询覆盖新任务
        if(!sendJobs[id] || sendJobs[id].jobId === j.job_id)
          sendJobs[id] = {jobId: j.job_id, status: jr.status,
                          result: jr.result, error: jr.error};
        updateSendSt(id);
        if(jr.status === "running" || jr.status === "queued") continue;
        break;
      }
      load();   // 软刷新最终状态，不重建输入区
    }catch(e){
      sendJobs[id] = {status: "failed", error: String(e)};
      updateSendSt(id);
    }
  };
}

/* ---------- 导航与浏览器历史 ---------- */
function historyApi(){
  return typeof window !== "undefined" && window.history
    && typeof window.history.pushState === "function" ? window.history : null;
}
function readRoute(){
  const loc = typeof window !== "undefined" ? window.location : null;
  return loc ? parseRoute(loc.pathname) : null;
}
function syncUrl(v, replace){
  const h = historyApi(), loc = h ? window.location : null;
  if(!h || !loc) return;
  const next = routePath(v);
  if(next === loc.pathname) return;
  try{ (replace ? h.replaceState : h.pushState).call(h, null, "", next); }catch(e){ }
}
function clearSessionView(){
  disconnectSessionSse();
  clearLiveBubble();
  convCache = {id: null, size: -1};
  convState = {id: null, msgs: [], total: 0, cursor: 0, start: 0, size: -1,
               hasMore: false, loadingEarlier: false};
  interCache = {id: null, sig: ""};
}
function navigate(next, opts){
  next = next || {project: null, session: null, new: false};
  const leaving = view.session !== (next.session || null);
  view = next;
  if(leaving) clearSessionView();
  syncUrl(view, !!(opts && opts.replace));
  renderMain();
}
function onPopState(){
  // 地址栏已经变化，这里只恢复视图；用 replace 避免把旧格式地址再压入一条历史记录
  navigate(readRoute() || {project: null, session: null, new: false}, {replace: true});
}

/* ---------- 主渲染 ---------- */
function renderPendingBadge(){
  const total = sessions.reduce((sum, s) => sum + (s.pending_interactions || 0), 0);
  const el = document.getElementById("pendingbadge");
  if(!el) return;
  el.style.display = total ? "inline-block" : "none";
  el.textContent = "待审批 " + total;
}
function renderMain(){
  const projects = groupByProject();
  resolveViewProject(projects);
  renderSidebar(projects);
  document.getElementById("total").textContent = `(${sessions.length})`;
  renderPendingBadge();
  if(view.session){
    syncUrl(view, true);   // 旧格式编码地址自动规整成可读路径
    renderConversation(view.session, false);
    return;
  }
  if(!view.project || !projects.some(p => p.cwd === view.project))
    // 侧栏固定排序后，初次进入仍默认选中最近活跃的项目
    view.project = projects.length
      ? projects.reduce((a, b) => b.last > a.last ? b : a).cwd : null;
  if(view.project) syncUrl(view, true);   // 默认项目解析后用 replace 落地址，不新增历史记录
  renderSidebar(projects);   // 更新 active 高亮
  const p = projects.find(x => x.cwd === view.project);
  const main = document.getElementById("main");
  if(p){
    if(view.new){ renderNewSession(p); return; }
    renderSessionList(p);
  }
  else main.innerHTML = '<div class="empty">暂无会话</div>';
}

/* ---------- 数据 ---------- */
let loading = false;        // 上一轮 /sessions 还没回来就跳过本轮定时刷新，
                            // 否则大转录的慢请求会堆积、占满浏览器同源连接池，
                            // 后续请求（如发消息的 POST）永远排不上队
async function load(){
  if(loading) return;
  loading = true;
  lastListLoad = Date.now();
  try{
    const r = await fetch("/sessions");
    sessions = await r.json();
    document.getElementById("err").textContent = "";
    document.getElementById("updated").textContent = "更新于 " + new Date().toLocaleTimeString();
    renderMain();
  }catch(e){
    document.getElementById("err").textContent = "连接失败: " + e.message;
  }finally{
    loading = false;
  }
}

/* ---------- 交互 ---------- */
const asideEl = document.getElementById("projs"), maskEl = document.getElementById("mask");
function toggleDrawer(open){
  asideEl.classList.toggle("open", open);
  maskEl.classList.toggle("show", open);
}
document.getElementById("pendingbadge").onclick = () => {
  const target = sessions.find(s => s.pending_interactions > 0);
  if(!target) return;
  navigate({project: target.project, session: target.id, new: false});
};
document.getElementById("menu").onclick = () => toggleDrawer(!asideEl.classList.contains("open"));
maskEl.onclick = () => toggleDrawer(false);
document.getElementById("projs").addEventListener("click", e => {
  const nb = e.target.closest(".newbtn");
  if(nb){
    toggleDrawer(false);
    navigate({project: nb.dataset.cwd, session: null, new: true});
    return;
  }
  const item = e.target.closest(".pitem");
  if(!item) return;
  toggleDrawer(false);
  navigate({project: item.dataset.cwd, session: null, new: false});
});
document.getElementById("main").addEventListener("click", e => {
  const act = e.target.closest && e.target.closest("#interactions button[data-act]");
  if(act){
    const card = act.closest(".inter-card");
    respondInteraction(card, act.dataset.act, act.dataset.scope || "once",
                       act.dataset.reason);
    return;
  }
  if(e.target.closest("#newp")){
    navigate({project: view.project, session: null, new: true});
    return;
  }
  const card = e.target.closest(".scard");
  if(!card) return;
  navigate({project: view.project, session: card.dataset.id, new: false});
});

// toggle 不冒泡，用捕获阶段记录用户手动展开/折叠的 <details>
if(document.addEventListener){
  document.addEventListener("toggle", event => {
    const el = event.target;
    if(el && el.tagName === "DETAILS" && el.dataset && el.dataset.dkey){
      detailsOpen[el.dataset.dkey] = !!el.open;
      saveDetailsOpen();
    }
  }, true);
}

const auto = document.getElementById("auto"), ival = document.getElementById("ival");
auto.checked = localStorage.getItem("auto") !== "0";
ival.value = localStorage.getItem("ival") || String(DEFAULT_IVAL);
function resetTimer(){
  clearInterval(timer);
  // 定时轮询与 SSE 事件共用同一节流入口，避免两者同时到点导致重复请求
  if(auto.checked) timer = setInterval(scheduleListRefresh, listGap());
}
auto.onchange = () => { localStorage.setItem("auto", auto.checked ? "1" : "0"); resetTimer(); };
ival.onchange = () => { localStorage.setItem("ival", ival.value); resetTimer(); };

// 启动时先按地址栏恢复视图，再等首次 /sessions 数据渲染；
// 不在数据到达前 renderMain，避免空项目列表把 URL 里的项目覆盖掉
const bootRoute = readRoute();
if(bootRoute) view = bootRoute;
if(window.addEventListener) window.addEventListener("popstate", onPopState);
if(window.marked) marked.setOptions({breaks: true});
connectGlobalSse();
load();
resetTimer();
</script>
