      if(!moveSubmission(source, target, token)) return false;
      if(!modelDrafts[target]) modelDrafts[target] = {...modelDraft(source), value: selectedModel};
      if(!modelProfileOptions[target]) modelProfileOptions[target] = modelProfileOptions[source] || [];
      if(!pendingEcho[target]) pendingEcho[target] = echo;
      const follow = navigationRoute === routeGeneration && (sid ? view.session === sid
        : view.new && view.project === p.cwd);
      sid = target;
      if(follow){
        saveComposerDraft();
        const remaining = messageDrafts.get(source)?.text || "";
        // 只有确实自动导航时迁移；目标已有草稿优先，源草稿保留以免丢失。
        if(remaining && !messageDrafts.get(sid)?.text){
          saveMessageDraft(sid, remaining);
          const cleared = saveMessageDraft(source, "");
          const box = document.getElementById("msgbox");
          if(box?.dataset.draftKey === source){
            box.value = "";
            box.dataset.draftVersion = String(cleared.version);
          }
        }
        // 新建页是一次性入口，用 replace 换成会话地址，返回时直接回到项目列表
        navigate({project: p.cwd, session: sid, new: false}, {replace: true});
        navigationRoute = routeGeneration;
      }
      return true;
    };
    try{
      const r = await fetchT(useHost ? "/hosted" : "/new", {
        method: "POST", headers: {"Content-Type": "application/json"},
        // 非托管 /new 不接受 approval/effort；托管时把对话框里的选择带给首轮进程
        body: JSON.stringify(useHost
          ? {cwd: p.cwd, text, model: selectedModel, approval, effort}
          : {cwd: p.cwd, text, model: selectedModel}),
      }, 30000);
      const j = await r.json();
      if(!owns()) return;
      if(r.status !== 202){
        sendJobs[key] = {token, text, status: "failed", error: j.error || ("HTTP " + r.status)};
        updateSendSt(key); return;
      }
      accepted = true;
      sendJobs[key] = {token, text, jobId: j.job_id, status: j.status || "queued"};
      echo.jobId = j.job_id;
      clearSubmittedDraft(submitted);
      const deadline = Date.now() + SEND_POLL_TIMEOUT_MS;
      for(;;){
        if(!owns()) break;
        if(Date.now() >= deadline){
          sendJobs[sid || key] = {...sendJobs[sid || key], status: "unknown", error: "状态查询超时，任务可能仍在执行"};
          // 查询超时不代表服务端任务失败。
          updateSendSt(sid || key);
          break;
        }
        await new Promise(f => setTimeout(f, 1500));
        // 并行跟踪：任务状态 + 托管进程的 init 事件（后者几秒内就带上新 session id，不用等首轮跑完）
        const [jrRes, hsRes] = await Promise.all([
          fetchT("/jobs/" + encodeURIComponent(j.job_id), {}, 15000),
          useHost && !sid ? fetchT("/hosted", {}, 15000) : Promise.resolve(null),
        ]);
        const jr = await jrRes.json();
        if(!owns()) break;
        if(!jrRes.ok || jr.error && !jr.status) throw Error(jr.error || "HTTP " + jrRes.status);
        const authoritativeSid = jr.session && jr.session !== j.hosted_id ? jr.session : jr.result_session_id;
        if(authoritativeSid && authoritativeSid !== sid){
          if(!enterSession(authoritativeSid)) break;
        }
        if(!sid){
          if(useHost){
            if(!hsRes.ok) throw Error("HTTP " + hsRes.status);
            const h = (await hsRes.json()).find(x => x.hosted_id === j.hosted_id);
            if(!owns()) break;
            if(h && h.session_id){
              if(!enterSession(h.session_id)) break;
            }else if(h && h.status === "exited"){
              sendJobs[key] = {token, text, jobId: j.job_id, status: "failed",
                               error: "claude 进程已退出: " + (h.stderr_tail || []).slice(-3).join(" | ")};
              updateSendSt(key);
              break;
            }
          }else if(jr.result_session_id){
            // 非托管模式下新会话 id 只在首轮跑完的结果里才有
            if(!enterSession(jr.result_session_id)) break;
          }
        }
        if(!owns()) break;
        reconcileJob(sid || key, {...jr, id: j.job_id}, token);
        if(jr.status === "running" || jr.status === "queued") continue;
        break;
      }
    }catch(e){
      if(!owns()) return;
      sendJobs[sid || key] = {...sendJobs[sid || key], status: accepted ? "unknown" : "failed",
        error: accepted ? "状态查询失败，任务可能仍在执行：" + e.message : String(e)};
      // 查询失败保留回显，不宣称服务端执行失败。
      updateSendSt(sid || key);
    }
  };
}

function bindSendBox(id, d){
  const btn = document.getElementById("sendbtn");
  if(!btn) return;
  bindMessageDraft(id);
  bindComposerKeys();
  wireCommandHints(document.getElementById("msgbox"),
    () => (view.session === id ? sessionCommands : []));
  const un = document.getElementById("unhostbtn");
  if(un) un.onclick = async () => {
    if(!d.hosted_id) return;
    un.disabled = true;
    try{
      const r = await fetchT("/hosted/" + encodeURIComponent(d.hosted_id), {method: "DELETE"}, 20000);
      if(!r.ok){
        const j = await r.json().catch(() => ({}));
        document.getElementById("sendst").textContent = "退出托管失败: " + (j.error || r.status);
      }
      curPanel = null;   // 强制整体重渲染，更新托管标识
      load();   // 状态变为未托管
    }catch(e){
      document.getElementById("sendst").textContent = "退出托管错误: " + e;
      un.disabled = false;
    }
  };
  const intBtn = document.getElementById("intbtn");
  if(intBtn) intBtn.onclick = async () => {
    intBtn.disabled = true;
    try{
      const r = await fetchT("/sessions/" + encodeURIComponent(id) + "/interrupt",
        {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"});
      const j = await r.json();
      if(!r.ok) document.getElementById("sendst").textContent = "中断失败: " + (j.error || r.status);
    }catch(e){
      document.getElementById("sendst").textContent = "中断错误: " + e;
    }finally{
      intBtn.disabled = false;
      load();
    }
  };
  const approvalSel = document.getElementById("approvalsel");
  if(approvalSel) approvalSel.onchange = async () => {
    try{
      const r = await fetchT("/sessions/" + encodeURIComponent(id) + "/approval", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({approval: approvalSel.value}),
      });
      const j = await r.json();
      document.getElementById("sendst").textContent =
        r.ok ? "审批模式已更新" : ("失败: " + (j.error || r.status));
    }catch(e){
      document.getElementById("sendst").textContent = "审批模式保存失败: " + e;
    }
  };
  const effortSel = document.getElementById("effortsel");
  if(effortSel) effortSel.onchange = async () => {
    try{
      const r = await fetchT("/sessions/" + encodeURIComponent(id) + "/effort", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({effort: effortSel.value}),
      });
      const j = await r.json();
      document.getElementById("sendst").textContent =
        r.ok ? (j.warning ? ("思考档位已保存（" + j.warning + "）") : "思考档位已更新")
             : ("思考档位失败: " + (j.error || r.status));
    }catch(e){
      document.getElementById("sendst").textContent = "思考档位保存失败: " + e;
    }
  };
  btn.onclick = async () => {
    const submitted = captureMessageDraft(id), text = submitted.rawText.trim();
    if(!text) return;
    const force = document.getElementById("forcecb").checked;
    const selectedModel = modelSnapshot(id);
    if(selectedModel === undefined) return;
    // 已托管的会话 /sessions/<id>/message 会自动路由到常驻进程，无需再 POST /hosted
    const useHost = document.getElementById("hostcb").checked
      && !(d.hosted || sessions.find(s => s.id === id)?.hosted);
    const token = ++submissionToken;
    const echo = submissionEcho(id, text, token, null);
    sendJobs[id] = {token, status: "sending", requested_model: selectedModel, text};
    let accepted = false;
    updateSendSt(id);
    try{
      const r = await fetchT(useHost ? "/hosted" : "/sessions/" + encodeURIComponent(id) + "/message", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(useHost ? {resume_id: id, text, force, model: selectedModel} : {text, force, model: selectedModel}),
      }, 30000);
      const j = await r.json();
      if(!ownsSubmission(id, token)) return;
      if(r.status !== 202){
        sendJobs[id] = {token, text, status: "failed", error: j.error || ("HTTP " + r.status)};
        updateSendSt(id); return;
      }
      accepted = true;
      clearSubmittedDraft(submitted);
      sendJobs[id] = {token, jobId: j.job_id, status: j.status || "queued", text};
      pendingEcho[id] = {...echo, jobId: j.job_id};
      renderConvList();
      updateSendSt(id);
      // 本次刚启动托管时重建一次面板，让“托管中/退出托管”控件立即出现；
      // 已有托管或一次性消息只做软刷新，避免打断正在输入的下一条消息。
      if(useHost && composerRouteMatch(id) && panelMatch(id)) curPanel = null;
      load();
      const deadline = Date.now() + SEND_POLL_TIMEOUT_MS;
      for(;;){
        if(!ownsSubmission(id, token)) break;
        if(Date.now() >= deadline){
          sendJobs[id] = {...sendJobs[id], status: "unknown", error: "状态查询超时，任务可能仍在执行"};
          updateSendSt(id); break;
        }
        await new Promise(f => setTimeout(f, 1500));
        const poll = await fetchT("/jobs/" + encodeURIComponent(j.job_id), {}, 15000);
        const jr = await poll.json();
        if(!ownsSubmission(id, token)) break;
        if(!poll.ok || jr.error && !jr.status) throw Error(jr.error || "HTTP " + poll.status);
        reconcileJob(id, {...jr, id: j.job_id}, token);
        if(jr.status === "running" || jr.status === "queued") continue;
        break;
      }
      load();   // 软刷新最终状态，不重建输入区
    }catch(e){
      if(!ownsSubmission(id, token)) return;
      sendJobs[id] = {...sendJobs[id], status: accepted ? "unknown" : "failed",
        error: accepted ? "状态查询失败，任务可能仍在执行：" + e.message : String(e)};
      updateSendSt(id);
    }
  };
}

/* ---------- 导航与浏览器历史 ---------- */
function historyApi(){
  return typeof window !== "undefined" && window.history
    && typeof window.history.pushState === "function" ? window.history : null;
}
function readRoute(){
  const loc = typeof window !== "undefined" ? window.location : null;
  return loc ? parseRoute(loc.pathname) : null;
}
function syncUrl(v, replace){
  const h = historyApi(), loc = h ? window.location : null;
  if(!h || !loc) return;
  const next = routePath(v);
  if(next === loc.pathname) return;
  try{ (replace ? h.replaceState : h.pushState).call(h, null, "", next); }catch(e){ }
}
function clearSessionView(){
  displayedSession = null;
  for(const [, state] of queueStates) state.pop = null;   // 离开会话时收起队列详情浮层
  hideQueuePop();
  disconnectSessionSse();
  clearLiveBubble();
  convCache = {id: null, size: -1};
  convState = {id: null, msgs: [], total: 0, cursor: 0, start: 0, size: -1,
               hasMore: false, loadingEarlier: false};
}
function navigate(next, opts){
  saveComposerDraft();   // 此时路由尚未改变；以旧输入框所属 key 保存，不能依赖 curPanel。
  next = next || {project: null, session: null, new: false};
  const leaving = view.session !== (next.session || null);
  view = next;
  routeGeneration++;
  if(leaving) clearSessionView();
  syncUrl(view, !!(opts && opts.replace));
  renderMain();
}
function onPopState(){
  // 地址栏已经变化，这里只恢复视图；用 replace 避免把旧格式地址再压入一条历史记录
  navigate(readRoute() || {project: null, session: null, new: false}, {replace: true});
}

  el.style.display = "inline-block";

}
function renderHostedBadge(){
  const total = sessions.filter(s => s.hosted).length;
  const el = document.getElementById("hostedbadge");
  if(!el) return;
  el.style.display = total ? "inline-block" : "none";

function renderMain(){
  // 会话视图的聊天窗口布局类：显式切换，替代 main:has(>#conv)（旧引擎也可靠生效）
  const mainEl = document.getElementById("main");
  if(mainEl && mainEl.classList && mainEl.classList.toggle)
    mainEl.classList.toggle("convview", !!(view.session && !view.pending && !view.hosted));

  resolveViewProject(projects);
  renderSidebar(projects);
  document.getElementById("total").textContent = `(${sessions.length})`;
  renderPendingBadge();
  renderHostedBadge();
  if(view.pending){ renderPendingList(); return; }
  if(view.hosted){ renderHostedList(); return; }
  if(view.session){
    syncUrl(view, true);   // 旧格式编码地址自动规整成可读路径
    renderConversation(view.session, false);
    return;
  }
  if(!view.project || !projects.some(p => p.cwd === view.project))
    // 侧栏固定排序后，初次进入仍默认选中最近活跃的项目
    view.project = projects.length
      ? projects.reduce((a, b) => b.last > a.last ? b : a).cwd : null;
  if(view.project) syncUrl(view, true);   // 默认项目解析后用 replace 落地址，不新增历史记录
  renderSidebar(projects);   // 更新 active 高亮
  const p = projects.find(x => x.cwd === view.project);
  const main = document.getElementById("main");
  if(p){
    if(view.new){ renderNewSession(p); return; }
    renderSessionList(p);
  }
  else main.innerHTML = '<div class="empty">暂无会话</div>';
}

/* ---------- 数据 ---------- */
let loading = false;        // 上一轮 /sessions 还没回来就跳过本轮定时刷新，
                            // 否则大转录的慢请求会堆积、占满浏览器同源连接池，
                            // 后续请求（如发消息的 POST）永远排不上队
async function load(){
  if(loading) return;
  loading = true;
  lastListLoad = Date.now();
  const version = sessionsVersion;
  try{
    const r = await fetchT("/sessions");
    const next = await r.json();
    if(version !== sessionsVersion) return;   // 请求期间已有 SSE 快照，旧 HTTP 列表不能覆盖它。
    if(!r.ok) throw Error("HTTP " + r.status);
    applySessions(next);
    document.getElementById("err").textContent = "";
    document.getElementById("updated").textContent = "更新于 " + new Date().toLocaleTimeString();
  }catch(e){
    document.getElementById("err").textContent = "连接失败: " + e.message;
  }finally{
    loading = false;
  }
}

  const chip = e.target.closest && e.target.closest(".queue-chip");

});

// 队列详情浮层：悬停/聚焦临时浏览（peek），点击固定（pinned），外点或 Esc 收起
(function(){
  const main = document.getElementById("main");
  const chipFrom = t => t && t.closest && t.closest(".queue-chip");
  main.addEventListener("mouseover", e => {
    if(chipFrom(e.target) && view.session && !queueState(view.session).pop)
      showQueuePop(view.session, "peek");
  });
  main.addEventListener("mouseout", e => {
    if(!view.session || queueState(view.session).pop !== "peek") return;
    if(chipFrom(e.target) && !chipFrom(e.relatedTarget)) closeQueuePop(view.session);
  });
  main.addEventListener("focusin", e => {
    if(chipFrom(e.target) && view.session && !queueState(view.session).pop)
      showQueuePop(view.session, "peek");
  });
  main.addEventListener("focusout", e => {
    if(view.session && queueState(view.session).pop === "peek" && chipFrom(e.target))
      closeQueuePop(view.session);
  });
  const pop = document.getElementById("queuepop");
  pop.addEventListener("click", e => {
    const cancel = e.target.closest && e.target.closest("[data-cancel-job]");
    if(cancel){ e.preventDefault?.(); cancelQueueJob(cancel.dataset.sid, cancel.dataset.cancelJob); }
  });
  document.addEventListener("click", e => {
    if(!view.session || !queueState(view.session).pop) return;
    const live = document.getElementById("queuepop");
    if(live && e.target && live.contains && live.contains(e.target)) return;
    if(chipFrom(e.target)) return;
    closeQueuePop(view.session);
  });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape" && view.session && queueState(view.session).pop) closeQueuePop(view.session);
  });
  const reposition = () => { if(view.session && queueState(view.session).pop) positionQueuePop(); };
  document.addEventListener("scroll", reposition, true);
  if(typeof window !== "undefined" && window.addEventListener) window.addEventListener("resize", reposition);
})();

/* ---------- 系统面板：header 右侧按钮 + body 顶层浮层（模式同 #queuepop） ---------- */
const sysPop = {timer: null, loading: false, note: ""};
let sysData = null;
function fmtGB(n){ return ((n || 0) / 2 ** 30).toFixed(1) + " GB"; }
function fmtUptime(sec){
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  return d ? `${d} 天 ${h} 小时` : h ? `${h} 小时 ${m} 分` : `${m} 分钟`;
}
function barClass(p){ return p >= 85 ? "hot" : p >= 60 ? "warn" : ""; }
function fmtRemain(sec){
  const m = Math.floor(sec / 60), s = sec % 60;
  return m >= 60 ? `${Math.floor(m / 60)} 时 ${m % 60} 分` : m ? `${m} 分 ${s} 秒` : `${s} 秒`;
}
// 定时睡眠行：未设定显示预设+设定按钮，已设定显示剩余时间+取消（随 3 秒轮询切换）
function systimerHtml(data){
  const rem = data && data.sleep_timer_remaining;
  if(rem != null)
    return `<div class="systimer"><span>⏱ ${fmtRemain(rem)}后睡眠</span>
      <button class="ibtn secondary" data-sleep-cancel>取消定时</button></div>`;
  return `<div class="systimer"><select id="sleeptimermin" aria-label="定时睡眠分钟数">
    ${[15, 30, 60, 120].map(m => `<option value="${m}">${m} 分钟</option>`).join("")}
    </select><button class="ibtn secondary" data-sleep-set>定时睡眠</button></div>`;
}
function sysPopHtml(data){
  if(!data) return '<div class="mut">加载中…</div>';
  // 错误分支也保留操作提示与定时行：已设定的定时仍在跑，错误态下必须还能看到剩余时间并取消
  if(data.error) return `${sysPop.note ? `<div role="status" style="margin-top:6px">${esc(sysPop.note)}</div>` : ""}
    <div class="terror">${esc(data.error)}</div>
    ${systimerHtml(data)}`;
  const cpu = data.cpu_percent || 0;
  const cores = (data.cpu_cores || []).map((p, i) =>
    `<div class="core"><span>核${i + 1} ${Math.round(p)}%</span><div class="sysbar ${barClass(p)}"><i style="width:${Math.min(100, p)}%"></i></div></div>`).join("");
  const mem = data.mem_percent || 0;
  return `<div class="sysrow"><span>CPU</span><b style="color:var(--fg);font-size:16px">${cpu.toFixed(1)}%</b></div>
    <div class="sysbar ${barClass(cpu)}"><i style="width:${Math.min(100, cpu)}%"></i></div>
    ${cores ? `<div class="syscores">${cores}</div>` : ""}
    <div class="sysrow"><span>内存</span><span>${fmtGB(data.mem_used)} / ${fmtGB(data.mem_total)}（${Math.round(mem)}%）</span></div>
    <div class="sysbar ${barClass(mem)}"><i style="width:${Math.min(100, mem)}%"></i></div>
    ${data.swap_total ? `<div class="sysrow"><span>交换</span><span>${fmtGB(data.swap_used)} / ${fmtGB(data.swap_total)}（${Math.round(data.swap_percent || 0)}%）</span></div>
    <div class="sysbar"><i style="width:${Math.min(100, data.swap_percent || 0)}%"></i></div>` : ""}
    <div class="sysrow" style="margin-top:10px"><span>已运行 ${fmtUptime(data.uptime || 0)} · ${esc(data.hostname || "")}</span></div>
    ${sysPop.note ? `<div role="status" style="margin-top:6px">${esc(sysPop.note)}</div>` : ""}
    ${systimerHtml(data)}
    <div class="sysacts"><button class="ibtn danger" data-power="restart">重启</button>
      <button class="ibtn danger" data-power="sleep">睡眠</button></div>`;
}
function positionSysPop(){
  const pop = document.getElementById("syspop"), btn = document.getElementById("sysbtn");
  if(!pop || pop.hidden || !btn) return;
  const rect = btn.getBoundingClientRect && btn.getBoundingClientRect();
  const root = document.documentElement;
  const vw = root ? root.clientWidth : 0, vh = root ? root.clientHeight : 0;
  if(!rect || !vw || !vh) return;   // 无布局环境（单测假 DOM）时只展示不定位
  const w = pop.offsetWidth || 0, h = pop.offsetHeight || 0;
  let left = Math.min(Math.max(8, rect.right - w), vw - w - 8);
  let top = rect.bottom + 6;   // 优先浮在按钮下方，放不下再向上
  if(top + h > vh - 8) top = Math.max(8, rect.top - h - 6);
  pop.style.left = Math.round(left) + "px";
  pop.style.top = Math.round(top) + "px";
}
function renderSysPop(){
  const pop = document.getElementById("syspop");
  if(!pop || !sysPop.timer) return;
  // 3 秒轮询会整体重写 innerHTML，先记住用户选的预设时长再恢复，避免下拉被重置
  const prev = document.getElementById("sleeptimermin"), prevVal = prev ? prev.value : null;
  pop.innerHTML = sysPopHtml(sysData);
  if(prevVal){
    const sel = document.getElementById("sleeptimermin");
    if(sel) sel.value = prevVal;
  }
  pop.hidden = false;
  positionSysPop();
}
async function loadSystem(){
  if(sysPop.loading || !sysPop.timer) return;   // 上一请求未结束不叠加
  sysPop.loading = true;
  const prevRem = sysData ? sysData.sleep_timer_remaining : undefined;   // 失败时保留最后已知的定时状态
  try{
    const r = await fetchT("/system");
    let j = null;
    try{ j = await r.json(); }catch(e){}
    sysData = r.ok ? (j || {error: "响应格式异常"})
      : {error: (j && j.error) || `HTTP ${r.status}`,
         sleep_timer_remaining: j && j.sleep_timer_remaining != null ? j.sleep_timer_remaining : prevRem};
  }catch(e){ sysData = {error: "查询失败：" + (e && e.message || e), sleep_timer_remaining: prevRem}; }
  sysPop.loading = false;
  renderSysPop();
}
function toggleSysPop(open){
  const pop = document.getElementById("syspop");
  if(!pop || open === (sysPop.timer != null)) return;
  if(open){
    sysData = null; sysPop.note = "";
    sysPop.timer = setInterval(loadSystem, 3000);   // 展开期间 3 秒自动刷新
    // setInterval 不会立即触发；先设 timer（renderSysPop/loadSystem 以它为展开标志）再手动首渲并发请求
    renderSysPop();
    loadSystem();
  }else{
    clearInterval(sysPop.timer); sysPop.timer = null;
    pop.hidden = true; pop.innerHTML = "";
  }
}
async function sendPower(action){
  const text = action === "restart"
    ? "确定要重启这台电脑？正在执行的会话任务会被中断。"
    : "确定要使这台电脑进入睡眠？";
  if(!window.confirm(text)) return;
  try{
    const r = await fetchT("/system/power", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({action})});
    let j = null;
    try{ j = await r.json(); }catch(e){}
    sysPop.note = r.ok && j && j.ok
      ? (action === "restart" ? "已发送重启指令，服务即将中断…" : "已发送睡眠指令…")
      : (j && j.error) || "执行失败";
  }catch(e){ sysPop.note = "执行失败：" + (e && e.message || e); }
  renderSysPop();
}
async function setSleepTimer(minutes){
  // 定时可随时取消，不需要 confirm；成功后先把 remaining 写回本地数据，行立即切换、下轮轮询校正
  try{
    const r = await fetchT("/system/sleep-timer", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({minutes})});
    let j = null;
    try{ j = await r.json(); }catch(e){}
    if(r.ok && j && j.ok){
      sysPop.note = minutes ? `已设定定时睡眠（约 ${minutes} 分钟后）` : "已取消定时睡眠";
      if(sysData) sysData.sleep_timer_remaining = j.remaining;   // 错误态也要切行，取消入口常在
    }else{
      sysPop.note = (j && j.error) || "执行失败";
    }
  }catch(e){ sysPop.note = "执行失败：" + (e && e.message || e); }
  renderSysPop();
}
// 不 stopPropagation：syspop 自己的 document 级关闭 handler 已豁免 #sysbtn，
// 放行冒泡可让队列浮层等其他 document 级浮层借这次点击正常收起
document.getElementById("sysbtn").addEventListener("click", e => {
  toggleSysPop(sysPop.timer == null);
});
document.getElementById("syspop").addEventListener("click", e => {
  const btn = e.target.closest && e.target.closest("[data-power]");
  if(btn){ e.preventDefault(); sendPower(btn.dataset.power); return; }
  const set = e.target.closest && e.target.closest("[data-sleep-set]");
  if(set){
    const sel = document.getElementById("sleeptimermin");
    setSleepTimer(parseInt(sel && sel.value, 10) || 15);
    return;
  }
  const cancel = e.target.closest && e.target.closest("[data-sleep-cancel]");
  if(cancel) setSleepTimer(0);
});
document.addEventListener("click", e => {
  if(!sysPop.timer) return;
  const pop = document.getElementById("syspop");
  if(pop && pop.contains && pop.contains(e.target)) return;
  if(e.target.closest && e.target.closest("#sysbtn")) return;
  toggleSysPop(false);
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && sysPop.timer) toggleSysPop(false); });
document.addEventListener("scroll", () => { if(sysPop.timer) positionSysPop(); }, true);
if(typeof window !== "undefined" && window.addEventListener)
  window.addEventListener("resize", () => { if(sysPop.timer) positionSysPop(); });

// toggle 不冒泡，用捕获阶段记录用户手动展开/折叠的 <details>
if(document.addEventListener){
  document.addEventListener("visibilitychange", () => {
    if(document.hidden) return;
    markDisplayedRead();
    if(view.session && unreadSessions.has(view.session)) scheduleConvRefresh(view.session);
  });
  document.addEventListener("toggle", event => {
    const el = event.target;
    if(el && el.tagName === "DETAILS" && el.dataset && el.dataset.dkey){
      detailsOpen[el.dataset.dkey] = !!el.open;
      saveDetailsOpen();
    }
  }, true);
}

const auto = document.getElementById("auto"), ival = document.getElementById("ival");
auto.checked = localStorage.getItem("auto") !== "0";
ival.value = localStorage.getItem("ival") || String(DEFAULT_IVAL);
function resetTimer(){
  clearInterval(timer);
  // 定时轮询与 SSE 事件共用同一节流入口，避免两者同时到点导致重复请求
  if(auto.checked) timer = setInterval(scheduleListRefresh, listGap());
}
auto.onchange = () => { localStorage.setItem("auto", auto.checked ? "1" : "0"); resetTimer(); };
ival.onchange = () => { localStorage.setItem("ival", ival.value); resetTimer(); };

// 启动时先按地址栏恢复视图，再等首次 /sessions 数据渲染；
// 不在数据到达前 renderMain，避免空项目列表把 URL 里的项目覆盖掉
const bootRoute = readRoute();
if(bootRoute) view = bootRoute;
if(window.addEventListener) window.addEventListener("popstate", onPopState);
if(window.marked) marked.setOptions({breaks: true});
connectGlobalSse();
load();
resetTimer();
</script>
