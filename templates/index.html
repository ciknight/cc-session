<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Sessions 监控</title>
<script src="/static/marked.min.js"></script>
<script src="/static/purify.min.js"></script>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f6f6f4;--card2:#efefec;--mut:#777;--bd:#e2e2de;--acc:#2563eb;--accbg:#dbeafe}
@media(prefers-color-scheme:dark){:root{--bg:#1b1b1a;--fg:#eee;--card:#262625;--card2:#2e2d2c;--mut:#999;--bd:#3a3a38;--acc:#60a5fa;--accbg:#1e3a5f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.55 system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--bd);flex:none}
h1{font-size:16px;margin:0}
.ctl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
select{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:2px 6px}
/* 开关 */
.sw{position:relative;display:inline-block;width:36px;height:20px}
.sw input{display:none}
.sw i{position:absolute;inset:0;background:var(--bd);border-radius:20px;transition:.2s;cursor:pointer}
.sw i:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i:before{transform:translateX(16px)}
/* 布局 */
#app{flex:1;display:grid;grid-template-columns:280px 1fr;min-height:0}
aside{border-right:1px solid var(--bd);overflow-y:auto;padding:8px}
main{overflow-y:auto;padding:12px 18px;min-width:0}
/* 项目列表 */
.pitem{padding:8px 10px;border-radius:8px;cursor:pointer;margin:2px 0;border:1px solid transparent;position:relative}
.pitem:hover{background:var(--card)}
.pitem.active{background:var(--card);border-color:var(--bd)}
.newbtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;
        border:1px solid var(--bd);border-radius:6px;color:var(--mut);cursor:pointer;
        font-size:13px;line-height:1;padding:4px 8px}
.newbtn:hover{border-color:var(--acc);color:var(--fg)}
.pname{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{font-size:12px;color:var(--mut)}
/* 会话卡片与稳定的项目内工具栏 */
.list-toolbar{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:12px 0}
.list-toolbar label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.list-search{flex:1 1 220px;min-width:0}
.list-toolbar input{width:100%;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:4px 8px;font:inherit}
.list-toolbar select{font:inherit;padding:4px 6px}
.list-toolbar input:focus-visible,.list-toolbar select:focus-visible,.list-toolbar button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.scard{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin:8px 0;cursor:pointer}
.scard:hover{border-color:var(--acc)}
.stitle{font-weight:600;margin:2px 0}
.b{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:#fff;white-space:nowrap}
.working{background:#d97706}.idle{background:#16a34a}.stale{background:#888}
.chip{display:inline-block;padding:0 7px;border:1px solid var(--bd);border-radius:10px;font-size:12px;color:var(--mut);margin:1px 2px;background:var(--card)}
.mut{color:var(--mut);font-size:12px}
.grid{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0;font-size:12px;color:var(--mut)}
.grid b{color:var(--fg);font-weight:600}
ul{margin:6px 0;padding-left:18px}
.completed{text-decoration:line-through;color:var(--mut)}
.in_progress{font-weight:600}
h4,h5{margin:10px 0 2px;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.fold{margin:8px 0 2px}
.fold>summary{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;list-style:none;user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary:before{content:"▸ "}
.fold[open]>summary:before{content:"▾ "}
.fold ul{max-height:300px;overflow-y:auto}
.empty{color:var(--mut);padding:40px;text-align:center}
#err{color:#dc2626;font-size:12px}
.back{background:none;border:1px solid var(--bd);border-radius:6px;color:var(--fg);padding:3px 12px;cursor:pointer;font-size:13px}
.back:hover{border-color:var(--acc)}
/* 对话 */
.msg{margin:10px 0}
.mhead{font-size:11px;color:var(--mut);margin-bottom:2px}
.ubody{background:var(--accbg);border-radius:10px;padding:8px 12px;white-space:pre-wrap;word-break:break-word;max-width:85%}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .mhead{text-align:right}
.msg.user.pending{opacity:.55}
.msg.user.pending.failed{opacity:1}
.msg.user.pending.failed .mhead{color:#ef4444}
.abody{max-width:100%;word-break:break-word}
.abody pre{background:var(--card2);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;overflow-x:auto;font-size:12.5px}
.abody code{font-family:ui-monospace,monospace;font-size:12.5px;background:var(--card2);padding:0 3px;border-radius:4px}
.abody pre code{background:none;padding:0}
.abody p{margin:4px 0}
.abody h1,.abody h2,.abody h3{font-size:15px;margin:8px 0 4px}
.abody table{border-collapse:collapse}.abody td,.abody th{border:1px solid var(--bd);padding:2px 8px;font-size:13px}
.tool{font:12px ui-monospace,monospace;color:var(--mut);background:var(--card2);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;margin:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.terror{font-size:12px;color:#dc2626;background:rgba(220,38,38,.08);border-radius:6px;padding:2px 8px;margin:3px 0}
.apierr{font-size:12px;color:#b45309;background:rgba(217,119,6,.10);border:1px solid rgba(217,119,6,.4);
  border-radius:6px;padding:6px 10px;margin:8px 0;white-space:pre-wrap}
.tool-details{margin:3px 0;font-size:12px}
.tool-details>summary{cursor:pointer;color:var(--mut);font-family:ui-monospace,monospace;
  background:var(--card2);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-out{margin:4px 0;max-height:320px;overflow:auto;background:var(--card2);
  border:1px solid var(--bd);border-radius:6px;padding:6px 8px;white-space:pre-wrap;
  font:12px ui-monospace,monospace}
.diff-add{color:#16a34a}.diff-del{color:#dc2626}.diff-hunk{color:var(--acc)}
.cmd{background:var(--card2);border:1px solid var(--bd);border-radius:6px;padding:4px 10px;font-size:12.5px;display:inline-block;margin:2px 0}
/* 待审批卡片：权限 / 计划 / 问答共用 */
.inter-card{background:var(--card);border:1px solid var(--bd);border-left:3px solid #d97706;
  border-radius:8px;padding:10px 14px;margin:10px 0}
.inter-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.inter-kind{font-size:11px;font-weight:600;letter-spacing:.04em;color:#b45309;
  background:rgba(217,119,6,.12);border-radius:4px;padding:1px 7px}
.inter-tool{font:12px ui-monospace,monospace;color:var(--mut)}
.inter-reason{font-size:12.5px;color:var(--mut);white-space:pre-wrap;margin-bottom:6px}
.inter-card pre,.inter-preview{margin:4px 0;max-height:240px;overflow:auto;background:var(--card2);
  border:1px solid var(--bd);border-radius:6px;padding:6px 8px;white-space:pre-wrap;
  font:12px ui-monospace,monospace}
.inter-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:10px}
.ibtn{font:inherit;font-size:13px;padding:4px 14px;border-radius:6px;cursor:pointer;
  border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.ibtn:hover{border-color:var(--acc)}
.ibtn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.ibtn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.ibtn.primary:hover{filter:brightness(1.08)}
.ibtn.secondary{background:none;border-color:var(--acc);color:var(--acc)}
.ibtn.danger{background:none;border-color:#dc2626;color:#dc2626}
.ibtn.danger:hover{background:rgba(220,38,38,.08)}
/* 问答：选项整行可选，选中高亮 */
.choice-q+.choice-q{margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
.choice-head{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.choice-text{margin-bottom:6px}
.choice-opt{position:relative;display:flex;flex-direction:column;gap:2px;width:100%;
  margin:4px 0;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;
  background:var(--bg);cursor:pointer}
.choice-opt:hover{border-color:var(--acc)}
.choice-opt:has(input:checked){border-color:var(--acc);background:var(--accbg)}
.choice-opt:focus-within{outline:2px solid var(--acc);outline-offset:1px}
.choice-opt input{position:absolute;opacity:0;pointer-events:none}
.opt-desc{font-size:12px;color:var(--mut)}
.opt-preview{display:block;margin-top:2px;white-space:pre-wrap;overflow:auto;max-height:180px;
  font:11px ui-monospace,monospace;color:var(--mut);background:var(--card2);
  border:1px solid var(--bd);border-radius:4px;padding:4px 6px}
.choice-free{width:100%;margin-top:6px;background:var(--bg);color:var(--fg);
  border:1px solid var(--bd);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px}
.choice-free:focus{outline:none;border-color:var(--acc)}
#pendingbadge,.chip.pending{border-color:rgba(217,119,6,.5);background:rgba(217,119,6,.10);
  color:#b45309;font-weight:600}
#hostedbadge{border-color:rgba(22,163,74,.45);background:rgba(22,163,74,.10);
  color:#15803d;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.run{background:#f59e0b;animation:dotpulse 1.2s ease-in-out infinite}
.dot.done{background:#9ca3af}
.dot.stale{background:transparent;border:2px solid #9ca3af;width:6px;height:6px}
.dot.err{background:#ef4444}
@keyframes dotpulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(prefers-color-scheme:dark){
  .inter-card{border-left-color:#f59e0b}
  .inter-kind{color:#fbbf24;background:rgba(217,119,6,.18)}
  #pendingbadge,.chip.pending{color:#fbbf24}
  #hostedbadge{color:#86efac}
}
.sysbody{font-size:12.5px;color:var(--mut);white-space:pre-wrap;word-break:break-word;
         border:1px dashed var(--bd);border-radius:6px;padding:4px 8px;max-width:100%}
.msg.tool,.msg.system{display:flex;flex-direction:column;align-items:flex-start}
.info-panel{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;margin:10px 0}
.model-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.model-controls input{min-width:180px;max-width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:3px 8px;font:inherit;font-size:12px}
.model-controls input[hidden]{display:none}
.composer{position:relative}
.composer textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;resize:vertical;font:inherit}
/* 次要控件：桌面原样展开；窄屏藏进 ⚙ 浮层（DOM 不动、事件不重挂） */
.composer-extra{display:contents}
.composer-cog{display:none}
#cmdhints{margin-top:4px;max-height:180px;overflow:auto;border:1px solid var(--bd);
  border-radius:6px;background:var(--bg);display:flex;flex-direction:column}
#cmdhints[hidden]{display:none}
.cmd-hint{text-align:left;background:none;border:none;color:var(--fg);padding:6px 10px;
  font:inherit;font-size:13px;cursor:pointer}
.cmd-hint.selected{background:var(--accbg)}
.composer-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.composer-status{white-space:pre-wrap;margin-top:4px}
.config-path{overflow-wrap:anywhere;font-family:ui-monospace,monospace;font-size:12px;margin:3px 0}
button:disabled,select:disabled{opacity:.5;cursor:not-allowed}
.metadata-actions{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:8px}
#pendingnav{margin:10px;width:calc(100% - 20px);text-align:left}
.queue-job{padding:8px 0;border-top:1px solid var(--bd)}
.queue-text{white-space:pre-wrap;overflow-wrap:anywhere;max-height:8em;overflow:auto}
#queuepop h5{margin:8px 0 0;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
/* 会话视图：聊天窗口布局——头部固定、消息区滚动、发送区沉底。
   convview 由 renderMain 在进入/离开会话视图时显式切换，不依赖 :has()（旧引擎也能布局） */
main.convview{display:flex;flex-direction:column;overflow:hidden;padding:0}
.conv-top{flex:none;padding:10px 18px 4px;border-bottom:1px solid var(--bd)}
.conv-head{display:flex;align-items:center;gap:8px}
.conv-head h2{font-size:16px;margin:8px 0 4px;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#conv{flex:1;min-height:0;overflow-y:auto;padding:6px 18px}
main.convview .composer{flex:none;margin:10px 18px 12px}
.load-earlier{display:block;width:fit-content;max-width:100%;margin:0 auto 10px;padding:4px 18px;
  border:1px dashed var(--bd);border-radius:999px;background:var(--card);color:var(--mut);
  font:inherit;font-size:13px;cursor:pointer}
.load-earlier:hover{color:var(--fg);border-color:var(--acc)}
.conv-overview>summary{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 队列摘要内联在模型选择行右侧：只有 chip 文字可 hover/点击；详情浮层挂在 body 顶层、
   固定定位随 chip 计算，不随 main 的 overflow 裁剪，也不被侧栏/抽屉遮挡 */
.queue-chip{display:inline-block;position:relative;font-size:12px;color:var(--mut);
  cursor:default;padding:2px 0}
#queuepop{position:fixed;z-index:200;width:min(80vw,480px);max-height:45vh;overflow-y:auto;
  background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;
  box-shadow:0 8px 24px rgba(0,0,0,.16);text-align:left}
#queuepop[hidden]{display:none}
/* 系统面板浮层：同 #queuepop 挂 body 顶层固定定位，锚定 header 的系统按钮 */
#syspop{position:fixed;z-index:200;width:min(90vw,340px);background:var(--bg);border:1px solid var(--bd);
  border-radius:8px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.16);text-align:left}
#syspop[hidden]{display:none}
.sysrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--mut);margin-top:8px}
.sysbar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:3px}
.sysbar>i{display:block;height:100%;background:var(--acc)}
.sysbar.warn>i{background:#d97706}
.sysbar.hot>i{background:#dc2626}
.syscores{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:4px 10px;margin-top:6px}
.core{font-size:10px;color:var(--mut)}
.core .sysbar{height:4px;margin-top:2px}
.sysacts{display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--bd)}
.systimer{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--mut)}
.systimer select{font:inherit;font-size:12px;padding:2px 4px;background:var(--bg);color:var(--fg);
  border:1px solid var(--bd);border-radius:6px}
/* 移动端：抽屉式侧栏 */
#menu{display:none}
#mask{display:none}
@media(max-width:768px){
  #app{grid-template-columns:1fr}
  #menu{display:inline-block}
  header{padding:8px 10px;gap:10px}
  main{padding:8px 10px}
  .conv-top{padding:8px 10px 4px}
  .conv-cwd{display:none}
  .conv-head h2{font-size:14px;margin:4px 0}
  #conv{padding:4px 10px 12px}
  main.convview .composer{margin:8px 10px}
  .composer-cog{display:inline-block}
  .composer-extra{display:none}
  .composer.open .composer-extra{display:flex;position:absolute;right:0;bottom:calc(100% + 6px);
    z-index:30;flex-direction:column;align-items:flex-start;gap:8px;background:var(--bg);
    border:1px solid var(--bd);border-radius:8px;padding:10px 12px;
    box-shadow:0 8px 24px rgba(0,0,0,.16);max-height:60vh;overflow-y:auto}
  .composer textarea{height:4.6em}
  .ubody{max-width:92%}
  aside{position:fixed;top:0;bottom:0;left:0;width:min(75vw,300px);z-index:20;background:var(--bg);
        transform:translateX(-100%);transition:transform .2s ease}
  aside.open{transform:none}
  #mask{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15;
        opacity:0;pointer-events:none;transition:opacity .2s}
  #mask.show{opacity:1;pointer-events:auto}
}
</style>
</head>
<body>
<header>
  <button id="menu" class="back" aria-label="项目列表">☰</button>
  <h1>Claude Sessions <span class="mut" id="total"></span></h1>
  <label class="ctl">
    <span class="sw"><input type="checkbox" id="auto" checked><i></i></span> 自动刷新
  </label>
  <label class="ctl">间隔
    <select id="ival">
      <option value="2000">2s</option>
      <option value="3000">3s</option>
      <option value="5000">5s</option>
      <option value="10000">10s</option>
    </select>
  </label>
  <span class="ctl" id="updated"></span>
  <button id="hostedbadge" class="back" style="display:none"
          title="当前托管（常驻进程）的会话数，点击查看列表">托管 0</button>
  <button id="pendingbadge" class="back"
          title="有权限请求等待审批，点击跳转">待审批 0</button>
  <span id="err"></span>
  <button id="sysbtn" class="back" style="margin-left:auto" title="系统状态与电源操作">🖥 系统</button>
</header>
<div id="app">
  <aside id="projs"></aside>
  <main id="main"></main>
</div>
<div id="mask"></div>
<div id="queuepop" hidden></div>
<div id="syspop" hidden></div>

<script>
const DEFAULT_IVAL = {{ refresh_interval | round(3) }} * 1000;
const SEND_POLL_TIMEOUT_MS = 30 * 60 * 1000;   // 发送后跟踪 /jobs 的最长时间
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATE_ZH = {working: "工作中", idle: "空闲", stale: "无活动"};
// <details> 的展开状态跨 innerHTML 重建保留；key 必须由内容派生且稳定
const detailsOpen = (() => {
  const state = Object.create(null);
  if(typeof sessionStorage === "undefined") return state;
  try{ return Object.assign(state, JSON.parse(sessionStorage.getItem("detailsOpen") || "{}")); }
  catch{ return state; }
})();
function saveDetailsOpen(){
  if(typeof sessionStorage === "undefined") return;
  try{ sessionStorage.setItem("detailsOpen", JSON.stringify(detailsOpen)); }catch{ /* 超限或隐私模式 */ }
}
function detailsAttrs(key, defaultOpen = false){
  const open = key in detailsOpen ? detailsOpen[key] : defaultOpen;
  return ` data-dkey="${esc(key)}"` + (open ? " open" : "");
}
const TASK_ZH = {pending: "待办", in_progress: "进行中", completed: "已完成", deleted: "已删除"};

let sessions = [];                 // 最新概览数据
let view = {project: null, session: null};   // 当前视图
let sessionCommands = [];   // 当前会话的指令目录（仅托管进程活着时有内容）
let curPanel = null;               // main 里已渲染的面板 {type:"list"|"conv"|"new", key}，
                                   // 自动刷新只更新数据区域、不重建输入区，避免失焦/丢草稿
let convCache = {id: null, size: -1};        // 对话缓存标记，避免重复渲染
let convState = {id: null, msgs: [], total: 0, cursor: 0, start: 0, size: -1,
                 hasMore: false, loadingEarlier: false};
let lastSidebarSig = "", lastListSig = "";
let esGlobal = null, esSession = null, globalSeq = 0, sessionSeq = 0;
let listTimer = null, convTimer = null;
let lastListLoad = 0;              // 上次 /sessions 请求开始的毫秒时间戳
let liveText = "", liveRaf = null;
let timer = null;
let sendJobs = {};                 // key -> {jobId, status, result, error} 发送任务状态，跨刷新保留；
                                   // key 为会话 id 或 "new:<cwd>"，多个会话可各有一个进行中任务

  if(caughtUp) displayedTurnEnd.set(id, Math.max(displayedTurnEnd.get(id) || 0, requestEnd));

function applySessions(next){
  if(!Array.isArray(next)) throw Error("会话列表响应无效");
  next = next.map(mergeMetadata);
  for(const s of next){
    const end = typeof s.last_turn_end_at === "number" && Number.isFinite(s.last_turn_end_at)
      && s.last_turn_end_at > 0 ? s.last_turn_end_at : 0;
    if(!turnEndHighWater.has(s.id)){ turnEndHighWater.set(s.id, end); continue; }
    if(end > turnEndHighWater.get(s.id)){
      turnEndHighWater.set(s.id, end);
      unreadSessions.add(s.id);
    }
  }
  sessions = next;
  sessionsVersion++;
  markDisplayedRead();
  renderMain();
}

}

     && box?.dataset.draftKey === submitted.key && box.value === submitted.rawText){

function relTime(ts){
  if(!ts) return "";
  const d = Date.now()/1000 - ts;
  if(d < 60) return Math.floor(d) + " 秒前";
  if(d < 3600) return Math.floor(d/60) + " 分钟前";
  if(d < 86400) return Math.floor(d/3600) + " 小时前";
  return Math.floor(d/86400) + " 天前";
}
function dur(a, b){
  if(!a || !b || b <= a) return "";
  const d = b - a;
  if(d < 3600) return Math.floor(d/60) + "m";
  if(d < 86400) return (d/3600).toFixed(1) + "h";
  return (d/86400).toFixed(1) + "d";
}
function fmtTok(n){
  if(!n) return "0";
  if(n >= 1e6) return (n/1e6).toFixed(1) + "M";
  if(n >= 1e3) return (n/1e3).toFixed(1) + "k";
  return String(n);
}

function saveMetadata(sid, patch){
  if(sid.includes("::")) return Promise.resolve();
  const previous = metadataSaves.get(sid) || Promise.resolve();
  const task = previous.catch(() => {}).then(async () => {
    metadataStatus(sid, "保存中…");
    try{
      const r = await fetchT("/sessions/" + encodeURIComponent(sid) + "/metadata", {
        method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(patch)});
      const data = await r.json();
      if(!r.ok || data.error || data.id !== sid) throw Error(data.error || "HTTP " + r.status);
      mergeMetadata(data);   // 副作用：更新 metadataCache
      sessions = sessions.map(s => s.id === sid ? {...s, ...metadataCache.get(sid)} : s);
      sessionsVersion++;
      const detail = detailMetadata.get(sid) || sessions.find(s => s.id === sid);
      if(detail) updateMetadataControls({...detail, ...metadataCache.get(sid)});
      metadataStatus(sid, "已保存");
      renderMain(); scheduleListRefresh();
    }catch(e){ metadataStatus(sid, "保存失败：" + e.message); }
  });
  metadataSaves.set(sid, task);

}

}

/* ---------- URL 路由 ---------- */
// 路径按目录层级展开，保留几乎可读的字符；只转义空格、#、? 等会破坏 URL 的字符
function encSeg(s){ return encodeURIComponent(String(s)).replace(/%3A/gi, ":"); }
function decSeg(s){
  try{ return decodeURIComponent(s); }catch{ return null; }
}
function normPath(p){
  return String(p == null ? "" : p).replace(/\\/g, "/").replace(/^\/+|\/+$/g, "");
}
function sameProject(a, b){ return !!a && !!b && normPath(a) === normPath(b); }
function projectUrlPath(cwd){
  return normPath(cwd).split("/").filter(Boolean).map(encSeg).join("/");
}
function routePath(v){
  if(v?.pending) return "/pending";
  if(v?.hosted) return "/hosted";
  if(!v || !v.project) return "/";
  const base = "/p/" + projectUrlPath(v.project);
  if(v.session) return base + "/s/" + encSeg(v.session);
  if(v.new) return base + "/new";
  return base;
}
function parseRoute(pathname){
  if(pathname === "/pending") return {pending: true, project: null, session: null, new: false};
  if(pathname === "/hosted") return {hosted: true, project: null, session: null, new: false};
  if(!pathname) return null;
  const parts = pathname.split("/").filter(Boolean);
  if(parts.length < 2 || parts[0] !== "p") return null;
  const all = parts.slice(1).map(decSeg);
  if(all.some(x => x === null)) return null;
  let rest = parts.slice(1), session = null, isNew = false;
  // 从右端识别 /s/<会话ID> 与 /new；项目路径本身可能包含斜杠
  if(rest.length >= 3 && rest[rest.length - 2] === "s"){
    session = decSeg(rest[rest.length - 1]);
    if(session === null) return null;
    rest = rest.slice(0, -2);
  } else if(rest.length >= 2 && rest[rest.length - 1] === "new"){
    isNew = true;
    rest = rest.slice(0, -1);
  }
  if(!rest.length) return null;
  const project = rest.map(decSeg).join("/");
  // fullProject 用于消歧：目录本身就叫 new 或形如 .../s/xxx 时优先按项目列表解析
  return {project, session, new: isNew, fullProject: all.join("/")};
}
// 把 URL 中的可读路径映射回系统原生 cwd；同时处理 "项目目录名恰好是 new" 的歧义
function resolveViewProject(projects){
  if(!view) return;
  if(view.fullProject){
    const exact = projects.find(p => sameProject(p.cwd, view.fullProject));
    if(exact){
      view = {project: exact.cwd, session: null, new: false};
      return;
    }
    delete view.fullProject;
  }
  if(!view.project) return;
  const match = projects.find(p => sameProject(p.cwd, view.project));
  if(match) view.project = match.cwd;
}

function md(text){
  if(window.marked){
    const html = marked.parse(text);
    return window.DOMPurify ? DOMPurify.sanitize(html) : html;
  }
  return `<pre>${esc(text)}</pre>`;
}

// 会话页和新建会话页共用同一个输入对话框，避免两套 textarea/按钮/键盘行为
function commandToken(value){
  const m = (value || "").match(/^\/[^\s]*$/);
  return m ? m[0] : null;
}
function filterCommands(commands, token){
  if(token == null) return [];
  return (commands || []).filter(name => ("/" + name).startsWith(token));
}
// 新建会话页的命令目录：托管进程尚未启动，先取服务端扫描的自定义命令做提示
const projectCommandsCache = Object.create(null);   // cwd -> Promise<string[]>

  if(!(cwd in projectCommandsCache)){
    projectCommandsCache[cwd] = fetchT("/commands?cwd=" + encodeURIComponent(cwd))
      .then(r => r.json())
      .then(j => Array.isArray(j && j.commands) ? j.commands : [])
      .catch(() => []);
  }
  return projectCommandsCache[cwd];
}
function wireCommandHints(box, getCommands){
  if(!box) return;
  const panel = document.getElementById("cmdhints");
  if(!panel) return;
  let selected = 0;
  const close = () => { panel.hidden = true; panel.replaceChildren(); selected = 0; };
  const render = () => {
    const token = commandToken(box.value);
    const found = filterCommands(getCommands(), token);
    if(token == null || !found.length){ close(); return; }
    if(selected >= found.length) selected = found.length - 1;
    panel.replaceChildren(...found.map((name, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cmd-hint" + (i === selected ? " selected" : "");
      btn.textContent = "/" + name;
      btn.onclick = () => { box.value = "/" + name + " "; close(); box.focus(); };
      return btn;
    }));
    panel.hidden = false;
  };
  box.addEventListener("input", () => { selected = 0; render(); });
  box.addEventListener("keydown", event => {
    if(panel.hidden) return;
    const found = filterCommands(getCommands(), commandToken(box.value));
    if(!found.length) return;
    if(event.key === "ArrowDown"){
      event.preventDefault(); selected = Math.min(selected + 1, found.length - 1); render();
    }else if(event.key === "ArrowUp"){
      event.preventDefault(); selected = Math.max(selected - 1, 0); render();
    }else if(event.key === "Tab"){
      event.preventDefault(); box.value = "/" + found[selected] + " "; close();
    }else if(event.key === "Enter"){
      // 面板展开时 Enter 只补全选中项到输入框，不触发发送；再次 Enter 才发送
      event.preventDefault(); box.value = "/" + found[selected] + " "; close();
    }else if(event.key === "Escape"){
      close();
    }
  });
  box.addEventListener("blur", () => setTimeout(close, 150));
}

function updateModelOptions(key, options){
  const sel = document.getElementById("modelsel"), input = document.getElementById("modelcustom");
  if(!sel || !input || !panelMatch(key)) return;
  const state = modelDraft(key);
  const selectedOption = Array.from(sel.options).find(option => option.value === sel.value);
  const selectedKind = selectedOption?.dataset?.kind;
  const customValue = input.value;
  const unique = [], seen = new Set();
  for(const item of Array.isArray(options) ? options : []){
    if(!item || typeof item.name !== "string" || typeof item.model !== "string" || !item.model) continue;
    const identity = JSON.stringify([item.name, item.model]);
    if(seen.has(identity)) continue;
    seen.add(identity); unique.push({name: item.name, model: item.model});
  }
  modelProfileOptions[key] = unique;
  const savedProfileChoice = state.value !== null && unique.some(item => item.model === state.value)
    ? modelChoiceFor(key, state.value) : null;
  let selected = selectedKind === "custom"
    ? (!state.touched && savedProfileChoice ? savedProfileChoice : customModelChoice)
    : selectedKind === "profile" || state.value !== null
      ? (savedProfileChoice || customModelChoice) : defaultModelChoice;
  const add = (label, value, kind, model = "") => {
    const option = document.createElement("option");
    option.textContent = label; option.value = value; option.dataset.kind = kind;
    if(model) option.dataset.model = model;
    sel.appendChild(option);
  };
  sel.replaceChildren();
  add("默认（清除 Web 覆盖）", defaultModelChoice, "default");
  for(let i = 0; i < unique.length; i++){
    const item = unique[i]; add(item.name, profileModelChoice(i), "profile", item.model);
  }
  add("自定义 ID", customModelChoice, "custom");
  if(selected.startsWith("profile:") && !Array.from(sel.options).some(option => option.value === selected)) selected = customModelChoice;
  sel.value = selected;
  input.value = customValue;
  input.hidden = selected !== customModelChoice;
}
async function loadModelOptions(key, cwd){
  const generation = modelOptionRequests[key] = (modelOptionRequests[key] || 0) + 1;
  const isCurrent = () => modelOptionRequests[key] === generation && panelMatch(key);
  try{
    const r = await fetchT("/cc-switch?cwd=" + encodeURIComponent(cwd || ""));
    if(!r.ok) throw Error("HTTP " + r.status);
    const data = await r.json();
    if(!Array.isArray(data.model_options)) throw Error("响应缺少模型选项");
    if(isCurrent()) updateModelOptions(key, data.model_options);
  }catch(e){
    if(!isCurrent()) return;
    modelDraft(key).status = "local 配置模型选项未加载，可使用默认或自定义模型 ID";
    updateModelSt(key);
  }
}
function updateModelSt(key){
  if(!panelMatch(key)) return;
  const el = document.getElementById("modelst");
  if(el) el.textContent = modelDraft(key).status;
}
async function saveModel(key){
  const s = modelDraft(key);
  s.version++;
  if(s.saving) return;
  s.saving = true;
  try{
    for(;;){
      const version = s.version, model = s.value;
      s.status = "保存中…"; updateModelSt(key);
      try{
        const r = await fetchT("/sessions/" + encodeURIComponent(key) + "/model", {
          method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({model}),
        });
        const j = await r.json();
        if(!r.ok || j.error) throw Error(j.error || "HTTP " + r.status);
        s.status = "已保存，下次发送生效";
      }catch(e){ s.status = "保存失败：" + e.message + "（可重选后重试）"; }
      if(version === s.version) break; // 串行合并编辑，较早请求不能盖过最后的选择
    }
  }finally{ s.saving = false; updateModelSt(key); }
}
function bindModel(key, selected){
  const s = modelDraft(key, selected), sel = document.getElementById("modelsel"), input = document.getElementById("modelcustom");
  sel.value = s.value === null ? defaultModelChoice : modelChoiceFor(key, s.value);
  input.hidden = sel.value !== customModelChoice; input.value = s.custom;
  const edit = save => {
    if(!panelMatch(key)) return;
    const option = Array.from(sel.options).find(item => item.value === sel.value);
    const kind = option?.dataset?.kind;
    input.hidden = kind !== "custom";
    s.custom = input.value;
    s.value = kind === "custom" ? input.value : kind === "profile" ? option.dataset.model : null;
    if(kind === "custom" && !input.value){
      s.status = "请输入自定义模型 ID"; updateModelSt(key); return;
    }
    if(save && !key.startsWith("new:")) saveModel(key);
    else if(key.startsWith("new:")){ s.status = "随首次发送提交"; updateModelSt(key); }
  };
  sel.onchange = () => { s.touched = true; edit(true); };
  input.oninput = () => { s.touched = true; edit(false); }; // 异步选项加载不覆盖尚未失焦的自定义编辑
  input.onchange = () => { s.touched = true; edit(true); };
  updateModelSt(key);
}
function modelSnapshot(key){
  const value = modelDraft(key).value;
  if(value !== null && (!value || value.length > 256 || value.trim() !== value || /[\x00-\x1f\x7f]/.test(value))){
    modelDraft(key).status = "请输入有效模型 ID（最多 256 字符，无首尾空白或控制字符）";
    updateModelSt(key); return undefined;
  }
  return value;
}
function ccHtml(){
  return `<details class="fold" id="ccpanel"><summary>项目 local 配置 · cc-switch</summary>
    <div class="mut" id="ccbody" aria-live="polite"></div></details>`;
}
function ccMatch(cwd){
  const el = document.getElementById("ccpanel");
  if(!el || el.ccCwd !== cwd || !curPanel) return false;
  return el.ccPanel === curPanel.type + ":" + curPanel.key;
}
function bindCc(cwd){
  const el = document.getElementById("ccpanel");
  el.ccCwd = cwd; el.ccPanel = curPanel.type + ":" + curPanel.key;
  const s = ccStates[cwd] ||= {};
  el.open = !!s.open;

function renderCc(cwd){
  if(!ccMatch(cwd)) return;
  const s = ccStates[cwd], d = s.data;
  const body = document.getElementById("ccbody");
  body.innerHTML = `<div class="config-path">目录：${esc(d?.target_cwd || cwd)}</div>` +
    (d ? `<div class="config-path">目标文件：${esc(d.target_path || "未提供")}</div>
      <div>当前 profile：${esc(d.current_profile || "未设置")}</div>
      <div class="model-controls"><select id="ccprofile" aria-label="local profile"></select>
        <button class="back" id="ccapply">应用 local</button><button class="back" id="ccrefresh">刷新</button></div>
      <div>${esc(!d.installed ? d.reason || "未安装 cc-switch，无法切换" : !d.available ? d.reason || "当前目录不可用" : "仅写入该目录 local；同目录会话共享。")}</div>` :
      `<button class="back" id="ccrefresh">加载配置状态</button>`) +
    `<div role="status" style="white-space:pre-wrap">${esc(s.pending ? "操作中…" : s.message || "")}</div>`;
  const refresh = document.getElementById("ccrefresh");
  refresh.disabled = !!s.pending; refresh.onclick = () => loadCc(cwd);
  if(!d) return;
  const sel = document.getElementById("ccprofile");
  // 用 textContent / value 填入名称，不把外部名称拼进 HTML 属性
  for(const name of d.profiles || []){
    const option = document.createElement("option"); option.value = name; option.textContent = name; sel.appendChild(option);
  }
  s.profile = (d.profiles || []).includes(s.profile) ? s.profile : (d.profiles || []).includes(d.current_profile) ? d.current_profile : d.profiles?.[0] || "";
  sel.value = s.profile;
  sel.disabled = !!s.pending || !d.installed || !d.available;
  sel.onchange = () => { if(ccMatch(cwd)) s.profile = sel.value; };
  const apply = document.getElementById("ccapply");
  apply.disabled = !!s.pending || !d.installed || !d.available || !s.profile || !d.revision || !d.target_path;
  apply.onclick = () => applyCc(cwd);
}
async function loadCc(cwd){
  const s = ccStates[cwd] ||= {};
  if(s.pending) return;
  s.pending = true; s.message = ""; renderCc(cwd);
  try{
    const r = await fetchT("/cc-switch?cwd=" + encodeURIComponent(cwd));
    const d = await r.json();
    if(!r.ok || d.error) throw Error(d.error || "HTTP " + r.status);
    s.data = d;
  }catch(e){ s.data = null; s.message = "加载失败：" + e.message; }
  finally{ s.pending = false; renderCc(cwd); }
}
async function applyCc(cwd){
  const s = ccStates[cwd], d = s?.data;
  if(!d?.installed || !d.available || s.pending || !(d.profiles || []).includes(s.profile) || !d.target_path || !d.revision) return;
  const profile = s.profile, revision = d.revision;
  if(!window.confirm(`应用 profile：${profile}\n目标目录：${d.target_cwd}\n目标文件：${d.target_path}\n\n将整文件覆盖 local 配置；原文件存在时先自动备份。\n同目录的其他会话共享此配置。\n已有 Hosted 托管进程不会重启，也不会热切换；请退出后重新托管以加载。\n\n确定应用？`)) return;
  s.pending = true; s.message = ""; renderCc(cwd);
  try{
    const r = await fetchT("/cc-switch/local", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({cwd, profile, confirm: true, revision})}, 60000);
    const j = await r.json();
    if(!r.ok || j.error) throw Error((j.error || "HTTP " + r.status) + (r.status === 409 ? "；请刷新状态后重新确认" : ""));
    s.data = j;
    s.message = "local 已写入，已有托管进程未重启，请退出后重新托管。" +
      (j.backed_up ? "\n已备份原文件" + (j.backup_path ? "：" + j.backup_path : "") : "\n原文件不存在，无需备份。");
  }catch(e){
    s.message = "应用失败：" + e.message + "\n磁盘配置可能已改变，请刷新核实后再操作。";
    s.data = null; // 不允许用旧 revision 再次确认
  }finally{ s.pending = false; renderCc(cwd); }
}

/* ---------- SSE 实时更新 ---------- */
const SSE_TYPES = ["snapshot", "session_discovered", "user_message", "assistant_message",
  "tool_use", "tool_error", "turn_finished", "subagent_start", "subagent_done",
  "task_created",
  "task_updated", "context_compacted", "api_error", "hosted_turn_done",
  "hosted_api_retry", "hosted_foreign_turn", "interaction_pending",
  "interaction_resolved", "turn_interrupted", "turn_delta", "remote_message_sent",
  "remote_message_done", "hosted_exited", "session_metadata_changed", "queue_changed"];
const raf = window.requestAnimationFrame || (fn => setTimeout(fn, 16));

function listGap(){ return +ival.value || DEFAULT_IVAL; }
function scheduleListRefresh(){
  // SSE 事件驱动的刷新也受用户设置的间隔约束，否则活跃会话会把 5s 设置变成每 800ms 一次
  clearTimeout(listTimer);
  const wait = Math.max(0, listGap() - (Date.now() - lastListLoad));
  listTimer = setTimeout(() => {
    listTimer = null;
    if(!document.hidden) load();
  }, wait);
}
function scheduleConvRefresh(sid){
  if(view.session !== sid) return;
  clearTimeout(convTimer);
  convTimer = setTimeout(() => {
    if(!document.hidden) renderConversation(sid, false);
  }, 500);
}
function onGlobalSse(event){
  let msg;
  try{ msg = JSON.parse(event.data); }catch{ return; }
  if(msg.seq && msg.seq <= globalSeq) return;
  if(msg.seq) globalSeq = msg.seq;
  handleSseMessage(msg);
}
function onSessionSse(event){
  let msg;
  try{ msg = JSON.parse(event.data); }catch{ return; }
  if(msg.seq && msg.seq <= sessionSeq) return;
  if(msg.seq) sessionSeq = msg.seq;
  handleSseMessage(msg);
}
function handleSseMessage(msg){
  if(msg.type === "snapshot"){
    if(msg.data.sessions){
      applySessions(msg.data.sessions);
    }
    if(msg.data.session && view.session === msg.session){
      applySessionDetail(msg.data.session);
      if(msg.data.live && msg.data.live.text) updateLiveBubble(msg.data.live.text);
      scheduleConvRefresh(msg.session);
    }
    return;
  }
  if(msg.type === "turn_delta"){
    if(view.session === msg.session) updateLiveBubble(msg.data.text || "");
    return;
  }
  if(["turn_finished", "hosted_turn_done", "interaction_pending",
      "turn_interrupted"].includes(msg.type) && view.session === msg.session){
    clearLiveBubble();
  }
  scheduleListRefresh();
  if(msg.session) scheduleConvRefresh(msg.session);
}
function connectGlobalSse(){
  if(!window.EventSource) return;
  if(esGlobal) esGlobal.close();
  esGlobal = new EventSource("/events");
  for(const type of SSE_TYPES) esGlobal.addEventListener(type, onGlobalSse);
  let opened = false;
  esGlobal.onopen = () => {
    if(opened){
      globalSeq = 0;
      load();
      if(view.session) renderConversation(view.session, true);
    }
    opened = true;
  };
}
function connectSessionSse(id){
  if(!window.EventSource) return;
  disconnectSessionSse();
  esSession = new EventSource("/events?session=" + encodeURIComponent(id));
  for(const type of SSE_TYPES) esSession.addEventListener(type, onSessionSse);
  let opened = false;
  esSession.onopen = () => {
    sessionSeq = 0;
    if(opened && view.session === id) renderConversation(id, true);
    opened = true;
  };
}
function disconnectSessionSse(){
  if(esSession){ esSession.close(); esSession = null; }
}
function applySessionDetail(d){
  if(!d) return;
  d = mergeMetadata(d);
  detailMetadata.set(d.id, d);
  updateMetadataControls(d);
  const badge = document.getElementById("statebadge");
  if(badge){ badge.className = "b " + d.state; badge.textContent = STATE_ZH[d.state] || d.state; }
  const overview = document.getElementById("overviewwrap");
  if(overview) overview.innerHTML = overviewHtml(d);
  renderApiError(d.last_api_error);
  updateModelSt(d.id || convState.id || "");
}
function renderApiError(err){
  // 上游 503/限流时 CLI 只写 system/api_error，转录里没有助手内容；
  // 这里把服务端记录的重试状态显示出来，避免看起来像卡死
  const el = document.getElementById("apierr");
  if(!el) return;
  if(!err || !err.text){
    el.textContent = "";
    el.style.display = "none";
    return;
  }
  let tail = "";
  // 只有最近发生的错误才算“正在重试”；重启服务回放旧转录时不显示过期的重试状态
  const fresh = err.ts && Date.now() / 1000 - err.ts < 180;
  if(err.retry_attempt && fresh){
    tail = `，正在第 ${err.retry_attempt}${err.max_retries ? "/" + err.max_retries : ""} 次重试`;
    if(err.retry_in_ms) tail += `，约 ${Math.max(1, Math.round(err.retry_in_ms / 1000))} 秒后继续`;
  }
  el.textContent = "⚠ 模型服务暂不可用：" + err.text + tail;
  el.style.display = "";
}
function updateLiveBubble(text){
  liveText = text || "";
  if(liveRaf) return;
  liveRaf = raf(() => { liveRaf = null; renderLiveBubble(); });
}
function renderLiveBubble(){
  const conv = document.getElementById("conv");
  if(!conv || !conv.appendChild) return;
  let el = document.getElementById("livebubble");
  if(!liveText){
    if(el && el.remove) el.remove();
    return;
  }
  if(!el){
    el = document.createElement("div");
    el.id = "livebubble";
    el.className = "msg assistant";
    el.innerHTML = '<div class="mhead">助手 · 正在输入…</div><div class="abody"></div>';
    conv.appendChild(el);
  }
  const body = el.querySelector ? el.querySelector(".abody") : null;
  if(body) body.textContent = liveText;
}
function clearLiveBubble(){
  liveText = "";
  renderLiveBubble();
}

/* ---------- 分组 ---------- */
function groupByProject(){
  const groups = new Map();
  for(const s of sessions){
    const k = s.project || s.cwd || "?";
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(s);
  }
  return [...groups.entries()]
    .map(([cwd, ss]) => ({
      cwd, sessions: ss,
      working: ss.filter(s => s.state === "working").length,
      unread: ss.filter(s => unreadSessions.has(s.id)).length,
      wt: ss.filter(s => s.cwd && s.cwd !== s.project).length,
      out: ss.reduce((a, s) => a + ((s.tokens || {}).output || 0), 0),
      last: Math.max(...ss.map(s => s.last_event_at || 0)),
    }))
    // 侧栏顺序固定按项目名排列（不随活跃时间跳动），同名时按完整路径区分
    .sort((a, b) =>
      projName(a.cwd).localeCompare(projName(b.cwd), "zh", {numeric: true})
      || a.cwd.localeCompare(b.cwd, "zh", {numeric: true}));
}

/* ---------- 渲染：会话列表 ---------- */
const projectConditions = new Map();
function listConditions(cwd){
  if(!projectConditions.has(cwd)) projectConditions.set(cwd, {query: "", filter: "all", scope: "active"});
  return projectConditions.get(cwd);
}
function filterProjectSessions(items, conditions){
  const query = (conditions.query || "").trim().toLowerCase();
  return items.filter(s => {
    const scope = conditions.scope || "active";
    if(scope === "active" && s.archived || scope === "archived" && !s.archived) return false;
    const filter = conditions.filter;
    if(filter === "working" && s.state !== "working"
       || filter === "hosted" && !s.hosted
       || filter === "pending" && !(s.pending_interactions > 0)
       || filter === "unread" && !unreadSessions.has(s.id)) return false;
    return !query || [sessTitle(s), s.title, s.project, s.cwd, s.git_branch, s.model,
      s.first_user_message, s.last_user_message].some(value => String(value ?? "").toLowerCase().includes(query));
  }).sort((a, b) => Number(!!b.pinned) - Number(!!a.pinned));
}
function renderSessionList(p){

  if(samePanel && sig === lastListSig) return;
  lastListSig = sig;
  if(!samePanel){
    document.getElementById("main").innerHTML = `
      <h2 style="font-size:16px;margin:4px 0">${esc(projName(p.cwd))}

      ${ccHtml()}
      <div class="list-toolbar">

        <div><label for="sessionfilter">筛选会话</label>
          <select id="sessionfilter"><option value="all">全部</option><option value="working">工作中</option>
            <option value="hosted">托管中</option><option value="pending">待审批</option><option value="unread">新回复</option></select></div>
        <div><label for="sessionscope">归档范围</label><select id="sessionscope"><option value="active">未归档</option><option value="archived">已归档</option><option value="all">全部记录</option></select></div>
        <button class="back" id="clearconditions">清除条件</button>
        <span class="mut" id="listcount" role="status"></span>
      </div>
      <div id="sessioncards"></div>`;
    const search = document.getElementById("sessionquery"), select = document.getElementById("sessionfilter");
    const scope = document.getElementById("sessionscope");
    search.value = conditions.query; select.value = conditions.filter; scope.value = conditions.scope;
    const refresh = () => {
      if(curPanel?.type !== "list" || curPanel.key !== p.cwd) return;
      // 输入期间不回写 value，也不替换工具栏，保留焦点和输入法合成状态。
      conditions.query = search.value; conditions.filter = select.value; conditions.scope = scope.value;

    search.oninput = refresh; select.onchange = refresh; scope.onchange = refresh;
    document.getElementById("clearconditions").onclick = () => {
      search.value = ""; select.value = "all"; scope.value = "active"; refresh();
    };
    bindCc(p.cwd);
  }
  document.getElementById("listmeta").textContent = `${p.cwd} · ${p.sessions.length} 会话 · 输出合计 ${fmtTok(p.out)} tok`;
  const matching = filterProjectSessions(p.sessions, conditions);
  document.getElementById("listcount").textContent = `匹配 ${matching.length} / 共 ${p.sessions.length}`;
  document.getElementById("sessioncards").innerHTML = matching.map(s => `
      <div class="scard" data-id="${esc(s.id)}">
        <span class="b ${s.state}">${STATE_ZH[s.state] || s.state}</span>
        ${s.hosted ? '<span class="chip" title="消息直接写入常驻 claude 进程">⚙ 托管中</span>' : ""}
        ${s.pending_interactions ? `<span class="chip pending">待审批 ${s.pending_interactions}</span>` : ""}
        ${unreadSessions.has(s.id) ? '<span class="chip" title="本页面观察到主回合结束；不代表任务成功或后台子代理全部结束">新回复</span>' : ""}
        <span class="stitle">${esc(sessTitle(s))}</span>
        ${metadataActionsHtml(s)}
        <div class="mut">${[
          s.cwd !== s.project ? "⎇ " + projName(s.cwd) : null,
          s.model, s.git_branch,
          relTime(s.last_event_at),
          dur(s.first_event_at, s.last_event_at) && "时长 " + dur(s.first_event_at, s.last_event_at),
          s.tasks_total && `任务 ${s.tasks_completed}/${s.tasks_total}`,
          s.subagent_count && `${s.subagent_count} 子代理${s.subagents_running ? ` · ${s.subagents_running} 运行中` : ""}`,
          s.tokens && s.tokens.output && `输出 ${fmtTok(s.tokens.output)} tok`,
        ].filter(Boolean).map(esc).join(" · ")}</div>
        <div class="mut" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.last_user_message || "")}</div>
      </div>`).join("") || `<div class="empty">${p.sessions.length ? "没有匹配的会话，请调整或清除条件" : "此项目暂无会话"}</div>`;
}

        : st === "stale" ? '<span class="dot stale" role="img" aria-label="已停滞" title="已停滞（会话长时间无活动，等待回合结束标记）"></span>'
        : st === "error" ? '<span class="dot err" role="img" aria-label="出错" title="出错"></span>'
        : '<span class="dot done" role="img" aria-label="已完成" title="已完成"></span>';
      return `<details class="fold"${detailsAttrs(`info:${sid}:subagents`)}><summary>子代理 (${d.subagents.length})${run ? ` · ${run} 运行中` : ""}</summary><ul>` +
        d.subagents.map(a => `<li>${dot(a.state)}<span class="chip">${esc(a.type)}</span> ${esc(a.description)}</li>`).join("") + "</ul></details>";
    })() : ""}
    ${d.tasks && d.tasks.length ? `<details class="fold"${detailsAttrs(`info:${sid}:tasks`, true)}><summary>任务 ${d.tasks_completed}/${d.tasks_total}</summary><ul>` +
      d.tasks.map(x => `<li class="${x.status}">[${TASK_ZH[x.status] || x.status}] ${esc(x.subject)}</li>`).join("") + "</ul></details>" : ""}`;
}
// 概览折叠：summary 一行摘要，展开是完整统计；key 带 sid，跨刷新保留展开状态
function overviewSummary(d){

  ].filter(Boolean).map(esc).join(" · ") || "暂无统计";

function diffHtml(text){
  return String(text || "").split("\n").map(line => {
    const cls = line.startsWith("+") ? "diff-add" : line.startsWith("-") ? "diff-del"
              : line.startsWith("@@") ? "diff-hunk" : "";
    return `<span class="${cls}">${esc(line)}</span>`;
  }).join("\n");
}
function toolResultHtml(p){
  // 已合并到工具卡时结果在 p.result；缓存从中间开始时可能是独立的 tool_result part
  const r = p.result || (p.type === "tool_result" ? p : null);
  if(!r) return "";
  if(r.kind === "diff") return `<pre class="tool-out">${diffHtml(r.text)}</pre>`;
  if(r.kind === "image") return `<div class="mut">[图片] ${esc(r.text || "")}</div>`;
  if(r.is_error || r.kind === "error") return `<div class="terror">✗ ${esc(r.text || "")}</div>`;
  return `<pre class="tool-out">${esc(r.text || "")}</pre>`;
}
function toolPartHtml(p){
  if(p.type === "tool_result")
    return `<div class="tool">🔧 工具结果${p.is_error ? " (错误)" : ""}</div>` + toolResultHtml(p);
  if(p.type === "tool_note") return `<div class="sysbody">${esc(p.text)}</div>`;
  if(p.type === "error") return `<div class="terror">✗ ${esc(p.text)}</div>`;
  const notes = (p.notes || []).map(esc).join("\n");
  const key = p.tool_use_id ? "tool:" + p.tool_use_id : "";
  return `<details class="tool-details"${key ? detailsAttrs(key) : ""}><summary>🔧 ${esc(p.name)}: ${esc(p.input)}</summary>` +
    (notes ? `<div class="mut">${esc(notes)}</div>` : "") + toolResultHtml(p) + `</details>`;

// 服务端把旧窗口的独立工具结果并入旧块的工具卡后，本地已加载列表里
// 同名孤儿结果已被吸收：合并时去掉这些 part，避免同一结果展示两次
function mergeEarlierMessages(older, newer){
  const tools = new Map();
  for(const m of older){
    for(const p of (m.parts || []))
      if(p.type === "tool" && p.tool_use_id) tools.set(p.tool_use_id, p);
  }
  let absorbed = false;
  if(tools.size) for(const m of newer){
    const keep = [];
    for(const p of (m.parts || [])){
      const t = tools.get(p.tool_use_id);
      if(p.type === "tool_result" && t){
        if(!t.result) t.result = p;
        absorbed = true;
      } else if(p.type === "tool_note" && t){
        t.notes = t.notes || [];
        if(!t.notes.includes(p.text)) t.notes.push(p.text);
        absorbed = true;
      } else keep.push(p);
    }
    m.parts = keep;
  }
  // 只有吸收发生时才丢弃被清空的消息；未涉及合并的消息原样保留
  if(!absorbed) return older.concat(newer);
  return older.concat(newer.filter(m => (m.parts || []).length));
}
function convGroups(messages){
  // 连续同角色合并为一组渲染；组对象每次新建，签名按内容比较
  const groups = [];
  for(const m of messages){
    const last = groups[groups.length - 1];
    if(last && last.role === m.role) last.parts.push(...m.parts);
    else groups.push({role: m.role, ts: m.ts, parts: [...m.parts]});
  }
  return groups;
}
function convGroupHtml(g){
  const body = g.parts.map(p => {
    if(p.type === "text")
      return g.role === "user" ? `<div class="ubody">${esc(p.text)}</div>`
           : g.role === "assistant" ? `<div class="abody">${md(p.text)}</div>`
           : `<div class="sysbody">${esc(p.text)}</div>`;
    if(p.type === "command")
      return `<div class="cmd">⌘ <code>${esc(p.command)}</code>${p.args ? " " + esc(p.args) : ""}</div>`;
    if(p.type === "command_output")
      // 无独立 id，key 由内容派生，重渲染后展开状态可恢复
      return `<details class="fold"${detailsAttrs("cmdout:" + p.text)}><summary>命令输出</summary><pre class="tool-out">${esc(p.text)}</pre></details>`;
    if(["tool", "tool_result", "tool_note", "error"].includes(p.type)) return toolPartHtml(p);
    return "";
  }).join("");
  const who = {user: "用户", assistant: "助手", tool: "工具", system: "系统"}[g.role] || g.role;
  const when = g.ts ? new Date(g.ts*1000).toLocaleString() : "";
  return `<div class="msg ${g.role}"><div class="mhead">${who} · ${when}</div>${body}</div>`;
}
function convHtml(messages){
  return convGroups(messages).map(convGroupHtml).join("");
}

function collectChoiceAnswers(card){
  const answers = {};
  if(!card || !card.querySelectorAll) return answers;
  for(const q of card.querySelectorAll(".choice-q")){
    const text = q.dataset.q;
    const freeEl = q.querySelector(".choice-free");
    const free = freeEl ? freeEl.value.trim() : "";
    const picked = [...q.querySelectorAll("input:checked")].map(x => x.dataset.label);
    if(free) answers[text] = free;
    else if(picked.length) answers[text] = picked.join(", ");
  }
  return answers;
}
// choice 卡的互斥与提交启停：勾选选项清空该题的“其他答案”，
// 输入文字取消该题勾选；所有问题都有答案前提交按钮保持禁用
function refreshChoiceSubmit(card){
  const btn = card.querySelector("button[data-act=choice-submit]");
  if(!btn) return;
  const answered = [...card.querySelectorAll(".choice-q")].every(q => {
    const free = q.querySelector(".choice-free");
    return (free && free.value.trim()) || q.querySelector("input:checked");
  });
  btn.disabled = !answered;
  btn.title = answered ? "" : "请先回答所有问题";
}
function wireChoiceCard(card){
  if(!card || !card.dataset.choice) return;
  card.querySelectorAll(".choice-q").forEach(q => {
    const free = q.querySelector(".choice-free");
    q.querySelectorAll("input[type=checkbox],input[type=radio]").forEach(inp => {
      inp.addEventListener("change", () => {
        if(inp.checked && free) free.value = "";
        refreshChoiceSubmit(card);
      });
    });
    if(free) free.addEventListener("input", () => {
      if(free.value.trim())
        q.querySelectorAll("input:checked").forEach(x => x.checked = false);
      refreshChoiceSubmit(card);
    });
  });
  refreshChoiceSubmit(card);
}
function renderInteractions(items){
  const el = document.getElementById("interactions");
  if(!el) return;
  items = items || [];
  // 卡片级 diff：以 id:state 为键保留未变的 DOM，作答中的 choice 卡
  // 不会因其他交互的新增/解决而被重置（丢失勾选和输入）
  const existing = [...el.querySelectorAll(".inter-card")];
  const bySig = new Map(existing.map(c => [c.dataset.sig, c]));
  const wanted = new Set(items.map(it => it.id + ":" + it.state));
  for(const c of existing) if(!wanted.has(c.dataset.sig)) c.remove();
  let anchor = el.firstChild;
  for(const it of items){
    const sig = it.id + ":" + it.state;
    let card = bySig.get(sig);
    if(!card){
      const tpl = document.createElement("template");
      tpl.innerHTML = interactionHtml(it);
      card = tpl.content.firstElementChild;
      wireChoiceCard(card);
    }
    if(card !== anchor) el.insertBefore(card, anchor);
    anchor = card.nextSibling;
  }
}
async function respondInteraction(card, act, scope, reason){
  if(!card) return;
  const iid = card.dataset.iid;
  let body;
  if(act === "choice-submit"){
    const answers = collectChoiceAnswers(card);
    const total = card.querySelectorAll ? card.querySelectorAll(".choice-q").length : 0;
    if(Object.keys(answers).length !== total){
      if(card.insertAdjacentHTML)
        card.insertAdjacentHTML("beforeend",
          '<div class="terror">请回答所有问题或点击跳过</div>');
      return;
    }
    body = {behavior: "allow", answers};
  } else if(act === "deny"){
    body = {behavior: "deny"};
    if(reason) body.reason = reason;
  } else {
    body = {behavior: act, scope: scope || "once"};
  }
  const buttons = card.querySelectorAll ? card.querySelectorAll("button") : [];
  buttons.forEach(b => b.disabled = true);
  try{
    const r = await fetchT("/interactions/" + encodeURIComponent(iid) + "/respond", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if(!r.ok) throw Error(j.error || ("HTTP " + r.status));
    load();
  }catch(e){
    if(card.insertAdjacentHTML)
      card.insertAdjacentHTML("beforeend", `<div class="terror">${esc(e.message)}</div>`);
    buttons.forEach(b => b.disabled = false);
    refreshChoiceSubmit(card);   // 恢复按作答状态启停，而不是一律可点
  }
}

let convLoading = null;     // 请求实例；旧请求的 finally 不得释放后继请求。
let convRequestGeneration = 0;
function scrollConvBottom(){
  const c = document.getElementById("conv");
  if(c) c.scrollTop = c.scrollHeight;
}
// 会话消息组的 DOM 缓存：签名未变的组复用原节点，markdown/DOMPurify 只跑新组
let convDom = {id: null, nodes: new Map(), echo: null};
const convLoadEarlierHtml = '<button class="load-earlier" id="loadearlier">加载更早</button>';
function makeNodeFromHtml(html){
  const tpl = document.createElement("template");
  tpl.innerHTML = html;
  return tpl.content.firstElementChild;
}
function renderConvList(){
  const el = document.getElementById("conv");
  if(!el) return;
  const echo = pendingEcho[convState.id];
  if(echo && !echoVisible(convState.msgs, echo)) delete pendingEcho[convState.id];
  const echoOut = pendingEcho[convState.id] ? echoHtml(pendingEcho[convState.id]) : "";
  // 聊天窗口顺序：旧消息在上、新消息和未落盘回显在下；加载更早的胶囊固定在顶部
  const groups = convGroups(convState.msgs);
  if(typeof el.insertBefore === "function" && el.querySelectorAll)
    renderConvDom(el, groups, echoOut);
  else
    el.innerHTML = (convState.hasMore ? convLoadEarlierHtml : "")
      + groups.map(convGroupHtml).join("") + echoOut;
  const btn = document.getElementById("loadearlier");
  if(btn) btn.onclick = loadEarlier;
  const count = document.getElementById("convcount");
  if(count) count.textContent = `对话 (${convState.msgs.length}/${convState.total})`;
  if(!liveText){
    const live = document.getElementById("livebubble");
    if(live && live.remove) live.remove();
  }
}
function renderConvDom(el, groups, echoStr){
  if(convDom.id !== convState.id){
    // 切换会话：旧节点全部作废，清空容器重新开始
    convDom = {id: convState.id, nodes: new Map(), echo: null};
    for(const child of el.querySelectorAll("*")){
      if(child.id !== "livebubble" && child.remove) child.remove();
    }
  }
  // 加载更早按钮固定为第一个子节点
  let btn = el.firstChild && el.firstChild.id === "loadearlier" ? el.firstChild : null;
  if(convState.hasMore && !btn){
    btn = makeNodeFromHtml(convLoadEarlierHtml);
    el.insertBefore(btn, el.firstChild);
  } else if(!convState.hasMore && btn && btn.remove){
    btn.remove();
    btn = null;
  }
  // 旧回显节点整体重建（内容小、无 markdown）
  if(convDom.echo && convDom.echo.remove){ convDom.echo.remove(); }
  convDom.echo = null;
  const wanted = [];
  const seen = new Set();
  for(const g of groups){
    const sig = JSON.stringify([g.role, g.ts, g.parts]);
    let node = convDom.nodes.get(sig);
    if(!node){
      node = makeNodeFromHtml(convGroupHtml(g));
      convDom.nodes.set(sig, node);
    }
    wanted.push(node);
    seen.add(sig);
  }
  if(echoStr){
    convDom.echo = makeNodeFromHtml(echoStr);
    wanted.push(convDom.echo);
  }
  // 失效组（截断重取、吸收合并后消失）退出缓存并移出 DOM
  for(const [sig, node] of [...convDom.nodes]){
    if(!seen.has(sig)){
      if(node.remove) node.remove();
      convDom.nodes.delete(sig);
    }
  }
  let anchor = btn ? btn.nextSibling : el.firstChild;
  for(const node of wanted){
    if(node !== anchor) el.insertBefore(node, anchor);
    anchor = node.nextSibling;
  }
}
async function loadEarlier(){
  if(!convState.id || !convState.hasMore || convState.loadingEarlier) return;
  const generation = ++convRequestGeneration;
  convLoading = null;   // 分页与增量共享索引，取代尚未提交的旧刷新。
  convState.loadingEarlier = generation;
  const state = convState, id = state.id, route = routeGeneration;
  const convEl = document.getElementById("conv");
  const oldHeight = convEl?.scrollHeight || 0, oldScroll = convEl?.scrollTop || 0;
  try{
    const r = await fetch(`/sessions/${encodeURIComponent(convState.id)}/messages` +
      `?before=${convState.start}&limit=100`);
    const page = await r.json();
    if(!r.ok || page.error || view.session !== id || convState !== state
       || route !== routeGeneration || generation !== convRequestGeneration) return;
    convState.msgs = mergeEarlierMessages(page.messages || [], convState.msgs);
    convState.start = page.start;
    convState.hasMore = !!page.has_more;
    convState.total = page.total;
    convState.size = page.size;
    for(let echo = pendingEcho[convState.id]; echo; echo = echo.previous)
      if(echo.after != null) echo.after += page.shift || 0;
    convState.cursor += page.shift || 0;   // 服务端前插了新块，末尾索引整体后移
    renderConvList();
    // 前插加载的旧块在上方展开，补偿高度差保持当前视野
    if(convEl) convEl.scrollTop = oldScroll + (convEl.scrollHeight - oldHeight);
  }catch(e){ /* 下次点击重试 */ }
  finally{ if(state.loadingEarlier === generation) state.loadingEarlier = false; }
}
async function renderConversation(id, force){
  if(!force && (convLoading?.id === id && convLoading.route === routeGeneration
     || convState.id === id && convState.loadingEarlier)) return;
  const request = {id, generation: ++convRequestGeneration, route: routeGeneration};
  convLoading = request;
  const current = () => request.generation === convRequestGeneration
    && request.route === routeGeneration && view.session === id;
  const main = document.getElementById("main");
  try{
    const isNew = !(curPanel && curPanel.type === "conv" && curPanel.key === id
                    && document.getElementById("conv"));
    if(isNew || force || convState.id !== id){
      const requestEnd = turnEndHighWater.get(id) || 0;
      // 直链进入时 main 还是空白：详情就绪前先给出反馈，避免"什么都不显示"
      if(isNew && !main.innerHTML) main.innerHTML = '<div class="empty">加载中…</div>';
      // 详情与消息同时发起、分开等待（均带超时）：消息失败不能拖垮整个会话页，下一轮刷新自动重试
      const dReq = fetchT("/sessions/" + encodeURIComponent(id));
      const mReq = fetchT(`/sessions/${encodeURIComponent(id)}/messages?limit=100`);
      mReq.catch(() => {});   // 详情侧提前返回时消息请求不得变成未处理拒绝
      const dRes = await dReq;
      const d = await dRes.json();
      if(!current()) return;   // 已切换走
      if(!dRes.ok){
        if(isNew) main.innerHTML = `<div class="empty">会话详情加载失败（HTTP ${dRes.status}），稍候自动重试…</div>`;
        return;
      }
      if(d.error){   // 转录尚未被轮询发现（常见于刚创建的会话）
        if(isNew) main.innerHTML = '<div class="empty">会话转录尚未就绪，稍候自动刷新…</div>';
        return;
      }
      let m = null, mErr = "";
      try{
        const mRes = await mReq;
        m = await mRes.json();
        if(!mRes.ok || m.error) mErr = (m && m.error) || `HTTP ${mRes.status}`;
      }catch(e){ mErr = e.message || String(e); }   // 超时/断网：报给用户，等下一轮重试
      if(!current()) return;
      // 刷新拉取失败但已有渲染内容：保留现有消息，只更新头部/审批，不打扰阅读
      const keepOld = mErr && convState.id === id && convState.msgs.length > 0;
      if(!keepOld)
        convState = {id: mErr ? null : id, msgs: (m && m.messages || []).slice(),
                     total: (m && m.total) || 0, cursor: (m && m.end) || 0,
                     start: (m && m.start) || 0, size: (m && m.size) || 0,

      if(isNew){

        scrollConvBottom();   // 聊天窗口：进入时停在最新消息
      }

    // 同面板刷新：只更新数据区域，不重建输入区

    let requestEnd = turnEndHighWater.get(id) || 0;
    const mRes = await fetchT(`/sessions/${encodeURIComponent(id)}/messages` +
      `?from=${convState.cursor}&limit=500`);

    if(!mRes.ok || m.error || !current()) return;
    if(convState.id !== id || m.size < convState.size || m.total < convState.total){
      // 文件被截断/替换：重新取最近一页
      requestEnd = turnEndHighWater.get(id) || 0;
      const freshRes = await fetchT(`/sessions/${encodeURIComponent(id)}/messages?limit=100`);
      const fresh = await freshRes.json();
      if(!freshRes.ok || fresh.error || !current()) return;
      convState = {id, msgs: (fresh.messages || []).slice(),
                   total: fresh.total || 0, cursor: fresh.end || 0,
                   start: fresh.start || 0, size: fresh.size || 0,
                   hasMore: !!fresh.has_more, loadingEarlier: false};

    } else if(m.messages && m.messages.length){
      const convEl = document.getElementById("conv");

      const nearBottom = !convEl || convEl.scrollHeight - convEl.scrollTop - convEl.clientHeight < 80;
      convState.msgs.push(...m.messages);

    // 渲染链路异常不能静默吞掉：至少留下控制台线索，页面在下一轮刷新重试
    if(typeof console !== "undefined" && console.error) console.error("会话视图渲染失败:", e);

}

/* ---------- 独立发送队列：服务端快照是事实，GET 与取消各自防乱序 ---------- */
const queueStates = new Map();
let routeGeneration = 0, submissionToken = 0;
function queueState(sid){
  if(!queueStates.has(sid)) queueStates.set(sid, {generation: 0, snapshot: null, error: "", notice: "", pop: null, cancelling: new Set()});
  return queueStates.get(sid);
}
function queueMatch(sid){ return view.session === sid && !view.new && panelMatch(sid); }
function queueJobHtml(job, kind, sid){
  const state = queueState(sid), status = {running: "执行中", queued: "等待中", done: "已完成", failed: "失败", cancelled: "已取消"}[job.status] || job.status || "";
  const position = kind === "queued" ? (job.position == null ? "待派发" : "FIFO #" + job.position) : status;
  return `<div class="queue-job" data-job-id="${esc(job.id)}"><div><b>${esc(position)}</b> · ${esc(status)}
    ${kind === "queued" && job.cancellable ? `<button class="back" data-cancel-job="${esc(job.id)}" data-sid="${esc(sid)}" ${state.cancelling.has(job.id) ? "disabled" : ""}>取消此项</button>` : ""}</div>
    <div class="queue-text">${esc(job.text || "")}</div><div class="mut">请求模型：${esc(job.requested_model || "默认")} · 提交时间：${job.created_at ? esc(new Date(job.created_at * 1000).toLocaleString()) : "未知"}</div>
    ${job.error ? `<div class="terror">${esc(job.error)}</div>` : ""}</div>`;
}
function queuePopHtml(sid){
  const state = queueState(sid), data = state.snapshot;
  const running = data?.running || [], queued = data?.queued || [], recent = data?.recent || [];
  return `<div class="mut" style="margin:0 0 4px">仅保留本次服务进程的有限历史，重启不恢复。</div>` +
    (state.error ? `<div class="terror" role="status">${esc(state.error)}</div>` : "") +
    (state.notice ? `<div role="status">${esc(state.notice)}</div>` : "") +
    (!data ? '<div class="mut">队列尚未加载</div>' :
      `<h5>执行中 (${running.length})</h5>${running.map(j => queueJobHtml(j, "running", sid)).join("")}
       <h5>等待发送 (${queued.length})</h5>${queued.map(j => queueJobHtml(j, "queued", sid)).join("")}
       ${!running.length && !queued.length ? '<div class="mut">暂无执行或等待项</div>' : ""}
       <details class="fold"${detailsAttrs("queue:" + sid + ":recent")}><summary>最近结束 (${recent.length})</summary>${recent.map(j => queueJobHtml(j, "recent", sid)).join("")}</details>`);
}
function hideQueuePop(){
  const pop = document.getElementById("queuepop");
  if(pop){ pop.hidden = true; pop.innerHTML = ""; }
}
function positionQueuePop(){
  const pop = document.getElementById("queuepop"), chip = document.getElementById("queue");
  if(!pop || pop.hidden || !chip) return;
  const rect = chip.getBoundingClientRect && chip.getBoundingClientRect();
  const root = document.documentElement;
  const vw = root ? root.clientWidth : 0, vh = root ? root.clientHeight : 0;
  if(!rect || !vw || !vh) return;   // 无布局环境（单测假 DOM）时只展示不定位
  const w = pop.offsetWidth || 0, h = pop.offsetHeight || 0;
  let left = Math.min(Math.max(8, rect.right - w), vw - w - 8);
  let top = rect.top - h - 6;   // 优先浮在 chip 上方，放不下再向下
  if(top < 8) top = Math.min(rect.bottom + 6, Math.max(8, vh - h - 8));
  pop.style.left = Math.round(left) + "px";
  pop.style.top = Math.round(top) + "px";
}
function showQueuePop(sid, mode){   // mode: "peek"（悬停/聚焦临时看）| "pinned"（点击固定）
  queueState(sid).pop = mode;
  refreshQueuePop(sid);
}
function closeQueuePop(sid){
  if(queueStates.has(sid)) queueState(sid).pop = null;
  hideQueuePop();
}
function refreshQueuePop(sid){
  const pop = document.getElementById("queuepop"), chip = document.getElementById("queue");
  if(!pop || !queueState(sid).pop || !queueMatch(sid) || !chip || chip.hidden){ hideQueuePop(); return; }
  pop.innerHTML = queuePopHtml(sid);
  pop.hidden = false;
  positionQueuePop();
}
function renderQueue(sid){
  if(sid.includes("::")) return;
  const el = document.getElementById("queue");
  if(!el) return;
  if(!queueMatch(sid)){ closeQueuePop(sid); return; }
  const state = queueState(sid), data = state.snapshot;
  const running = data?.running || [], queued = data?.queued || [];
  // 无执行/等待且无错误/通知时不占发送区的空间；摘要行常驻在模型选择行，
  // 详情浮层挂 body 顶层（悬停浏览、点击固定，触屏无 hover 用点击）
  const show = running.length || queued.length || state.error || state.notice;
  el.hidden = !show;
  if(!show){ state.pop = null; hideQueuePop(); return; }
  const bits = [];
  if(running.length) bits.push(`▶ 执行中 ${running.length}`);
  if(queued.length) bits.push(`⏳ 等待 ${queued.length}`);
  if(state.error) bits.push("⚠ 队列查询失败");
  if(state.notice) bits.push(state.notice);
  el.innerHTML = `<span class="queue-summary">${bits.join(" · ")}</span>`;
  refreshQueuePop(sid);
}
async function loadQueue(sid){
  if(sid.includes("::")) return;
  const state = queueState(sid), generation = ++state.generation, route = routeGeneration;
  const current = () => generation === state.generation && route === routeGeneration && queueMatch(sid);
  try{
    const r = await fetchT("/sessions/" + encodeURIComponent(sid) + "/jobs");
    const data = await r.json();
    if(!current()) return;
    if(!r.ok || data.error) throw Error(data.error || "HTTP " + r.status);
    if(data.session !== sid || ![data.running, data.queued, data.recent].every(Array.isArray)) throw Error("队列响应无效");
    state.snapshot = data; state.error = "";
    for(const job of [...data.running, ...data.queued, ...data.recent]) reconcileJob(sid, job);
  }catch(e){ if(current()) state.error = "队列查询失败（保留上次快照）：" + e.message; }
  if(current()) renderQueue(sid);
}
async function cancelQueueJob(sid, jobId){
  if(sid.includes("::")) return;
  const state = queueState(sid);
  if(state.cancelling.has(jobId)) return;
  const route = routeGeneration;
  state.cancelling.add(jobId); state.generation++; state.notice = ""; renderQueue(sid);
  try{
    const r = await fetchT("/sessions/" + encodeURIComponent(sid) + "/jobs/" + encodeURIComponent(jobId) + "/cancel", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"});
    const data = await r.json();
    if(!r.ok || data.error) throw Error(r.status === 409 ? "已开始执行，未取消" : data.error || "HTTP " + r.status);
    state.notice = "已取消";
    reconcileJob(sid, {...data, id: jobId, status: "cancelled"});
  }catch(e){ state.notice = "取消失败：" + e.message; }
  finally{
    state.cancelling.delete(jobId); state.generation++;
    if(route === routeGeneration && queueMatch(sid)){ renderQueue(sid); await loadQueue(sid); }
  }
}
function reconcileJob(sid, job, expectedToken){
  const terminal = ["done", "failed", "cancelled"].includes(job.status);
  if(!terminal && !["running", "queued"].includes(job.status)) return;
  if(job.status === "failed" || job.status === "cancelled") discardEchoPredecessor(sid, job.id);
  const latest = sendJobs[sid];
  if(!latest || latest.jobId !== job.id || expectedToken != null && latest.token !== expectedToken) return;
  // 同一个任务终态不可逆，旧快照/旧单 job 回包不能复活或改写它。
  if(["done", "failed", "cancelled"].includes(latest.status)) return;
  const token = latest.token;
  Object.assign(latest, {status: job.status, result: job.result, error: job.error});
  if(terminal){
    if(job.status === "failed") markEchoFailed(sid, token);
    else settleEcho(sid, token);
    latest.token = submissionToken = Math.max(submissionToken, Number(token) || 0) + 1;
  }

}
function discardEchoPredecessor(sid, jobId){
  for(let echo = pendingEcho[sid]; echo?.previous; ){
    if(echo.previous.jobId === jobId) echo.previous = echo.previous.previous;
    else echo = echo.previous;
  }
}
function ownsSubmission(key, token){ return sendJobs[key]?.token === token; }
function moveSubmission(source, target, token){
  if(!ownsSubmission(source, token)) return false;
  const job = sendJobs[source], echo = pendingEcho[source];
  delete sendJobs[source];
  if(echo?.token === token) delete pendingEcho[source];
  // 无论目标是否可接管，自己拥有的源槽都已释放。
  if(sendJobs[target] && !ownsSubmission(target, token)) return false;
  sendJobs[target] = job;
  if(echo?.token === token && (!pendingEcho[target] || pendingEcho[target].token === token)) pendingEcho[target] = echo;
  return true;
}
function submissionEcho(key, text, token, jobId){
  // after 是提交前的消息末尾；分页前插时同步 shift，不匹配历史同文。
  const after = convState.id === key ? Math.max(convState.total || 0, convState.cursor || 0) : 0;
  const previous = pendingEcho[key];
  return {text, token, jobId, after, submittedAt: Date.now() / 1000,
    previous: previous && !previous.failed && previous.text.trim() === text.trim()
      && echoVisible(convState.id === key ? convState.msgs : [], previous) ? previous : null};
}

/* ---------- 远程发消息 / 托管 ---------- */
function fetchT(url, opts = {}, ms = 30000){
  // 带超时的 fetch：请求排不上队或连接被占满时直接报"超时"，而不是永远挂在"发送中…"
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, {...opts, signal: c.signal}).finally(() => clearTimeout(t));
}

function sendJobText(id){
  // 状态从模块级 sendJobs 读取，而不是闭包里的 DOM 引用——
  // 自动刷新会整体重渲染对话视图，旧引用会指向已替换的节点导致界面停在"发送中…"
  const j = sendJobs[id];
  if(!j) return "";
  // 斜杠命令用命令本身做状态前缀，和普通消息的"发送中/Claude 正在处理"区分开
  const cmd = typeof j.text === "string" && j.text.trim().startsWith("/")
    ? "命令 " + j.text.trim().split(/\s+/)[0] : "";
  if(j.status === "sending") return cmd ? `${cmd} 发送中…` : "发送中…";
  if(j.status === "queued") return cmd ? `${cmd} 排队中…` : "排队中…";
  if(j.status === "running") return cmd ? `正在执行${cmd}…` : "Claude 正在处理…";
  if(j.status === "done") return "已完成，回复见下方对话";
  if(j.status === "cancelled") return "已取消";
  if(j.status === "unknown") return j.error || "状态查询未知，任务可能仍在执行";
  if(j.status === "failed") return "失败: " + (j.error || "未知错误");
  return "";
}
function echoVisible(messages, echo){
  if(!echo || !echo.text || !messages) return false;
  if(echo.failed) return true; // 失败回显是错误反馈，不由普通转录对账消费。
  // 同文连续提交需要不同的新消息确认；前一条未对账时，不能借它的转录清除后一条。
  const waiting = [];
  for(let e = echo; e; e = e.previous) if(!e.failed && e.text.trim() === echo.text.trim()) waiting.unshift(e);
  let next = Math.max(0, messages.length - Math.max(20, waiting.length));
  for(const e of waiting){
    const first = e.after == null ? 0 : Math.max(0, e.after - (convState.start || 0));
    let found = false;
    for(let i = Math.max(next, first); i < messages.length; i++){
      const m = messages[i];
      if(e.submittedAt && m.ts && m.ts < e.submittedAt) continue;
      const matches = (m.parts || []).some(p =>
        p.type === "command" && (p.command + (p.args ? " " + p.args : "")) === e.text.trim()
        || m.role === "user" && p.type === "text" && (p.text || "").trim() === e.text.trim());
      if(matches){ found = true; next = i + 1; break; }
    }
    if(!found) return true;
  }
  return false;
}
function echoHtml(echo){
  return `<div class="msg user pending${echo.failed ? " failed" : ""}">` +
    `<div class="mhead">用户 · ${echo.failed ? "发送失败" : "发送中…"}</div>` +
    `<div class="ubody">${esc(echo.text)}</div></div>`;
}
function markEchoFailed(key, token){
  // token 守卫：即使文本相同，旧任务也不能修改后续发送的回显；
  // 标红后立刻重渲染，不等下一次定时刷新
  const e = pendingEcho[key];
  if(e && e.token === token && !e.failed){
    e.failed = true;

function settleEcho(key, token){
  // job 到达非 failed 终态时消息必已落盘：未对账的回显直接清除兜底

  const e = pendingEcho[key];

}
function panelMatch(id){
  // 当前显示的面板是否属于该任务 key：后台轮询循环在用户切走后仍会存活，
  // 不检查就会把 A 会话的状态写进 B 会话/新建会话的输入区、禁用它们的按钮
  if(!curPanel) return false;
  if(curPanel.type === "conv") return curPanel.key === id;
  if(curPanel.type === "new") return id === "new:" + curPanel.key;

}
function updateSendSt(id){

  // 否则连点会创建多个新会话，所以新建面板继续锁住。
  const newPanel = curPanel && curPanel.type === "new";

/* ---------- 新建会话（不依赖已有历史；可选托管常驻进程或每次独立运行） ---------- */
function renderNewSession(p){

function bindNewBox(p){

  wireCommandHints(document.getElementById("msgbox"), () => newCommands.list);
  const hostcb = document.getElementById("hostcb"),
        newEffortSel = document.getElementById("effortsel");

    hostcb.addEventListener("change", syncEffort);

  }

    const submitted = captureMessageDraft(key), text = submitted.rawText.trim();

    const useHost = document.getElementById("hostcb").checked;
    const approval = document.getElementById("approvalsel")?.value || "full";
    const effort = newEffortSel && !newEffortSel.disabled ? newEffortSel.value : "default";
    const selectedModel = modelSnapshot(key);
    if(selectedModel === undefined) return;
    const token = ++submissionToken;
