      const dReq = fetchT("/sessions/" + encodeURIComponent(id));
      const mReq = fetchT(`/sessions/${encodeURIComponent(id)}/messages?limit=100`);
      mReq.catch(() => {});   // 详情侧提前返回时消息请求不得变成未处理拒绝
      const dRes = await dReq;
      const d = await dRes.json();
      if(!current()) return;   // 已切换走
      if(!dRes.ok){
        if(isNew) main.innerHTML = `<div class="empty">会话详情加载失败（HTTP ${dRes.status}），稍候自动重试…</div>`;
        return;
      }
      if(d.error){   // 转录尚未被轮询发现（常见于刚创建的会话）
        if(isNew) main.innerHTML = '<div class="empty">会话转录尚未就绪，稍候自动刷新…</div>';
        return;
      }
      let m = null, mErr = "";
      try{
        const mRes = await mReq;
        m = await mRes.json();
        if(!mRes.ok || m.error) mErr = (m && m.error) || `HTTP ${mRes.status}`;
      }catch(e){ mErr = e.message || String(e); }   // 超时/断网：报给用户，等下一轮重试
      if(!current()) return;
      // 刷新拉取失败但已有渲染内容：保留现有消息，只更新头部/审批，不打扰阅读
      const keepOld = mErr && convState.id === id && convState.msgs.length > 0;
      if(!keepOld)
        convState = {id: mErr ? null : id, msgs: (m && m.messages || []).slice(),
                     total: (m && m.total) || 0, cursor: (m && m.end) || 0,
                     start: (m && m.start) || 0, size: (m && m.size) || 0,
                     hasMore: !!(m && m.has_more), loadingEarlier: false, detail: null};
      if(isNew){
        main.innerHTML = `
          <div class="conv-top">
            <div class="conv-head">
              <button class="back" id="back" aria-label="返回项目列表"
                      title="返回项目列表">←<span class="back-label"> 返回</span></button>
              <h2>
                <span class="b ${d.state}" id="statebadge">${STATE_ZH[d.state] || d.state}</span>
                ${d.hosted ? '<span class="chip" title="该会话由常驻进程托管">⚙<span class="chip-label"> 托管中</span></span>' : ""}${rateLimitChip(d)}
                <span id="detailtitle">${esc(sessTitle(mergeMetadata(d)))}</span>
                <span class="mut conv-cwd">${esc(d.cwd || "")}</span></h2>
              <button class="back" id="zenbtn" title="沉浸模式：隐藏顶部栏与概览，扩大消息区"
                      aria-label="沉浸模式：隐藏顶部栏与概览，扩大消息区" aria-pressed="false">⛶<span class="back-label"> 沉浸</span></button>
            </div>
            <div id="overviewwrap">${overviewHtml(mergeMetadata(d))}</div>
            <div id="interactions"></div>
            <div id="apierr" class="apierr" style="display:none"></div>
          </div>
          <div id="bgstrip" hidden></div>
          <div id="conv"></div>
          ${composerHtml("conv", d)}`;
        toggleTplPop(false);
        const backBtn = document.getElementById("back");
        backBtn.onclick = () => {
          navigate(sessionReturn || {project: view.project, session: null, new: false});
        };
        // 返回目标按来源动态化（直链/刷新进入没有来源，标注默认的项目列表）
        const backTarget = sessionReturn && sessionReturn.pending ? "待处理列表"
          : sessionReturn && sessionReturn.hosted ? "托管列表" : "项目列表";
        backBtn.setAttribute("aria-label", "返回" + backTarget);
        backBtn.title = "返回" + backTarget;
        // 沉浸按钮点亮与点击都绑定当前视觉态（applyZen 已按偏好算好 body.zen）
        const zenBtn = document.getElementById("zenbtn");
        if(zenBtn){
          const zenOn = () => !!(document.body && document.body.classList
            && document.body.classList.contains("zen"));
          zenBtn.classList.toggle("on", zenOn());
          zenBtn.setAttribute("aria-pressed", zenOn() ? "true" : "false");
          zenBtn.onclick = () => setZen(!zenOn());
        }
        // 输入区由 bindMessageDraft 按目标 key 恢复，不从其他面板复制。
        bindSendBox(id, d);
        curPanel = {type: "conv", key: id};
        bindModel(id, d.selected_model);
        loadModelOptions(id, d.cwd);
        connectSessionSse(id);
      }
      // 返回尚未替换的旧面板时仅同步过期草稿；请求期间 input 已更新版本则不碰输入框。
      const box = document.getElementById("msgbox");
      if(!isNew && (box?.dataset.draftKey !== id
         || Number(box.dataset.draftVersion) !== messageDrafts.get(id)?.version)) bindMessageDraft(id);
      const detailChanged = applySessionDetail(d);
      loadQueue(id);
      renderInteractions(d.interactions || []);
      updateHostedControls(d);
      if(keepOld){ if(detailChanged) renderConvList(); return; }   // 消息保留，仅状态变化时重绘
      clearLiveBubble();
      renderConvList();
      if(mErr){   // 消息没取到：框架已在，把失败原因摆在消息区里，而不是整页空白
        const convEl = document.getElementById("conv");
        if(convEl) convEl.innerHTML = `<div class="empty">消息加载失败：${esc(mErr)}，稍候自动重试…</div>`;
      }
      if(isNew){
        updateSendSt(id);   // 恢复进行中任务的状态显示（需先设 curPanel，面板守卫才放行）
        scrollConvBottom();   // 聊天窗口：进入时停在最新消息
      }
      confirmDisplayedMessages(id, requestEnd);
      return;
    }

    // 同面板刷新：只更新数据区域，不重建输入区
    const dRes = await fetchT("/sessions/" + encodeURIComponent(id));
    const d = await dRes.json();
    if(!current()) return;
    if(!dRes.ok || d.error) return;
    const detailChanged = applySessionDetail(d);
    loadQueue(id);
    renderInteractions(d.interactions || []);
    updateHostedControls(d);
    updateSendSt(id);
    let requestEnd = turnEndHighWater.get(id) || 0;
    const mRes = await fetchT(`/sessions/${encodeURIComponent(id)}/messages` +
      `?from=${convState.cursor}&limit=500`);
    const m = await mRes.json();
    if(!mRes.ok || m.error || !current()) return;
    if(convState.id !== id || m.size < convState.size || m.total < convState.total){
      // 文件被截断/替换：重新取最近一页
      requestEnd = turnEndHighWater.get(id) || 0;
      const freshRes = await fetchT(`/sessions/${encodeURIComponent(id)}/messages?limit=100`);
      const fresh = await freshRes.json();
      if(!freshRes.ok || fresh.error || !current()) return;
      convState = {id, msgs: (fresh.messages || []).slice(),
                   total: fresh.total || 0, cursor: fresh.end || 0,
                   start: fresh.start || 0, size: fresh.size || 0,
                   hasMore: !!fresh.has_more, loadingEarlier: false, detail: null};
      renderConvList();
      scrollConvBottom();
    } else if(m.messages && m.messages.length){
      const convEl = document.getElementById("conv");
      // 贴底时新消息自动跟底；正在翻看历史时不打扰
      const nearBottom = !convEl || convEl.scrollHeight - convEl.scrollTop - convEl.clientHeight < 80;
      convState.msgs.push(...m.messages);
      convState.total = m.total;
      convState.cursor = m.end;
      convState.size = m.size;
      clearLiveBubble();
      renderConvList();
      if(nearBottom) scrollConvBottom();
    } else {
      convState.total = m.total;
      convState.cursor = m.end != null ? m.end : convState.cursor;
      convState.size = m.size;
      // 只有 detail 状态变化时才重绘：会话从 working 转 idle、异步 Agent 收尾时
      // 工具/子代理卡的状态来自 detail，而普通轮询不应全量重算签名。
      if(detailChanged){
        const convEl = document.getElementById("conv");
        const oldHeight = convEl ? convEl.scrollHeight : 0;
        const oldScroll = convEl ? convEl.scrollTop : 0;
        const nearBottom = !convEl
          || convEl.scrollHeight - convEl.scrollTop - convEl.clientHeight < 80;
        renderConvList();
        if(convEl){
          // 只换状态不新增消息：贴底时继续贴底，否则按高度差补偿视野
          convEl.scrollTop = nearBottom ? convEl.scrollHeight
            : oldScroll + (convEl.scrollHeight - oldHeight);
        }
      }
    }
    confirmDisplayedMessages(id, requestEnd);
  }catch(e){
    // 渲染链路异常不能静默吞掉：至少留下控制台线索，页面在下一轮刷新重试
    if(typeof console !== "undefined" && console.error) console.error("会话视图渲染失败:", e);
  }
  finally{ if(convLoading === request) convLoading = null; }
}

/* ---------- 独立发送队列：服务端快照是事实，GET 与取消各自防乱序 ---------- */
const queueStates = new Map();
let routeGeneration = 0, submissionToken = 0;
function queueState(sid){
  if(!queueStates.has(sid)) queueStates.set(sid, {generation: 0, snapshot: null, error: "", notice: "", pop: null, cancelling: new Set()});
  return queueStates.get(sid);
}
function queueMatch(sid){ return view.session === sid && !view.new && panelMatch(sid); }
function queueJobHtml(job, kind, sid){
  const state = queueState(sid), status = {running: "执行中", queued: "等待中", done: "已完成", failed: "失败", cancelled: "已取消"}[job.status] || job.status || "";
  const position = kind === "queued" ? (job.position == null ? "待派发" : "FIFO #" + job.position) : status;
  return `<div class="queue-job" data-job-id="${esc(job.id)}"><div><b>${esc(position)}</b> · ${esc(status)}
    ${kind === "queued" && job.cancellable ? `<button class="back" data-cancel-job="${esc(job.id)}" data-sid="${esc(sid)}" ${state.cancelling.has(job.id) ? "disabled" : ""}>取消此项</button>` : ""}</div>
    <div class="queue-text">${esc(job.text || "")}</div><div class="mut">请求模型：${esc(job.requested_model || "默认")} · 提交时间：${job.created_at ? esc(new Date(job.created_at * 1000).toLocaleString()) : "未知"}</div>
    ${job.error ? `<div class="terror">${esc(job.error)}</div>` : ""}</div>`;
}
function queuePopHtml(sid){
  const state = queueState(sid), data = state.snapshot;
  const running = data?.running || [], queued = data?.queued || [], recent = data?.recent || [];
  return `<div class="mut" style="margin:0 0 4px">仅保留本次服务进程的有限历史，重启不恢复。</div>` +
    (state.error ? `<div class="terror" role="status">${esc(state.error)}</div>` : "") +
    (state.notice ? `<div role="status">${esc(state.notice)}</div>` : "") +
    (!data ? '<div class="mut">队列尚未加载</div>' :
      `<h5>执行中 (${running.length})</h5>${running.map(j => queueJobHtml(j, "running", sid)).join("")}
       <h5>等待发送 (${queued.length})</h5>${queued.map(j => queueJobHtml(j, "queued", sid)).join("")}
       ${!running.length && !queued.length ? '<div class="mut">暂无执行或等待项</div>' : ""}
       <details class="fold"${detailsAttrs("queue:" + sid + ":recent")}><summary>最近结束 (${recent.length})</summary>${recent.map(j => queueJobHtml(j, "recent", sid)).join("")}</details>`);
}
function hideQueuePop(){
  const pop = document.getElementById("queuepop");
  if(pop){ pop.hidden = true; pop.innerHTML = ""; }
}
function positionQueuePop(){
  const pop = document.getElementById("queuepop"), chip = document.getElementById("queue");
  if(!pop || pop.hidden || !chip) return;
  const rect = chip.getBoundingClientRect && chip.getBoundingClientRect();
  const root = document.documentElement;
  const vw = root ? root.clientWidth : 0, vh = root ? root.clientHeight : 0;
  if(!rect || !vw || !vh) return;   // 无布局环境（单测假 DOM）时只展示不定位
  const w = pop.offsetWidth || 0, h = pop.offsetHeight || 0;
  let left = Math.min(Math.max(8, rect.right - w), vw - w - 8);
  let top = rect.top - h - 6;   // 优先浮在 chip 上方，放不下再向下
  if(top < 8) top = Math.min(rect.bottom + 6, Math.max(8, vh - h - 8));
  pop.style.left = Math.round(left) + "px";
  pop.style.top = Math.round(top) + "px";
}
function showQueuePop(sid, mode){   // 目前只有 "pinned"（点击展开）
  queueState(sid).pop = mode;
  refreshQueuePop(sid);
}
function closeQueuePop(sid){
  if(queueStates.has(sid)) queueState(sid).pop = null;
  hideQueuePop();
}
function toggleQueuePop(sid){
  if(!sid) return;
  if(queueState(sid).pop) closeQueuePop(sid);
  else showQueuePop(sid, "pinned");
}
function refreshQueuePop(sid){
  const pop = document.getElementById("queuepop"), chip = document.getElementById("queue");
  if(!pop || !queueState(sid).pop || !queueMatch(sid) || !chip || chip.hidden){ hideQueuePop(); return; }
  pop.innerHTML = queuePopHtml(sid);
  pop.hidden = false;
  positionQueuePop();
}
function renderQueue(sid){
  if(sid.includes("::")) return;
  const el = document.getElementById("queue");
  if(!el) return;
  if(!queueMatch(sid)){ closeQueuePop(sid); return; }
  const state = queueState(sid), data = state.snapshot;
  const running = data?.running || [], queued = data?.queued || [];
  // 无执行/等待且无错误/通知时不占发送区的空间；摘要行常驻在模型选择行，
  // 详情浮层挂 body 顶层，只能点击 chip 展开/收起
  const show = running.length || queued.length || state.error || state.notice;
  el.hidden = !show;
  if(!show){ state.pop = null; hideQueuePop(); return; }
  const bits = [];
  if(running.length) bits.push(`▶ 执行中 ${running.length}`);
  if(queued.length) bits.push(`⏳ 等待 ${queued.length}`);
  if(state.error) bits.push("⚠ 队列查询失败");
  if(state.notice) bits.push(state.notice);
  el.innerHTML = `<span class="queue-summary">${bits.join(" · ")}</span>`;
  refreshQueuePop(sid);
}
/* ---------- 提示词模板：发送框旁「模板」浮层 ---------- */
const TPL_TITLE_MAX = 80, TPL_TEXT_MAX = 20000, TPL_PREVIEW_CHARS = 240;
const tplPop = {open:false, loading:false, error:"", list:[], query:"",
                editing:null, formError:"", note:"", saving:false, deleting:null};
let tplPopClickInside = false;   // 浮层内点击会重渲染，目标可能脱离 DOM，外点判定要豁免本次点击

function templateTitleFromText(text){
  const trimmed = String(text ?? "").trim();
  if(!trimmed) return "";
  // 按码点截断，避免把 emoji 的代理对切成孤立高位
  return Array.from(trimmed.split(/\r?\n/)[0].trim()).slice(0, 40).join("");
}
function insertTemplateText(value, start, end, text){
  const base = String(value ?? ""), insert = String(text ?? "");
  let a = Number.isFinite(start) ? Math.trunc(start) : base.length;
  let b = Number.isFinite(end) ? Math.trunc(end) : a;
  a = Math.max(0, Math.min(a, base.length));
  b = Math.max(0, Math.min(b, base.length));
  if(a > b){ const t = a; a = b; b = t; }
  return {value: base.slice(0, a) + insert + base.slice(b), cursor: a + insert.length};
}
function templateFilter(list, query){
  const q = String(query ?? "").trim().toLowerCase();
  if(!q) return (list || []).slice();
  return (list || []).filter(t =>
    (String(t.title ?? "") + "\n" + String(t.text ?? "")).toLowerCase().includes(q));
}
function tplItemHtml(t){
  const id = esc(t.id), deleting = tplPop.deleting === t.id;
  const chars = Array.from(String(t.text ?? ""));

    + (chars.length > TPL_PREVIEW_CHARS ? "…" : "");
  return `<div class="tplitem"><div class="tpltitle" data-tpl-insert="${id}">${esc(t.title)}</div>
    <div class="tpltext" data-tpl-insert="${id}">${esc(preview)}</div>

      <button class="back" data-tpl-edit="${id}">编辑</button>

function tplListHtml(){

function visibleViewportRect(){
  // iOS 键盘弹出时布局视口不缩，visualViewport 才是可见区域；无该 API 时退回布局视口。
  const vv = (typeof window !== "undefined") && window.visualViewport;
  if(vv && vv.width && vv.height)
    return {left:vv.offsetLeft || 0, top:vv.offsetTop || 0,
            width:vv.width, height:vv.height};
  const root = document.documentElement;
  return {left:0, top:0, width:root ? root.clientWidth : 0,
          height:root ? root.clientHeight : 0};
}
function positionTplPop(){
  const pop = document.getElementById("tplpop"), btn = document.getElementById("tplbtn");
  if(!pop || pop.hidden || !btn) return;
  const rect = btn.getBoundingClientRect && btn.getBoundingClientRect();
  const vp = visibleViewportRect();
  if(!rect || !vp.width || !vp.height) return;   // 无布局环境（单测假 DOM）时只展示不定位
  // 键盘弹出时布局视口的 70vh 可能高于可见区域，按 visualViewport 收紧高度上限
  pop.style.maxHeight = Math.max(120, Math.min(520, Math.round(vp.height * 0.7))) + "px";
  const w = pop.offsetWidth || 0, h = pop.offsetHeight || 0;
  let left = Math.min(Math.max(vp.left + 8, rect.right - w),
                      vp.left + vp.width - w - 8);
  let top = rect.top - h - 6;   // 输入区在底部，优先向上展开
  if(top < vp.top + 8)
    top = Math.min(rect.bottom + 6, Math.max(vp.top + 8, vp.top + vp.height - h - 8));
  pop.style.left = Math.round(left) + "px";
  pop.style.top = Math.round(top) + "px";
}

  box.value = result.value;
  if("selectionStart" in box) box.selectionStart = box.selectionEnd = result.cursor;
  if(box.focus) box.focus();
  notifyComposerInput(box);
  autosizeComposer(box);
  toggleTplPop(false);
}

async function saveTemplateEditor(){

}
async function loadQueue(sid){
  if(sid.includes("::")) return;
  const state = queueState(sid), generation = ++state.generation, route = routeGeneration;
  const current = () => generation === state.generation && route === routeGeneration && queueMatch(sid);
  try{
    const r = await fetchT("/sessions/" + encodeURIComponent(sid) + "/jobs");
    const data = await r.json();
    if(!current()) return;
    if(!r.ok || data.error) throw Error(data.error || "HTTP " + r.status);
    if(data.session !== sid || ![data.running, data.queued, data.recent].every(Array.isArray)) throw Error("队列响应无效");
    state.snapshot = data; state.error = "";
    for(const job of [...data.running, ...data.queued, ...data.recent]) reconcileJob(sid, job);
  }catch(e){ if(current()) state.error = "队列查询失败（保留上次快照）：" + e.message; }
  if(current()) renderQueue(sid);
}
async function cancelQueueJob(sid, jobId){
  if(sid.includes("::")) return;
  const state = queueState(sid);
  if(state.cancelling.has(jobId)) return;
  const route = routeGeneration;
  state.cancelling.add(jobId); state.generation++; state.notice = ""; renderQueue(sid);
  try{
    const r = await fetchT("/sessions/" + encodeURIComponent(sid) + "/jobs/" + encodeURIComponent(jobId) + "/cancel", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"});
    const data = await r.json();
    if(!r.ok || data.error) throw Error(r.status === 409 ? "已开始执行，未取消" : data.error || "HTTP " + r.status);
    state.notice = "已取消";
    reconcileJob(sid, {...data, id: jobId, status: "cancelled"});
  }catch(e){ state.notice = "取消失败：" + e.message; }
  finally{
    state.cancelling.delete(jobId); state.generation++;
    if(route === routeGeneration && queueMatch(sid)){ renderQueue(sid); await loadQueue(sid); }
  }
}
function reconcileJob(sid, job, expectedToken){
  const terminal = ["done", "failed", "cancelled"].includes(job.status);
  if(!terminal && !["running", "queued"].includes(job.status)) return;
  if(job.status === "failed" || job.status === "cancelled") discardEchoPredecessor(sid, job.id);
  const latest = sendJobs[sid];
  if(!latest || latest.jobId !== job.id || expectedToken != null && latest.token !== expectedToken) return;
  // 同一个任务终态不可逆，旧快照/旧单 job 回包不能复活或改写它。
  if(["done", "failed", "cancelled"].includes(latest.status)) return;
  const token = latest.token;
  Object.assign(latest, {status: job.status, result: job.result, error: job.error});
  if(job.status === "done" || job.status === "cancelled") latest.finishedAt = Date.now();
  if(terminal){
    if(job.status === "failed") markEchoFailed(sid, token);
    else settleEcho(sid, token);
    latest.token = submissionToken = Math.max(submissionToken, Number(token) || 0) + 1;
  }
  updateSendSt(sid);
  // 到点重算一次状态，让“已完成/已取消”胶囊按时消失（平时没有刷新时也能收掉）
  if(job.status === "done" || job.status === "cancelled"){
    const finished = latest;
    setTimeout(() => { if(sendJobs[sid] === finished) updateSendSt(sid); },
      SEND_DONE_HIDE_MS + 50);
  }
}
function discardEchoPredecessor(sid, jobId){
  for(let echo = pendingEcho[sid]; echo?.previous; ){
    if(echo.previous.jobId === jobId) echo.previous = echo.previous.previous;
    else echo = echo.previous;
  }
}
function ownsSubmission(key, token){ return sendJobs[key]?.token === token; }
function moveSubmission(source, target, token){
  if(!ownsSubmission(source, token)) return false;
  const job = sendJobs[source], echo = pendingEcho[source];
  delete sendJobs[source];
  if(echo?.token === token) delete pendingEcho[source];
  // 无论目标是否可接管，自己拥有的源槽都已释放。
  if(sendJobs[target] && !ownsSubmission(target, token)) return false;
  sendJobs[target] = job;
  if(echo?.token === token && (!pendingEcho[target] || pendingEcho[target].token === token)) pendingEcho[target] = echo;
  return true;
}
function submissionEcho(key, text, token, jobId, images = []){
  // after 是提交前的消息末尾；分页前插时同步 shift，不匹配历史同文。
  // noHistory 表示提交时面板里还没有任何消息，此时任何匹配文本的新消息都只能是本次发送。
  const known = convState.id === key
    ? Math.max(convState.total || 0, convState.cursor || 0,
               (convState.msgs || []).length) : 0;
  const after = known;
  const previous = pendingEcho[key];
  return {text, images, token, jobId, after, noHistory: !known,
    submittedAt: Date.now() / 1000,
    previous: previous && !previous.failed && previous.text.trim() === text.trim()
      && echoVisible(convState.id === key ? convState.msgs : [], previous) ? previous : null};
}

/* ---------- 远程发消息 / 托管 ---------- */
function fetchT(url, opts = {}, ms = 30000){
  // 带超时的 fetch：请求排不上队或连接被占满时直接报"超时"，而不是永远挂在"发送中…"
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, {...opts, signal: c.signal}).finally(() => clearTimeout(t));
}

function sendJobText(id){
  // 状态从模块级 sendJobs 读取，而不是闭包里的 DOM 引用——
  // 自动刷新会整体重渲染对话视图，旧引用会指向已替换的节点导致界面停在"发送中…"
  const j = sendJobs[id];
  if(!j) return "";
  // 斜杠命令用命令本身做状态前缀，和普通消息的"发送中/Claude 正在处理"区分开
  const cmd = typeof j.text === "string" && j.text.trim().startsWith("/")
    ? "命令 " + j.text.trim().split(/\s+/)[0] : "";
  if(j.status === "sending") return cmd ? `${cmd} 发送中…` : "发送中…";
  if(j.status === "queued") return cmd ? `${cmd} 排队中…` : "排队中…";
  if(j.status === "running") return cmd ? `正在执行${cmd}…` : "Claude 正在处理…";
  // 完成提示只在输入区上方短暂浮现，不占用发送区高度
  if(j.status === "done")
    return j.finishedAt && Date.now() - j.finishedAt < SEND_DONE_HIDE_MS ? "已完成" : "";
  if(j.status === "cancelled")
    return j.finishedAt && Date.now() - j.finishedAt < SEND_DONE_HIDE_MS ? "已取消" : "";
  if(j.status === "unknown") return j.error || "状态查询未知，任务可能仍在执行";
  if(j.status === "failed") return "失败: " + (j.error || "未知错误");
  return "";
}
function echoVisible(messages, echo){
  if(!echo || (!echo.text && !(echo.images || []).length) || !messages) return false;
  if(echo.failed) return true; // 失败回显是错误反馈，不由普通转录对账消费。
  // 同文连续提交需要不同的新消息确认；前一条未对账时，不能借它的转录清除后一条。
  const waiting = [];
  for(let e = echo; e; e = e.previous) if(!e.failed && e.text.trim() === echo.text.trim()) waiting.unshift(e);
  // 有提交水位（after）时必须以水位为扫描下界。繁忙回合两次刷新之间很容易追加
  // 20 条以上助手消息，若再用“末尾 20 条”截断，真实 user 消息会落在窗口外，
  // 回显永远停在“发送中…”。末尾窗口只兜底没有水位的旧数据。
  const tail = Math.max(0, messages.length - Math.max(20, waiting.length));
  let next = 0;
  for(const e of waiting){
    const first = e.after == null ? 0 : Math.max(0, e.after - (convState.start || 0));
    let found = false;
    for(let i = Math.max(next, first, e.after == null ? tail : 0); i < messages.length; i++){
      const m = messages[i];
      // 有水位（after）时只按位置对账；仅当提交前没有任何消息可作参照时，
      // 才用 submittedAt 排除更早的同文历史。手机时钟偏差会让真实消息 ts 早于
      // submittedAt，不能在所有情况下都拿两者比较，否则回显会与消息重复显示。
      if(!e.after && !e.noHistory && e.submittedAt && m.ts && m.ts < e.submittedAt) continue;
      const matches = (m.parts || []).some(p =>
        p.type === "command" && (p.command + (p.args ? " " + p.args : "")) === e.text.trim()
        || m.role === "user" && p.type === "text" && (p.text || "").trim() === e.text.trim()
        || m.role === "user" && p.type === "image" && !e.text.trim() && (e.images || []).length);
      if(matches){ found = true; next = i + 1; break; }
    }
    if(!found) return true;
  }
  return false;
}
function echoHtml(echo){
  return `<div class="msg user pending${echo.failed ? " failed" : ""}">` +
    `<div class="mhead">用户 · ${echo.failed ? "发送失败" : "发送中…"}</div>` +
    `<div class="ubody">${esc(echo.text)}</div>` +
    (echo.images || []).map(image => imageHtml(image, image.name || "待发送图片")).join("") + `</div>`;
}
function markEchoFailed(key, token){
  // token 守卫：即使文本相同，旧任务也不能修改后续发送的回显；
  // 标红后立刻重渲染，不等下一次定时刷新
  const e = pendingEcho[key];
  if(e && e.token === token && !e.failed){
    e.failed = true;
    if(queueMatch(key) && convState.id === key) renderConvList();
  }
}
function settleEcho(key, token){
  // job 到达非 failed 终态时消息必已落盘：未对账的回显直接清除兜底
  // （超长命令被后端截断、对账永不命中的场景），避免永久停在“发送中…”
  const e = pendingEcho[key];
  if(e && e.token === token && !e.failed){
    delete pendingEcho[key];
    if(queueMatch(key) && convState.id === key) renderConvList();
  }
}
function panelMatch(id){
  // 当前显示的面板是否属于该任务 key：后台轮询循环在用户切走后仍会存活，
  // 不检查就会把 A 会话的状态写进 B 会话/新建会话的输入区、禁用它们的按钮
  if(!curPanel) return false;
  if(curPanel.type === "conv") return curPanel.key === id;
  if(curPanel.type === "new") return id === "new:" + curPanel.key;
  return false;
}
function updateSendSt(id){
  if(!panelMatch(id)) return;
  const st = document.getElementById("sendst");
  const images = imageDraft(id);
  if(st) st.textContent = images.pending ? "图片读取中…" : (images.error || sendJobText(id));
  const btn = document.getElementById("sendbtn");
  const j = sendJobs[id];
  // 对话视图里 running/queued 仍可继续发送：托管会话会排队；新建会话必须先拿到 sid，
  // 否则连点会创建多个新会话，所以新建面板继续锁住。
  const newPanel = curPanel && curPanel.type === "new";
  if(btn) btn.disabled = images.pending > 0 || !!j && (j.status === "sending"
    || (newPanel && ["queued", "running"].includes(j.status)));
}
let sendStFlashTimer = null;
function flashSendSt(id, text, ms = 4000){
  // 配置类瞬时提示（审批/思考档位已保存）也走浮动胶囊，几秒后回落任务状态，
  // 避免提示一直悬在对话底部；只清理自己写入的文本，不覆盖后续发送状态。
  const st = document.getElementById("sendst");
  if(!st) return;
  st.textContent = text;
  clearTimeout(sendStFlashTimer);
  sendStFlashTimer = setTimeout(() => {
    const el = document.getElementById("sendst");
    if(!el || el.textContent !== text) return;
    const images = imageDraft(id);
    el.textContent = images.pending ? "图片读取中…" : (images.error || sendJobText(id));
  }, ms);
}

/* ---------- 新建会话（不依赖已有历史；可选托管常驻进程或每次独立运行） ---------- */
function renderNewSession(p){
  const main = document.getElementById("main");
  if(curPanel && curPanel.type === "new" && curPanel.key === p.cwd && document.getElementById("msgbox")){
    updateSendSt("new:" + p.cwd);   // 面板已在页面上：只更新状态行，不动输入框
    return;
  }
  main.innerHTML = `
    <button class="back" id="back">← 返回列表</button>
    <h2 style="font-size:16px;margin:8px 0">新建会话 <span class="mut">${esc(p.cwd)}</span></h2>
    ${composerHtml("new", {})}`;
  toggleTplPop(false);
  document.getElementById("back").onclick = () => {
    navigate({project: view.project, session: null, new: false});
  };
  // 输入区由 bindMessageDraft 按目标 key 恢复，不从其他面板复制。
  bindNewBox(p);
  curPanel = {type: "new", key: p.cwd};
  bindModel("new:" + p.cwd, null);
  loadModelOptions("new:" + p.cwd, p.cwd);
  updateSendSt("new:" + p.cwd);   // 恢复进行中任务的状态显示（需先设 curPanel，面板守卫才放行）
}

function bindNewBox(p){
  const btn = document.getElementById("sendbtn");
  if(!btn) return;
  const key = "new:" + p.cwd;
  wireImageComposer(key);
  bindComposerKeys();
  const newCommands = {list: []};
  loadProjectCommands(p.cwd).then(list => { newCommands.list = list; });
  wireCommandHints(document.getElementById("msgbox"), () => newCommands.list);
  const hostcb = document.getElementById("hostcb"),
        newEffortSel = document.getElementById("effortsel");
  if(hostcb && newEffortSel){
    const syncEffort = () => { newEffortSel.disabled = !hostcb.checked; };
    hostcb.addEventListener("change", syncEffort);
    syncEffort();
  }
  btn.onclick = async () => {
    imageDraft(key).error = "";
    const submitted = captureMessageDraft(key), text = submitted.rawText.trim();
    const submittedImages = captureImageDraft(key), images = submittedImages.images;
    if(!text && !images.length) return;
    const useHost = document.getElementById("hostcb").checked;
    const approval = document.getElementById("approvalsel")?.value || "full";
    const effort = newEffortSel && !newEffortSel.disabled ? newEffortSel.value : "default";
    const selectedModel = modelSnapshot(key);
    if(selectedModel === undefined) return;
    const token = ++submissionToken;
    sendJobs[key] = {token, status: "sending", requested_model: selectedModel, text};
    const echo = submissionEcho(key, text, token, null, images);   // 时间与窗口属于提交，不属于稍后的 sid 发现。
    let accepted = false;
    const owns = () => ownsSubmission(sid || key, token);
    updateSendSt(key);
    let sid = null, navigationRoute = routeGeneration;
    const enterSession = target => {   // 首次发现及 CLI init 校正均走同一所有权迁移。
      const source = sid || key;
      if(!moveSubmission(source, target, token)) return false;
      if(!modelDrafts[target]) modelDrafts[target] = {...modelDraft(source), value: selectedModel};
      if(!modelProfileOptions[target]) modelProfileOptions[target] = modelProfileOptions[source] || [];
      if(!pendingEcho[target]) pendingEcho[target] = echo;
      const follow = navigationRoute === routeGeneration && (sid ? view.session === sid
        : view.new && view.project === p.cwd);
      sid = target;
      if(follow){
        saveComposerDraft();
        const remaining = messageDrafts.get(source)?.text || "";
        const sourceImages = imageDraft(source), targetImages = imageDraft(sid);
        if(sourceImages.items.length && !targetImages.items.length){
          targetImages.items = sourceImages.items;
          targetImages.version++;
          sourceImages.items = [];
          sourceImages.version++;
        }
        // 只有确实自动导航时迁移；目标已有草稿优先，源草稿保留以免丢失。
        if(remaining && !messageDrafts.get(sid)?.text){
          saveMessageDraft(sid, remaining);
          const cleared = saveMessageDraft(source, "");
          const box = document.getElementById("msgbox");
          if(box?.dataset.draftKey === source){
            box.value = "";
            box.dataset.draftVersion = String(cleared.version);
          }
        }
        // 新建页是一次性入口，用 replace 换成会话地址，返回时直接回到项目列表
        navigate({project: p.cwd, session: sid, new: false}, {replace: true});
        navigationRoute = routeGeneration;
      }
      return true;
    };
    try{
      const r = await fetchT(useHost ? "/hosted" : "/new", {
        method: "POST", headers: {"Content-Type": "application/json"},
        // 非托管 /new 不接受 approval/effort；托管时把对话框里的选择带给首轮进程
        body: JSON.stringify(useHost
          ? {cwd: p.cwd, text, ...(images.length ? {images} : {}), model: selectedModel, approval, effort}
          : {cwd: p.cwd, text, ...(images.length ? {images} : {}), model: selectedModel}),
      }, 30000);
      const j = await r.json();
      if(!owns()) return;
      if(r.status !== 202){
        sendJobs[key] = {token, text, status: "failed", error: j.error || ("HTTP " + r.status)};
        updateSendSt(key); return;
      }
      accepted = true;
      sendJobs[key] = {token, text, jobId: j.job_id, status: j.status || "queued"};
      echo.jobId = j.job_id;
      clearSubmittedDraft(submitted);
      clearSubmittedImages(submittedImages);
      const deadline = Date.now() + SEND_POLL_TIMEOUT_MS;
      for(;;){
        if(!owns()) break;
        if(Date.now() >= deadline){
          sendJobs[sid || key] = {...sendJobs[sid || key], status: "unknown", error: "状态查询超时，任务可能仍在执行"};
          // 查询超时不代表服务端任务失败。
          updateSendSt(sid || key);
          break;
        }
        await new Promise(f => setTimeout(f, 1500));
        // 并行跟踪：任务状态 + 托管进程的 init 事件（后者几秒内就带上新 session id，不用等首轮跑完）
        const [jrRes, hsRes] = await Promise.all([
          fetchT("/jobs/" + encodeURIComponent(j.job_id), {}, 15000),
          useHost && !sid ? fetchT("/hosted", {}, 15000) : Promise.resolve(null),
        ]);
        const jr = await jrRes.json();
        if(!owns()) break;
        if(!jrRes.ok || jr.error && !jr.status) throw Error(jr.error || "HTTP " + jrRes.status);
        const authoritativeSid = jr.session && jr.session !== j.hosted_id ? jr.session : jr.result_session_id;
        if(authoritativeSid && authoritativeSid !== sid){
          if(!enterSession(authoritativeSid)) break;
        }
        if(!sid){
          if(useHost){
            if(!hsRes.ok) throw Error("HTTP " + hsRes.status);
            const h = (await hsRes.json()).find(x => x.hosted_id === j.hosted_id);
            if(!owns()) break;
            if(h && h.session_id){
              if(!enterSession(h.session_id)) break;
            }else if(h && h.status === "exited"){
              sendJobs[key] = {token, text, jobId: j.job_id, status: "failed",
                               error: "claude 进程已退出: " + (h.stderr_tail || []).slice(-3).join(" | ")};
              updateSendSt(key);
              break;
            }
          }else if(jr.result_session_id){
            // 非托管模式下新会话 id 只在首轮跑完的结果里才有
            if(!enterSession(jr.result_session_id)) break;
          }
        }
        if(!owns()) break;
        reconcileJob(sid || key, {...jr, id: j.job_id}, token);
        if(jr.status === "running" || jr.status === "queued") continue;
        break;
      }
    }catch(e){
      if(!owns()) return;
      sendJobs[sid || key] = {...sendJobs[sid || key], status: accepted ? "unknown" : "failed",
        error: accepted ? "状态查询失败，任务可能仍在执行：" + e.message : String(e)};
      // 查询失败保留回显，不宣称服务端执行失败。
      updateSendSt(sid || key);
    }
  };
}

function bindSendBox(id, d){
  const btn = document.getElementById("sendbtn");
  if(!btn) return;
  wireImageComposer(id);
  bindComposerKeys();
  wireCommandHints(document.getElementById("msgbox"),
    () => (view.session === id ? sessionCommands : []));
  const un = document.getElementById("unhostbtn");
  if(un) un.onclick = async () => {
    if(!d.hosted_id) return;
    un.disabled = true;
    try{
      const r = await fetchT("/hosted/" + encodeURIComponent(d.hosted_id), {method: "DELETE"}, 20000);
      if(!r.ok){
        const j = await r.json().catch(() => ({}));
        document.getElementById("sendst").textContent = "退出托管失败: " + (j.error || r.status);
      }
      curPanel = null;   // 强制整体重渲染，更新托管标识
      load();   // 状态变为未托管
    }catch(e){
      document.getElementById("sendst").textContent = "退出托管错误: " + e;
      un.disabled = false;
    }
  };
  const intBtn = document.getElementById("intbtn");
  if(intBtn) intBtn.onclick = async () => {
    intBtn.disabled = true;
    try{
      const r = await fetchT("/sessions/" + encodeURIComponent(id) + "/interrupt",
        {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"});
      const j = await r.json();
      if(!r.ok) document.getElementById("sendst").textContent = "中断失败: " + (j.error || r.status);
    }catch(e){
      document.getElementById("sendst").textContent = "中断错误: " + e;
    }finally{
      intBtn.disabled = false;
      load();
    }
  };
  const approvalSel = document.getElementById("approvalsel");
  if(approvalSel) approvalSel.onchange = async () => {
    try{
      const r = await fetchT("/sessions/" + encodeURIComponent(id) + "/approval", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({approval: approvalSel.value}),
      });
      const j = await r.json();
      if(r.ok) flashSendSt(id, "审批模式已更新");
      else document.getElementById("sendst").textContent = "失败: " + (j.error || r.status);
    }catch(e){
      document.getElementById("sendst").textContent = "审批模式保存失败: " + e;
    }
  };
  const effortSel = document.getElementById("effortsel");
  if(effortSel) effortSel.onchange = async () => {
    try{
      const r = await fetchT("/sessions/" + encodeURIComponent(id) + "/effort", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({effort: effortSel.value}),
      });
      const j = await r.json();
      if(r.ok)
        flashSendSt(id, j.warning ? ("思考档位已保存（" + j.warning + "）") : "思考档位已更新");
      else
        document.getElementById("sendst").textContent = "思考档位失败: " + (j.error || r.status);
    }catch(e){
      document.getElementById("sendst").textContent = "思考档位保存失败: " + e;
    }
  };
  btn.onclick = async () => {
    imageDraft(id).error = "";
    const submitted = captureMessageDraft(id), text = submitted.rawText.trim();
    const submittedImages = captureImageDraft(id), images = submittedImages.images;
    if(!text && !images.length) return;
    // 网页发送是用户明确点击，始终绕过会话 working 的 409 守卫
    const force = true;
    const selectedModel = modelSnapshot(id);
    if(selectedModel === undefined) return;
    // 已托管的会话 /sessions/<id>/message 会自动路由到常驻进程，无需再 POST /hosted
    const useHost = document.getElementById("hostcb").checked
      && !(d.hosted || sessions.find(s => s.id === id)?.hosted);
    const token = ++submissionToken;
    const echo = submissionEcho(id, text, token, null, images);
    sendJobs[id] = {token, status: "sending", requested_model: selectedModel, text};
    let accepted = false;
    updateSendSt(id);
    try{
      const r = await fetchT(useHost ? "/hosted" : "/sessions/" + encodeURIComponent(id) + "/message", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(useHost
          ? {resume_id: id, text, ...(images.length ? {images} : {}), force, model: selectedModel}
          : {text, ...(images.length ? {images} : {}), force, model: selectedModel}),
      }, 30000);
      const j = await r.json();
      if(!ownsSubmission(id, token)) return;
      if(r.status !== 202){
        sendJobs[id] = {token, text, status: "failed", error: j.error || ("HTTP " + r.status)};
        updateSendSt(id); return;
      }
      accepted = true;
      clearSubmittedDraft(submitted);
      clearSubmittedImages(submittedImages);
      sendJobs[id] = {token, jobId: j.job_id, status: j.status || "queued", text};
      pendingEcho[id] = {...echo, jobId: j.job_id};
      renderConvList();
      updateSendSt(id);
      // 本次刚启动托管时重建一次面板，让“托管中/退出托管”控件立即出现；
      // 已有托管或一次性消息只做软刷新，避免打断正在输入的下一条消息。
      if(useHost && composerRouteMatch(id) && panelMatch(id)) curPanel = null;
      load();
      const deadline = Date.now() + SEND_POLL_TIMEOUT_MS;
      for(;;){
        if(!ownsSubmission(id, token)) break;
        if(Date.now() >= deadline){
          sendJobs[id] = {...sendJobs[id], status: "unknown", error: "状态查询超时，任务可能仍在执行"};
          updateSendSt(id); break;
        }
        await new Promise(f => setTimeout(f, 1500));
        const poll = await fetchT("/jobs/" + encodeURIComponent(j.job_id), {}, 15000);
        const jr = await poll.json();
        if(!ownsSubmission(id, token)) break;
        if(!poll.ok || jr.error && !jr.status) throw Error(jr.error || "HTTP " + poll.status);
        reconcileJob(id, {...jr, id: j.job_id}, token);
        if(jr.status === "running" || jr.status === "queued") continue;
        break;
      }
      load();   // 软刷新最终状态，不重建输入区
    }catch(e){
      if(!ownsSubmission(id, token)) return;
      sendJobs[id] = {...sendJobs[id], status: accepted ? "unknown" : "failed",
        error: accepted ? "状态查询失败，任务可能仍在执行：" + e.message : String(e)};
      updateSendSt(id);
    }
  };
}

/* ---------- 导航与浏览器历史 ---------- */
function historyApi(){
  return typeof window !== "undefined" && window.history
    && typeof window.history.pushState === "function" ? window.history : null;
}
function readRoute(){
  const loc = typeof window !== "undefined" ? window.location : null;
  return loc ? parseRoute(loc.pathname) : null;
}
function syncUrl(v, replace){
  const h = historyApi(), loc = h ? window.location : null;
  if(!h || !loc) return;
  const next = routePath(v);
  if(next === loc.pathname) return;
  try{ (replace ? h.replaceState : h.pushState).call(h, null, "", next); }catch(e){ }
}
function clearSessionView(){
  displayedSession = null;
  for(const [, state] of queueStates) state.pop = null;   // 离开会话时收起队列详情浮层
  hideQueuePop();
  toggleTplPop(false);   // 模板浮层同样离开会话即收起，避免停在列表页
  disconnectSessionSse();
  clearLiveBubble();
  convCache = {id: null, size: -1};
  convState = {id: null, msgs: [], total: 0, cursor: 0, start: 0, size: -1,
               hasMore: false, loadingEarlier: false, detail: null};
}
let sessionReturn = null;   // 进入会话前的来源视图，会话页「返回」的目标
function navigate(next, opts){
  saveComposerDraft();   // 此时路由尚未改变；以旧输入框所属 key 保存，不能依赖 curPanel。
  next = next || {project: null, session: null, new: false};
  const leaving = view.session !== (next.session || null);
  // 从非会话视图进入会话时记录来源，会话页「返回」回到来处（托管/待处理列表）；
  // 会话间切换（/clear 换新 sid 等）不覆盖；刷新或直链进入没有来源，回退默认项目列表
  if(next.session && !view.session)
    sessionReturn = {project: view.project || null, pending: !!view.pending,
                     hosted: !!view.hosted, new: false};
  view = next;
  routeGeneration++;
  if(leaving) clearSessionView();
  syncUrl(view, !!(opts && opts.replace));
  renderMain();
}
function onPopState(){
  // 地址栏已经变化，这里只恢复视图；用 replace 避免把旧格式地址再压入一条历史记录
  navigate(readRoute() || {project: null, session: null, new: false}, {replace: true});
}

/* ---------- 主渲染 ---------- */
/* 沉浸模式：zenPref 是持久化偏好（进入会话视图时是否沉浸），只在会话视图生效；
   zenSessionOff 记录本视图内的临时退出（点击 token chip 看概览）——不落盘、
   离开会话视图或手动点 ⛶ 即失效，轮询刷新不会把它翻回沉浸；
   按钮点亮与 aria 状态绑定当前视觉态（body.zen），与偏好解耦 */
let zenPref = false, zenSessionOff = false;
try{ zenPref = localStorage.getItem("zen") === "1"; }catch(e){}
function applyZen(){
  const mainEl = document.getElementById("main");
  const inSession = !!(mainEl && mainEl.classList && mainEl.classList.contains
    && mainEl.classList.contains("convview"));
  if(!inSession) zenSessionOff = false;
  const zen = inSession && zenPref && !zenSessionOff;
  if(document.body && document.body.classList){
    document.body.classList.toggle("zen", zen);
    document.body.classList.toggle("insession", inSession);
  }
  const btn = document.getElementById("zenbtn");
  if(btn){
    btn.classList.toggle("on", zen);
    btn.setAttribute("aria-pressed", zen ? "true" : "false");
  }
}
function setZen(on){
  zenPref = !!on;
  zenSessionOff = false;
  try{ localStorage.setItem("zen", zenPref ? "1" : "0"); }catch(e){}
  applyZen();
}
function renderPendingBadge(){
  const total = sessions.reduce((sum, s) => sum + (s.pending_interactions || 0), 0);
  const el = document.getElementById("pendingbadge");
  if(!el) return;
  el.style.display = "inline-block";
  el.textContent = "待审批 " + total;
}
function renderHostedBadge(){
  const total = sessions.filter(s => s.hosted).length;
  const el = document.getElementById("hostedbadge");
  if(!el) return;
  el.style.display = total ? "inline-block" : "none";

function renderMain(){
  // 会话视图的聊天窗口布局类：显式切换，替代 main:has(>#conv)（旧引擎也可靠生效）
  const mainEl = document.getElementById("main");
  if(mainEl && mainEl.classList && mainEl.classList.toggle)
    mainEl.classList.toggle("convview", !!(view.session && !view.pending && !view.hosted));
  applyZen();   // convview 切换后同步沉浸/会话视图标记（列表页自动退出沉浸）
  const projects = groupByProject();
  resolveViewProject(projects);
  // 遗留错误 URL 兜底：项目路径形如 <已知项目>/s/<相对文件路径>（浏览器把消息里的
  // 相对链接错误解析成的地址）时直接跳预览，不再当成项目渲染
  if(!view.session && !view.pending && !view.hosted){
    const vu = routeFileUrl(projects, view.fullProject || view.project);
    if(vu && location.replace) return location.replace(vu);
  }
  renderSidebar(projects);
  document.getElementById("total").textContent = `(${sessions.length})`;
  renderPendingBadge();
  renderHostedBadge();
  if(view.pending){ renderPendingList(); return; }
  if(view.hosted){ renderHostedList(); return; }
  if(view.session){
    // 单段文件 URL 同步判定直接跳预览，零探测请求；已知会话不被劫持
    const su = sessionFileRedirectUrl(view.session);
    if(su && location.replace) return location.replace(su);
    syncUrl(view, true);   // 旧格式编码地址自动规整成可读路径
    renderConversation(view.session, false);
    return;
  }
  if(projects.length && (!view.project || !projects.some(p => p.cwd === view.project)))
    // 侧栏固定排序后，初次进入仍默认选中最近活跃的项目；
    // 数据未到（刚启动的空快照）不选默认，保留 URL 信息等下一轮解析
    view.project = projects.reduce((a, b) => b.last > a.last ? b : a).cwd;
  if(view.project) syncUrl(view, true);   // 默认项目解析后用 replace 落地址，不新增历史记录
  renderSidebar(projects);   // 更新 active 高亮
  const p = projects.find(x => x.cwd === view.project);
  const main = document.getElementById("main");
  if(p){
    if(view.new){ renderNewSession(p); return; }
    renderSessionList(p);
  }
  else main.innerHTML = '<div class="empty">暂无会话</div>';
}

/* ---------- 数据 ---------- */
let loading = false;        // 上一轮 /sessions 还没回来就跳过本轮定时刷新，
                            // 否则大转录的慢请求会堆积、占满浏览器同源连接池，
                            // 后续请求（如发消息的 POST）永远排不上队
async function load(){
  if(loading) return;
  loading = true;
  lastListLoad = Date.now();
  const version = sessionsVersion;
  try{
    const r = await fetchT("/sessions");
    const next = await r.json();
    if(version !== sessionsVersion) return;   // 请求期间已有 SSE 快照，旧 HTTP 列表不能覆盖它。
    if(!r.ok) throw Error("HTTP " + r.status);
    applySessions(next);
    document.getElementById("err").textContent = "";
    document.getElementById("updated").textContent = "更新于 " + new Date().toLocaleTimeString();
  }catch(e){
    document.getElementById("err").textContent = "连接失败: " + e.message;
  }finally{
    loading = false;
  }
}

// 队列详情浮层：只能点击 chip 展开/收起（不做悬停/聚焦预览），外点或 Esc 收起
(function(){
  const chipFrom = t => t && t.closest && t.closest(".queue-chip");
  const main = document.getElementById("main");
  // 键盘等价于点击（悬浮/聚焦不再自动展开）
  main.addEventListener("keydown", e => {
    if((e.key === "Enter" || e.key === " ") && chipFrom(e.target) && view.session){
      e.preventDefault?.();
      toggleQueuePop(view.session);
    }
  });
  const pop = document.getElementById("queuepop");
  pop.addEventListener("click", e => {
    const cancel = e.target.closest && e.target.closest("[data-cancel-job]");
    if(cancel){ e.preventDefault?.(); cancelQueueJob(cancel.dataset.sid, cancel.dataset.cancelJob); }
  });
  document.addEventListener("click", e => {
    if(!view.session || !queueState(view.session).pop) return;
    const live = document.getElementById("queuepop");
    if(live && e.target && live.contains && live.contains(e.target)) return;
    if(chipFrom(e.target)) return;
    closeQueuePop(view.session);
  });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape" && view.session && queueState(view.session).pop) closeQueuePop(view.session);
  });
  const reposition = () => { if(view.session && queueState(view.session).pop) positionQueuePop(); };
  document.addEventListener("scroll", reposition, true);
  if(typeof window !== "undefined" && window.addEventListener) window.addEventListener("resize", reposition);
})();

function fmtGB(n){ return ((n || 0) / 2 ** 30).toFixed(1) + " GB"; }
function fmtUptime(sec){
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  return d ? `${d} 天 ${h} 小时` : h ? `${h} 小时 ${m} 分` : `${m} 分钟`;

function fmtRemain(sec){
  const m = Math.floor(sec / 60), s = sec % 60;

  if(!data) return '<div class="mut">加载中…</div>';
  // 错误分支也保留操作提示与定时行：已设定的定时仍在跑，错误态下必须还能看到剩余时间并取消
  if(data.error) return `${sysPop.note ? `<div role="status" style="margin-top:6px">${esc(sysPop.note)}</div>` : ""}
    <div class="terror">${esc(data.error)}</div>
    ${systimerHtml(data)}`;
  const cpu = data.cpu_percent || 0;
  const cores = (data.cpu_cores || []).map((p, i) =>
    `<div class="core"><span>核${i + 1} ${Math.round(p)}%</span><div class="sysbar ${barClass(p)}"><i style="width:${Math.min(100, p)}%"></i></div></div>`).join("");
  const mem = data.mem_percent || 0;
  return `<div class="sysrow"><span>CPU</span><b style="color:var(--fg);font-size:16px">${cpu.toFixed(1)}%</b></div>
    <div class="sysbar ${barClass(cpu)}"><i style="width:${Math.min(100, cpu)}%"></i></div>
    ${cores ? `<div class="syscores">${cores}</div>` : ""}
    <div class="sysrow"><span>内存</span><span>${fmtGB(data.mem_used)} / ${fmtGB(data.mem_total)}（${Math.round(mem)}%）</span></div>
    <div class="sysbar ${barClass(mem)}"><i style="width:${Math.min(100, mem)}%"></i></div>
    ${data.swap_total ? `<div class="sysrow"><span>交换</span><span>${fmtGB(data.swap_used)} / ${fmtGB(data.swap_total)}（${Math.round(data.swap_percent || 0)}%）</span></div>
    <div class="sysbar"><i style="width:${Math.min(100, data.swap_percent || 0)}%"></i></div>` : ""}
    <div class="sysrow" style="margin-top:10px"><span>已运行 ${fmtUptime(data.uptime || 0)} · ${esc(data.hostname || "")}</span></div>
    ${sysPop.note ? `<div role="status" style="margin-top:6px">${esc(sysPop.note)}</div>` : ""}
    ${orphansHtml(data)}
    ${keepAwakeHtml(data)}
    ${systimerHtml(data)}
    ${notifyFilterHtml()}
    <div class="sysacts"><button class="ibtn danger" data-power="restart">重启</button>
      <button class="ibtn danger" data-power="sleep">睡眠</button></div>`;
}
function positionSysPop(){
  const pop = document.getElementById("syspop"), btn = document.getElementById("sysbtn");
  if(!pop || pop.hidden || !btn) return;
  const rect = btn.getBoundingClientRect && btn.getBoundingClientRect();
  const root = document.documentElement;
  const vw = root ? root.clientWidth : 0, vh = root ? root.clientHeight : 0;
  if(!rect || !vw || !vh) return;   // 无布局环境（单测假 DOM）时只展示不定位
  const w = pop.offsetWidth || 0, h = pop.offsetHeight || 0;
  let left = Math.min(Math.max(8, rect.right - w), vw - w - 8);
  let top = rect.bottom + 6;   // 优先浮在按钮下方，放不下再向上
  if(top + h > vh - 8) top = Math.max(8, rect.top - h - 6);
  pop.style.left = Math.round(left) + "px";
  pop.style.top = Math.round(top) + "px";
}
function renderSysPop(){
  const pop = document.getElementById("syspop");
  if(!pop || !sysPop.timer) return;
  // 3 秒轮询会整体重写 innerHTML，先记住用户选的预设时长再恢复，避免下拉被重置
  const prev = document.getElementById("sleeptimermin"), prevVal = prev ? prev.value : null;
  pop.innerHTML = sysPopHtml(sysData);
  if(prevVal){
    const sel = document.getElementById("sleeptimermin");
    if(sel) sel.value = prevVal;
  }
  pop.hidden = false;
  positionSysPop();
}
async function loadSystem(){
  if(sysPop.loading || !sysPop.timer) return;   // 上一请求未结束不叠加
  sysPop.loading = true;
  const prevRem = sysData ? sysData.sleep_timer_remaining : undefined;   // 失败时保留最后已知的定时状态
  try{
    const r = await fetchT("/system");
    let j = null;
    try{ j = await r.json(); }catch(e){}
    sysData = r.ok ? (j || {error: "响应格式异常"})
      : {error: (j && j.error) || `HTTP ${r.status}`,
         sleep_timer_remaining: j && j.sleep_timer_remaining != null ? j.sleep_timer_remaining : prevRem};
  }catch(e){ sysData = {error: "查询失败：" + (e && e.message || e), sleep_timer_remaining: prevRem}; }
  sysPop.loading = false;
  renderSysPop();
}
function toggleSysPop(open){
  const pop = document.getElementById("syspop");
  if(!pop || open === (sysPop.timer != null)) return;
  if(open){
    sysData = null; sysPop.note = "";
    sysPop.timer = setInterval(loadSystem, 3000);   // 展开期间 3 秒自动刷新
    // setInterval 不会立即触发；先设 timer（renderSysPop/loadSystem 以它为展开标志）再手动首渲并发请求
    renderSysPop();
    loadSystem();
  }else{
    clearInterval(sysPop.timer); sysPop.timer = null;
    pop.hidden = true; pop.innerHTML = "";
  }
}
async function sendPower(action){
  const text = action === "restart"
    ? "确定要重启这台电脑？正在执行的会话任务会被中断。"
    : "确定要使这台电脑进入睡眠？";
  if(!window.confirm(text)) return;
  try{
    const r = await fetchT("/system/power", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({action})});
    let j = null;
    try{ j = await r.json(); }catch(e){}
    sysPop.note = r.ok && j && j.ok
      ? (action === "restart" ? "已发送重启指令，服务即将中断…" : "已发送睡眠指令…")
      : (j && j.error) || "执行失败";
  }catch(e){ sysPop.note = "执行失败：" + (e && e.message || e); }
  renderSysPop();
}
async function setSleepTimer(minutes){
  // 定时可随时取消，不需要 confirm；成功后先把 remaining 写回本地数据，行立即切换、下轮轮询校正
  try{
    const r = await fetchT("/system/sleep-timer", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({minutes})});
    let j = null;
    try{ j = await r.json(); }catch(e){}
    if(r.ok && j && j.ok){
      sysPop.note = minutes ? `已设定定时睡眠（约 ${minutes} 分钟后）` : "已取消定时睡眠";
      if(sysData) sysData.sleep_timer_remaining = j.remaining;   // 错误态也要切行，取消入口常在
    }else{
      sysPop.note = (j && j.error) || "执行失败";
    }
  }catch(e){ sysPop.note = "执行失败：" + (e && e.message || e); }
  renderSysPop();
}
// 不 stopPropagation：syspop 自己的 document 级关闭 handler 已豁免 #sysbtn，
// 放行冒泡可让队列浮层等其他 document 级浮层借这次点击正常收起
document.getElementById("notifybtn").addEventListener("click", async () => {
  if(!window.Notification){ alert("当前浏览器不支持通知"); return; }
  if(notifyOn()){
    localStorage.setItem("notify", "0");
  }else{
    // 权限申请必须发生在用户手势里；denied 时不再重复弹窗，引导到站点设置
    if(Notification.permission === "denied"){
      alert("浏览器已拒绝通知权限，请在地址栏的站点设置中允许通知");
      return;
    }
    if(Notification.permission !== "granted"){
      const p = await Notification.requestPermission();
      if(p !== "granted") return;
    }
    localStorage.setItem("notify", "1");
  }
  updateNotifyBtn();
});
updateNotifyBtn();

document.getElementById("sysbtn").addEventListener("click", e => {
  toggleSysPop(sysPop.timer == null);
});
document.getElementById("syspop").addEventListener("change", e => {

  if(e.target.id === "notifymindur") localStorage.setItem("notify_min_duration", e.target.value);

async function endOrphans(body){
  try{
    const r = await fetchT("/system/orphans/end", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    const j = await r.json().catch(() => null);
    if(r.ok && j && sysData){
      sysData.orphans = j.orphans || [];
      sysPop.note = "已发送终止指令";
    }else{
      sysPop.note = (j && j.error) || "操作失败";
    }
  }catch(e){ sysPop.note = "操作失败：" + (e && e.message || e); }
  renderSysPop();
}
async function setKeepAwake(enabled){
  try{
    const r = await fetchT("/system/keep-awake", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({enabled})});
    let j = null;
    try{ j = await r.json(); }catch(e){}
    if(r.ok && j && sysData){
      sysData.keep_awake = j.keep_awake;
      sysData.awake_held = j.awake_held;
      sysPop.note = enabled ? "已开启：有会话工作时阻止系统自动睡眠" : "已关闭推迟睡眠";
    }else{
      sysPop.note = (j && j.error) || "设置失败";
    }
  }catch(e){ sysPop.note = "设置失败：" + (e && e.message || e); }
  renderSysPop();
}
document.getElementById("syspop").addEventListener("click", e => {
  const btn = e.target.closest && e.target.closest("[data-power]");
  if(btn){ e.preventDefault(); sendPower(btn.dataset.power); return; }
  const orphanEnd = e.target.closest && e.target.closest("[data-orphan-end]");
  if(orphanEnd){
    if(window.confirm(`结束进程 #${orphanEnd.dataset.orphanEnd}？`))
      endOrphans({pid: Number(orphanEnd.dataset.orphanEnd)});
    return;
  }
  if(e.target.closest && e.target.closest("[data-orphan-end-all]")){
    if(window.confirm("结束全部残留进程？")) endOrphans({all: true});
    return;
  }
  const set = e.target.closest && e.target.closest("[data-sleep-set]");
  if(set){
    const sel = document.getElementById("sleeptimermin");
    setSleepTimer(parseInt(sel && sel.value, 10) || 30);
    return;
  }
  const cancel = e.target.closest && e.target.closest("[data-sleep-cancel]");
  if(cancel) setSleepTimer(0);
});
document.addEventListener("click", e => {

document.addEventListener("scroll", () => { if(sysPop.timer) positionSysPop(); }, true);

  window.addEventListener("resize", () => { if(sysPop.timer) positionSysPop(); });

document.getElementById("tplpop").addEventListener("input", e => {

/* ---------- 对话内的复制 / 图片灯箱 / 子代理跳转 ---------- */
function copyToClipboard(text, button){
  const done = () => {
    if(!button) return;
    const old = button.textContent;
    button.textContent = "已复制";
    setTimeout(() => { button.textContent = old; }, 1500);
  };
  const fallback = () => {
    try{
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
      done();
    }catch(e){ /* 无剪贴板权限时保持按钮原状 */ }
  };
  try{
    if(window.navigator && navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }catch(e){ fallback(); }
}
function openLightbox(src, alt){
  const box = document.getElementById("lightbox");
  const image = box && box.querySelector ? box.querySelector("img") : null;
  if(!box || !image) return;
  image.src = src || ""; image.alt = alt || "图片";
  box.hidden = false;
}
function closeLightbox(){
  const box = document.getElementById("lightbox");
  const image = box && box.querySelector ? box.querySelector("img") : null;
  if(box){ box.hidden = true; }
  if(image){ image.removeAttribute ? image.removeAttribute("src") : image.src = ""; image.alt = ""; }
}
function scrollToAgent(tid){
  if(!tid || !document.querySelectorAll) return;
  const nodes = document.querySelectorAll("[data-agent-tid]");
  for(const node of nodes){
    if(node.dataset && node.dataset.agentTid === tid){
      if(node.scrollIntoView) node.scrollIntoView({behavior: "smooth", block: "center"});
      return;
    }
  }
}
function handleConvClick(event){
  const target = event.target;
  const closest = sel => target && target.closest ? target.closest(sel) : null;
  const copyBtn = closest("[data-copy]");
  if(copyBtn){
    const msg = copyBtn.closest ? copyBtn.closest(".msg") : null;
    let text = msg && msg.__copyText;
    if(!text && msg && msg.querySelectorAll){
      text = [...msg.querySelectorAll(".abody,.ubody")].map(el => el.textContent || "").join("\n\n").trim();
    }
    if(text) copyToClipboard(text, copyBtn);
    return;
  }
  const image = closest("img[data-lightbox]");
  if(image){ openLightbox(image.src, image.alt); return; }
  const subagent = closest("[data-open-subagent]");
  if(subagent && subagent.dataset){
    navigate({project: view.project, session: subagent.dataset.openSubagent, new: false});
    return;
  }
  const agentChip = closest("[data-scroll-agent]");
  if(agentChip && agentChip.dataset) scrollToAgent(agentChip.dataset.scrollAgent);
}
if(document.addEventListener){
  document.addEventListener("click", handleConvClick);
  document.addEventListener("keydown", event => {
    const box = document.getElementById("lightbox");
    if(event.key === "Escape" && box && !box.hidden) closeLightbox();
  });
}
const lightboxClose = document.getElementById("lightboxclose");
if(lightboxClose) lightboxClose.onclick = closeLightbox;
const lightboxBox = document.getElementById("lightbox");
if(lightboxBox) lightboxBox.onclick = event => { if(event.target === lightboxBox) closeLightbox(); };

}
